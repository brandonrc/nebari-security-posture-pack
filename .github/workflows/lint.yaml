name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | \
            sudo tar -xz -C /usr/local/bin kubeconform

      - name: Build chart dependencies
        run: helm dependency build chart/

      - name: Lint chart
        run: helm lint chart/

      - name: Lint chart (grace values)
        run: helm lint chart/ -f deploy/grace/values.yaml

      - name: Template (NebariApp disabled, defaults)
        run: |
          helm template test chart/ --set nebariapp.enabled=false > /tmp/disabled.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/disabled.yaml

      - name: Template (NebariApp enabled)
        run: |
          helm template test chart/ --set nebariapp.enabled=true \
            --set nebariapp.hostname=test.example.com > /tmp/enabled.yaml
          grep -q 'kind: NebariApp' /tmp/enabled.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/enabled.yaml

      - name: Template (chart-rendered SecurityPolicy)
        run: |
          helm template test chart/ --set nebariapp.enabled=true \
            --set nebariapp.hostname=test.example.com \
            --set adminGate.securityPolicy.enabled=true > /tmp/sp.yaml
          grep -q 'kind: SecurityPolicy' /tmp/sp.yaml
          grep -q 'enforceAtGateway: false' /tmp/sp.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/sp.yaml

      - name: Template (external database, no bundled scanners)
        run: |
          helm template test chart/ --set postgresql.enabled=false \
            --set externalDatabase.host=db.example.com \
            --set externalDatabase.existingSecret=db-creds \
            --set scanner.clair.enabled=false --set scanner.trivy.enabled=false \
            | kubeconform -strict -ignore-missing-schemas -summary

      - name: Template (grace values)
        run: |
          helm template security-posture chart/ -n security-posture \
            -f deploy/grace/values.yaml | kubeconform -strict -ignore-missing-schemas -summary

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck deploy scripts
        run: shellcheck deploy/grace/*.sh
