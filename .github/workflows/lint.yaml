name: Lint

# `lint` and `chart` are required status checks on master (see CONTRIBUTING.md).

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HELM_VERSION: v3.19.2
  KUBECONFORM_VERSION: v0.8.0
  HELM_UNITTEST_VERSION: v1.2.1
  ACTIONLINT_VERSION: 1.7.12

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: ruff (api)
        working-directory: api
        run: |
          python -m pip install ruff==0.16.10
          ruff check --output-format=github src tests
      - name: shellcheck (deploy scripts, CI scripts)
        run: shellcheck deploy/grace/*.sh .github/scripts/*.sh
      - name: actionlint (workflows)
        run: |
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: eslint + tsc (ui)
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm run typecheck

  chart:
    name: chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Build chart dependencies
        run: helm dependency build chart/
      - name: Render matrix (lint, 18 value sets x kubeconform with CRD schemas, 4 expected failures)
        run: .github/scripts/chart-matrix.sh
