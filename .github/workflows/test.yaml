name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('api/pyproject.toml') != '' }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest -q

  ui:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('ui/package.json') != '' }}
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Type-check and unit tests
        run: |
          npm run build
          npm test -- --run
