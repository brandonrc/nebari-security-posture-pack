name: Test

# Job names are the required status checks on master (see CONTRIBUTING.md):
# `test` and `ui` are gate jobs that aggregate the matrix/sub-jobs below, so the
# required-check names stay stable when the matrix changes. Do not rename them
# without updating the ruleset.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: api (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: posture
          POSTGRES_PASSWORD: posture
          POSTGRES_DB: posture_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U posture" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://posture:posture@localhost:5432/posture_test
      CONTROLS_ENGINE_ENABLED: "false"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: api/uv.lock
      - name: WeasyPrint system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - name: Install (from uv.lock)
        run: |
          python -m pip install uv==0.11.33
          uv export --frozen --extra dev --no-emit-project --no-header -o /tmp/requirements.txt
          python -m pip install --require-hashes -r /tmp/requirements.txt
          python -m pip install --no-deps -e .
      - name: Test (coverage gate 85% line+branch)
        run: >-
          python -m pytest -q -p no:randomly
          --cov=posture --cov-branch --cov-fail-under=85
          --cov-report=xml --cov-report=json --cov-report=term-missing:skip-covered
          --junitxml=junit.xml
      - name: Per-module coverage floors
        if: ${{ !cancelled() }}
        run: python ../.github/scripts/coverage_floors.py coverage.json
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          python -c "import json; t=json.load(open('coverage.json'))['totals']; print(f\"### Python ${{ matrix.python }} coverage: {t['percent_covered']:.1f}% (line+branch)\")" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: api-coverage-py${{ matrix.python }}
          path: |
            api/coverage.xml
            api/coverage.json
            api/junit.xml
          retention-days: 14
      - name: Upload to Codecov
        if: ${{ !cancelled() && matrix.python == '3.12' && env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: api/coverage.xml
          flags: api
          fail_ci_if_error: false

  mypy:
    # Advisory: reports the error count without failing the build. Make it blocking
    # (drop continue-on-error) once the count reaches 0.
    name: mypy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/uv.lock
      - name: Install (from uv.lock)
        run: |
          python -m pip install uv==0.11.33
          uv export --frozen --extra dev --extra lint --no-emit-project --no-header -o /tmp/requirements.txt
          python -m pip install --require-hashes -r /tmp/requirements.txt
          python -m pip install --no-deps -e .
      - name: mypy
        run: |
          set +e
          python -m mypy > mypy.txt 2>&1; rc=$?
          tail -1 mypy.txt
          echo "### mypy: $(tail -1 mypy.txt)" >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  test:
    # Required check. Green only when every api matrix leg passed.
    name: test
    if: ${{ always() }}
    needs: [api]
    runs-on: ubuntu-latest
    steps:
      - name: All api legs passed
        run: |
          echo "api: ${{ needs.api.result }}"
          test "${{ needs.api.result }}" = "success"
