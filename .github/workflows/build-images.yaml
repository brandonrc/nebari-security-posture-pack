name: Build Docker Images

# Builds and publishes the pack's three first-party images via the shared
# reusable workflow in nebari-dev/.github. Each image is pushed to GHCR and
# quay.io with `sha-<short>` and `latest` tags (QUAY_TOKEN / QUAY_USERNAME are
# org-provided secrets in nebari-dev).
#
# chart/Chart.yaml is in the trigger on purpose: release.yaml pins the image
# tags to sha-<release-commit>, so the release commit (a Chart.yaml bump) must
# produce images with that sha.
#
# Published as quay.io/nebari/nebari-security-posture-pack-{api,worker,ui}
# (the reusable workflow names images <repo>-<image>), matching the chart
# defaults in chart/values.yaml.

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "ui/**"
      - ".github/workflows/build-images.yaml"
      - "chart/Chart.yaml"
  pull_request:
    paths:
      - "api/**"
      - "ui/**"
      - ".github/workflows/build-images.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    # The reusable workflow's job asks for packages: write (GHCR push); without granting it here
    # every run was a startup_failure. On pull requests nothing is pushed. This workflow publishes
    # only from nebari-dev's `main`; image-scan.yaml builds and scans the same images on every
    # branch and PR.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: api
            dockerfile: api/Dockerfile.api
          - image: worker
            context: api
            dockerfile: api/Dockerfile.worker
          - image: ui
            context: ui
            dockerfile: ui/Dockerfile
    uses: nebari-dev/.github/.github/workflows/pack-build-image.yaml@v1
    with:
      image: ${{ matrix.image }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      push: ${{ github.event_name != 'pull_request' }}
    secrets:
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
