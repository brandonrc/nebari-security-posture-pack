# Dependency updates (quality review m3). Minor/patch bumps are grouped per ecosystem to keep the
# PR count manageable; majors come one PR each. Scanner binary versions (TRIVY_/GRYPE_/CLAIRCTL_/
# COSIGN_VERSION ARGs in api/Dockerfile.worker) are not covered by Dependabot: bump them by hand
# together with the parser fixtures (api/tests/fixtures/README.md) and .github/cst/worker.yaml.
version: 2
updates:
  - package-ecosystem: uv            # api/pyproject.toml + api/uv.lock (the images install from the lock)
    directory: /api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      # Lockstep pairs (issue #12), all update types incl. majors; listed before npm-minor because
      # Dependabot puts a dependency into the first group that matches.
      vite:                            # the React plugin's peer range follows vite majors
        patterns: ["vite", "@vitejs/plugin-react"]
      vitest:                          # the coverage provider must be the exact same version
        patterns: ["vitest", "@vitest/coverage-v8"]
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # must match the mcr.microsoft.com/playwright:v1.63.0-noble CI image; bump both together
      - dependency-name: "@playwright/test"
      # pinned ~1.6.0: 1.8 changes the toast types the vendored toast relies on (ui/README.md);
      # patch updates within 1.6.x still come through npm-minor
      - dependency-name: "@base-ui/react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: docker        # python:3.13-slim-trixie, node:22-alpine, nginx-unprivileged (tag+digest)
    directories: [/api, /ui]
    schedule: { interval: weekly, day: monday }
    groups:
      base-images:
        update-types: [minor, patch]

  - package-ecosystem: helm          # chart/Chart.yaml dependencies (nebari-app)
    directory: /chart
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: github-actions  # SHA-pinned actions in .github/workflows
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        update-types: [minor, patch]
