# Reviewed exceptions for the CRITICAL+fixable gate in image-scan.yaml. Every entry expires: when
# it does, the gate fails again until the image is rebuilt on a fixed base/binary or the entry is
# re-reviewed. Keep this list short. (HIGH findings are reported via SARIF but do not gate.)
vulnerabilities:
  # worker: clairctl 4.9.0 is the upstream release binary (Go 1.24.10, pgx 5.7.6); fixed only by a
  # newer clairctl release. clairctl is a CLI client in the worker: it does not use pgx's server-side
  # paths. Bump CLAIRCTL_VERSION in api/Dockerfile.worker when quay/clair ships a rebuilt release.
  - id: CVE-2025-68121
    paths: ["usr/local/bin/clairctl"]
    statement: upstream clairctl 4.9.0 binary (Go stdlib 1.24.10); awaiting a clair release
    expired_at: 2026-11-15
  - id: CVE-2026-33815
    paths: ["usr/local/bin/clairctl"]
    statement: pgx in the upstream clairctl binary; client-only use, no database connection
    expired_at: 2026-11-15
  - id: CVE-2026-33816
    paths: ["usr/local/bin/clairctl"]
    statement: pgx in the upstream clairctl binary; client-only use, no database connection
    expired_at: 2026-11-15
