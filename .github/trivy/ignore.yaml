# Reviewed exceptions for the fixable CRITICAL/HIGH gate in image-scan.yaml. Every entry expires: when
# it does, the gate fails again until the image is rebuilt on a fixed base/binary or the entry is
# re-reviewed. Keep this list short. Unfixed CVEs (no fixed version) are not gated; they are triaged
# in api/vex/posture-images.vex.json (OpenVEX) instead.
#
# Empty since 2026-10-05 (docs/DECISIONS.md "image hardening"): the clairctl entries (Go stdlib, pgx)
# went away when clairctl/cosign/skopeo started being built from their release tags with patched
# dependencies (api/Dockerfile.worker, gobuild stage), and the ui openssl entry with the
# nginx-unprivileged 1.31-alpine-slim base + apk upgrade.
#
# Entry format:
#   - id: CVE-YYYY-NNNNN
#     paths: ["usr/local/bin/<binary>"]   # optional: narrow to one file
#     statement: why it is acceptable until the expiry, and what fixes it
#     expired_at: YYYY-MM-DD
vulnerabilities: []
