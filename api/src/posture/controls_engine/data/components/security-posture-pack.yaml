id: security-posture
uuid: 960549f3-03bc-4540-8cb3-61d99d289b9b
title: Nebari Security Posture pack
type: software
purpose: Continuous vulnerability scanning, configuration posture checks and compliance evidence.
description: >-
  Inventories every container in the cluster, scans each unique image with Trivy, Grype and Clair,
  evaluates workload posture checks, tracks remediation SLAs, generates POA&M/STIG/OSCAL reports
  and runs this control evidence engine.
implemented-requirements:
  - control: RA-5
    statement: Running container images are scanned for vulnerabilities on a schedule; the latest scan completed within twice the interval.
    assertions: [pack-scan-recent]
    responsibility: shared
    customer: Scan what the pack cannot see (nodes, application dependencies outside images, web applications), analyze the results and share them (RA-5 b-f).
    ceiling: partial
    ceilingReason: the evidence covers scanning of container images (RA-5 a) only
  - control: RA-5(2)
    statement: Every enabled scanner's vulnerability database was updated within 72 hours.
    assertions: [pack-scanner-db-fresh]
    responsibility: provider
  - control: SI-2
    statement: >-
      No open finding on a running image is past its severity-based remediation due date (the due
      date runs from the first time the finding was seen on the repository, not per image digest).
    assertions: [pack-sla-overdue]
    responsibility: shared
    customer: Remediate findings in program images; test updates (SI-2 b) and incorporate flaw remediation into CM (SI-2 d).
    assigned: rest
  - control: CA-5
    statement: A POA&M report was generated from the latest scan; maintaining and approving it remains an ISSO task.
    assertions: [pack-poam-current]
    responsibility: shared
    customer: Review, approve and maintain the POA&M; set risk ratings and milestones.
    ceiling: partial
    ceilingReason: a generated file is not a maintained and approved POA&M
  - control: CM-8
    statement: The component inventory (every container image, digest and workload) is refreshed on each scan.
    assertions: [pack-inventory-current]
    responsibility: shared
    customer: Maintain the inventory of components outside the cluster and assign component owners.
    assigned: rest
