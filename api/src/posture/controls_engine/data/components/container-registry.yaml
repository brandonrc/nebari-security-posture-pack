id: container-registry
uuid: 1ade64be-821a-482b-b567-1cd734dd8e9f
title: Container registry
type: service
purpose: Stores the container images deployed to the cluster (and the scan mirror).
description: >-
  The in-cluster OCI registry stores platform and application images. Pushing images must require
  authentication: an anonymous registry lets any compromised pod replace images.
implemented-requirements:
  - control: AC-3
    statement: The registry's API requires authentication (checked with a read-only `GET /v2/` probe).
    assertions: [reg-access-restricted]
    responsibility: shared
    customer: Define who may push and pull images and review the registry accounts.
    assigned: rest
  - control: CM-5
    statement: >-
      Changes to deployed images are restricted to authenticated registry clients (logical access
      restriction for change, CM-5 objective 6).
    assertions: [reg-access-restricted]
    responsibility: shared
    customer: Define, document and approve the access restrictions for changes (CM-5 objectives 1-5), including the CI identities allowed to push.
    assigned: rest
