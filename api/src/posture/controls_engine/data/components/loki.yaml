id: loki
uuid: ce29a69c-6b2f-460e-b689-7074c8829834
title: Loki / Promtail (lgtm pack)
type: service
purpose: Central collection and retention of container and node logs.
description: >-
  Promtail (or Grafana Alloy) ships the logs of every pod to Loki, where they are retained and
  searchable from Grafana.
implemented-requirements:
  - control: AU-4
    statement: Loki deletes logs only after the configured retention period (retention must be enabled).
    assertions: [log-retention]
    responsibility: shared
    customer: Allocate audit storage capacity per the retention requirement.
    assigned: rest
  - control: AU-5
    statement: Prometheus has alerting rules for failures of the log pipeline (Loki / Promtail / Alloy errors).
    assertions: [log-pipeline-alerting]
    responsibility: shared
    customer: Define who is alerted and the actions taken on an audit logging failure (AU-5 b).
    assigned: rest
  - control: AU-11
    statement: Loki retains logs for at least the organization-defined period (`controlsEngine.parameters.minLogRetentionDays`).
    assertions: [log-retention]
    responsibility: shared
    customer: Set the retention ODP (e.g. OMB M-21-31) and ensure off-cluster archival where required.
    assigned: rest
  - control: AU-12
    statement: Every running namespace produces log records that reach Loki.
    assertions: [log-ingest-all-namespaces]
    responsibility: shared
    customer: Ensure applications write audit-relevant events to stdout/stderr so they reach Loki; review and analysis (AU-6) remains the program's process.
    assigned: rest
