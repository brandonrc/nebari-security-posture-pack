# OSCAL-style component definition (converted to OSCAL 1.1.2 by controls_engine.ssp).
id: keycloak
uuid: 0686a48a-2477-4d58-b225-66a0c4f07490
title: Keycloak
type: service
purpose: Identity provider (OIDC) for every Nebari application and for the Kubernetes-facing tools.
description: >-
  Keycloak realm `nebari` authenticates all users of Nebari applications. The Envoy Gateway
  SecurityPolicies rendered by the nebari-operator delegate authentication to it, and groups in
  the realm drive authorization (NebariApp `auth.groups`).
implemented-requirements:
  - control: AC-2
    statement: >-
      Self-service registration is disabled in the realm, so accounts are created only by an
      administrator (evidence for AC-2 e/f only).
    assertions: [kc-self-registration-disabled]
    responsibility: shared
    customer: Define account types, approvals, account managers, reviews, notifications and disablement (AC-2 a-l); the platform only prevents self-registration.
    assigned: rest
    ceiling: partial
    ceilingReason: the platform evidences one of the twelve AC-2 parts (no self-registration)
  - control: AC-6(5)
    statement: >-
      The realm `admin` role is held only by the subjects listed in the approved privileged-account
      allowlist (`controlsEngine.adminSubjects`).
    assertions: [kc-admin-role-allowlist]
    responsibility: shared
    customer: Approve the privileged-account allowlist and review it periodically.
    assigned: rest
  - control: AC-7
    statement: >-
      Keycloak brute-force detection locks an account after the configured number of consecutive
      failed logons within the configured window, for at least the configured lockout duration (or
      until an administrator releases it).
    assertions: [kc-brute-force-protection]
    responsibility: provider
  - control: AC-12
    statement: >-
      SSO sessions are terminated after the idle timeout and the maximum session lifespan; the
      "remember me" option that would extend sessions is disabled.
    assertions: [kc-session-timeouts, kc-remember-me-disabled]
    responsibility: provider
  - control: SC-10
    statement: >-
      SSO sessions (and the gateway sessions that depend on them) end after the configured idle
      timeout.
    assertions: [kc-session-timeouts]
    responsibility: shared
    customer: Terminate network connections of application protocols that do not use the platform SSO session (e.g. database or SSH sessions).
    assigned: rest
  - control: AU-2
    statement: Keycloak records administrative events with their details.
    assertions: [kc-admin-events]
    responsibility: shared
    customer: Decide which events are logged (AU-2 a-e is an organizational selection) and coordinate with the organization's audit function.
    assigned: rest
  - control: AU-3
    statement: Admin events include the full representation of the change (who, what, when, from where).
    assertions: [kc-admin-events]
    responsibility: shared
    customer: Ensure application audit records contain the AU-3 content for application events.
    assigned: rest
  - control: AU-11
    statement: Stored Keycloak events expire after the configured retention period (`eventsExpiration`).
    assertions: [kc-login-events]
    responsibility: shared
    customer: Set the retention ODP and archive identity events off-cluster where the retention exceeds Keycloak's store.
    assigned: rest
  - control: AU-12
    statement: >-
      Event generation is enabled for the realm and the stored event types include successful and
      failed logins and logouts.
    assertions: [kc-login-events, kc-admin-events]
    responsibility: shared
    customer: Generate audit records for application-level events.
    assigned: rest
  - control: IA-2
    statement: Every interactive user of a Nebari application is uniquely identified and authenticated by Keycloak.
    assertions: [app-gateway-auth]
    responsibility: shared
    customer: Ensure every application endpoint requires the platform identity (no local accounts) and document exceptions.
    assigned: rest
  - control: IA-2(1)
    statement: >-
      The realm's browser flow requires a second factor (OTP, WebAuthn or X.509) and every member of
      the administrator group has one enrolled.
    assertions: [kc-admin-mfa]
    responsibility: shared
    customer: For DoD, privileged MFA must use PKI/CAC (IA-2(12), DoDI 8520.03); OTP is generally not acceptable.
    assigned: rest
  - control: IA-2(2)
    statement: The realm's browser flow requires a second factor for every user, not only administrators.
    assertions: [kc-mfa-all-users]
    responsibility: shared
    customer: Require MFA for non-privileged access paths outside the platform SSO.
    assigned: rest
  - control: IA-2(12)
    statement: The realm's browser flow accepts and verifies X.509 (PIV/CAC) client certificates.
    assertions: [kc-x509-authenticator]
    responsibility: shared
    customer: Configure the trust anchors and revocation checking for PIV/CAC certificates (DoD PKI).
    assigned: rest
  - control: IA-5(1)
    statement: >-
      The realm password policy enforces the minimum length (organization-defined, 15 for DoD) and a
      compromised / common password blocklist (`passwordBlacklist`).
    assertions: [kc-password-policy]
    responsibility: shared
    customer: Approve the password ODPs, maintain the blocklist (IA-5(1) a) and manage any application-local passwords.
    assigned: rest
  - control: SC-8
    statement: The realm requires TLS for external requests (`sslRequired`).
    assertions: [kc-ssl-required]
    responsibility: shared
    customer: Ensure TLS on internal hops behind the gateway (Keycloak sees the gateway's private address, so `external` permits plain HTTP inside the cluster).
    assigned: rest
