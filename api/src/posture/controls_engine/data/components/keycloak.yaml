# OSCAL-style component definition (converted to OSCAL 1.1.2 by controls_engine.ssp).
id: keycloak
uuid: 0686a48a-2477-4d58-b225-66a0c4f07490
title: Keycloak
type: service
purpose: Identity provider (OIDC) for every Nebari application and for the Kubernetes-facing tools.
description: >-
  Keycloak realm `nebari` authenticates all users of Nebari applications. The Envoy Gateway
  SecurityPolicies rendered by the nebari-operator delegate authentication to it, and groups in
  the realm drive authorization (NebariApp `auth.groups`).
implemented-requirements:
  - control: AC-2
    statement: >-
      Accounts are created by administrators in the Keycloak realm; self-service registration is
      disabled so no account exists without an administrator action.
    assertions: [kc-self-registration-disabled]
    responsibility: shared
    customer: Define account types, approvals, account managers, reviews, notifications and disablement (AC-2 a-l); the platform only prevents self-registration.
    assigned: rest
  - control: AC-6(5)
    statement: >-
      The realm `admin` role is held only by the subjects listed in the approved privileged-account
      allowlist (`controlsEngine.adminSubjects`).
    assertions: [kc-admin-role-allowlist]
    responsibility: shared
    customer: Approve the privileged-account allowlist and review it periodically.
    assigned: rest
  - control: AC-7
    statement: >-
      Keycloak brute-force detection temporarily locks an account after the configured number of
      consecutive failed logon attempts.
    assertions: [kc-brute-force-protection]
    responsibility: provider
  - control: AC-11
    statement: >-
      SSO sessions expire after the configured idle timeout, which forces re-authentication of an
      inactive session.
    assertions: [kc-session-timeouts]
    responsibility: customer
    customer: Device lock with pattern-hiding display is an endpoint (client device) control.
    assigned: rest
  - control: AC-12
    statement: >-
      SSO sessions are terminated after the idle timeout and the maximum session lifespan; the
      "remember me" option that would extend sessions is disabled.
    assertions: [kc-session-timeouts, kc-remember-me-disabled]
    responsibility: provider
  - control: AU-2
    statement: >-
      Keycloak records login events (successful and failed authentication, logout, token
      exchange) and administrative events for the realm.
    assertions: [kc-login-events, kc-admin-events]
    responsibility: shared
    customer: Select the event types to be logged (AU-2 a-e) and coordinate with the organization's audit function.
    assigned: rest
  - control: AU-3
    statement: Admin events include the full representation of the change (who, what, when, from where).
    assertions: [kc-admin-events]
    responsibility: shared
    customer: Ensure application audit records contain the AU-3 content for application events.
    assigned: rest
  - control: AU-12
    statement: Event generation is enabled for the realm with a stored-event retention period.
    assertions: [kc-login-events, kc-admin-events]
    responsibility: shared
    customer: Generate audit records for application-level events.
    assigned: rest
  - control: IA-2
    statement: Every interactive user of a Nebari application is uniquely identified and authenticated by Keycloak.
    assertions: [app-gateway-auth]
    responsibility: shared
    customer: Ensure every application endpoint requires the platform identity (no local accounts) and document exceptions.
    assigned: rest
  - control: IA-2(1)
    statement: Members of the administrator group are required to use a second factor (OTP or WebAuthn).
    assertions: [kc-admin-mfa]
    responsibility: shared
    customer: Require MFA for privileged accounts in the authentication flow; for DoD use PKI/CAC (IA-2(12)).
    assigned: rest
  - control: IA-5(1)
    statement: The realm password policy enforces minimum length and complexity for password authenticators.
    assertions: [kc-password-policy]
    responsibility: shared
    customer: Approve the password policy ODPs and the compromised-password list; manage any application-local passwords.
    assigned: rest
  - control: SC-8
    statement: The realm requires TLS for external requests (`sslRequired`).
    assertions: [kc-ssl-required]
    responsibility: shared
    customer: Ensure TLS on internal hops behind the gateway.
    assigned: rest
