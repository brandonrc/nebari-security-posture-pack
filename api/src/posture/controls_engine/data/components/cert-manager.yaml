id: cert-manager
uuid: 611e2afb-40f5-4e2d-8687-16c68a771e6e
title: cert-manager
type: service
purpose: Issues and renews the TLS certificates used by the gateway and in-cluster services.
description: >-
  cert-manager ClusterIssuers (an organizational CA or ACME) issue the gateway certificate and
  renew certificates before expiry.
implemented-requirements:
  - control: SC-12
    statement: Certificate keys are generated and rotated automatically by cert-manager from a Ready ClusterIssuer.
    assertions: [cm-issuer-ready, cm-certificates-valid]
  - control: SC-12(1)
    statement: Certificates are renewed before expiry so that keys remain available to the services that need them.
    assertions: [cm-certificates-valid]
  - control: SC-17
    statement: Public key certificates are issued by an approved certificate authority configured as a ClusterIssuer.
    assertions: [cm-issuer-ready]
