id: prometheus
uuid: 318ebcce-f1ae-4fe8-a4f2-6c7d2859e61c
title: Prometheus / Alertmanager
type: service
purpose: Metrics collection, alert evaluation and alert notification.
description: >-
  Prometheus scrapes platform and node metrics; Alertmanager routes firing alerts to the
  configured receivers (e-mail, chat, paging).
implemented-requirements:
  - control: SI-4
    statement: >-
      Prometheus scrapes cluster, node and workload metrics. This is performance telemetry:
      supporting evidence for monitoring, not attack detection.
    assertions: [mon-prometheus-scraping]
    responsibility: shared
    customer: Deploy intrusion / attack detection (e.g. runtime detection) and define the monitoring objectives (SI-4 a-g).
    ceiling: partial
    ceilingReason: metrics scraping is supporting evidence only; nothing checks attack detection
  - control: SI-4(5)
    statement: >-
      Alertmanager has at least one receiver with a notification integration and Prometheus has
      security-relevant alerting rules.
    assertions: [mon-alert-receivers]
    responsibility: shared
    customer: Define the compromise indicators that must alert and the personnel who receive them.
    ceiling: partial
    ceilingReason: rule names are matched heuristically; the indicators of compromise are organization-defined
  - control: IR-6(1)
    statement: Security alerts are routed automatically to at least one notification receiver.
    assertions: [mon-alert-receivers]
    responsibility: shared
    customer: Report incidents to the designated authorities within the required time (IR-6).
    ceiling: partial
    ceilingReason: supporting evidence only; incident reporting is a personnel process
  - control: CA-7
    statement: Platform metrics are collected continuously (supporting evidence for continuous monitoring).
    assertions: [mon-prometheus-scraping]
    responsibility: shared
    customer: Own the continuous monitoring strategy, metrics and reporting to the AO (CA-7 a-g).
    ceiling: partial
    ceilingReason: continuous monitoring is an organizational program; metrics collection is supporting evidence
