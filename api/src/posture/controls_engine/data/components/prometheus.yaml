id: prometheus
uuid: 318ebcce-f1ae-4fe8-a4f2-6c7d2859e61c
title: Prometheus / Alertmanager
type: service
purpose: Metrics collection, alert evaluation and alert notification.
description: >-
  Prometheus scrapes platform and node metrics; Alertmanager routes firing alerts to the
  configured receivers (e-mail, chat, paging).
implemented-requirements:
  - control: AU-6
    statement: Platform metrics are collected continuously for review and analysis.
    assertions: [mon-prometheus-scraping]
    responsibility: customer
    customer: Review and analyze audit records; metrics collection is supporting evidence only.
    assigned: rest
  - control: SI-4
    statement: Prometheus scrapes cluster, node and workload targets to monitor the system.
    assertions: [mon-prometheus-scraping]
    responsibility: shared
    customer: Deploy intrusion/attack detection (e.g. runtime detection) and define monitoring objectives; metrics are supporting evidence only.
    assigned: rest
  - control: SI-4(5)
    statement: Alertmanager notifies personnel through at least one configured receiver when alerts fire.
    assertions: [mon-alert-receivers]
    responsibility: shared
    customer: Define security alert rules and the personnel who receive them.
    assigned: rest
  - control: IR-6
    statement: Security-relevant alerts are routed to a reporting channel through Alertmanager receivers.
    assertions: [mon-alert-receivers]
    responsibility: customer
    customer: Report incidents to the designated authorities within the required time.
    assigned: rest
