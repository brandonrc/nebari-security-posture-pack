    The kubelet file should now have the permissions of "644".
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
  vulnId: V-242408
  ruleId: SV-242408r960960_rule
  ruleVersion: CNTR-K8-000900
  groupTitle: SRG-APP-000133-CTR-000310
  ruleTitle: The Kubernetes manifest files must have least privileges.
  severity: medium
