  vulnId: V-233274
  ruleId: SV-233274r961863_rule
  ruleVersion: SRG-APP-000516-CTR-001330
  groupTitle: SRG-APP-000516
  ruleTitle: The container platform must be able to store and instantiate industry standard container images.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000366
  legacyIds: []
  discussion: Monitoring the container images and containers during their lifecycle is important to guarantee the container platform is secure. To monitor the containers and images, security tools can be put in place. To fully utilize the security tools available, using images formatted in an industry standard format should be used. This allows the tools to fully understand the images and containers. One standard being worked on by industry leaders in the container space is the Open Container Initiative (OCI). This group is developing a standard container image format.
  checkContent: |-
    Review the container platform configuration and documentation to determine if the platform is configured to store and instantiate industry standard container images.

    If the container platform cannot instantiate industry standard container images, this is a finding.
  checkContentRef: M
  fixText: Enable the container platform to store and instantiate industry standard container image formats.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233275
  ruleId: SV-233275r961863_rule
  ruleVersion: SRG-APP-000516-CTR-001335
  groupTitle: SRG-APP-000516
  ruleTitle: The container platform must continuously scan components, containers, and images for vulnerabilities.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000366
  legacyIds: []
  discussion: |-
    Finding vulnerabilities quickly within the container platform and within containers deployed within the platform is important to keep the overall platform secure. When a vulnerability within a component or container is unknown or allowed to remain unpatched, other containers and customers within the platform become vulnerability. The vulnerability can lead to the loss of application data, organizational infrastructure data, and denial of service (DoS) to hosted applications.

    Vulnerability scanning can be performed by the container platform or by external applications.
  checkContent: |-
    Review the container platform to validate continuous vulnerability scans of components, containers, and container images are being performed.

    If continuous vulnerability scans are not being performed, this is a finding.
  checkContentRef: M
  fixText: Implement continuous vulnerability scans of container platform components, containers, and container images either by the container platform or from external vulnerability scanning applications.
  verified: true
  evaluation:
    method: scanner-coverage
    maxAgeDays: 7
    onFail: Open
    onPass: NotAFinding
