    method: none
- benchmark: kubernetes
  vulnId: V-242409
  ruleId: SV-242409r960963_rule
  ruleVersion: CNTR-K8-000910
  groupTitle: SRG-APP-000141-CTR-000315
  ruleTitle: Kubernetes Controller Manager must disable profiling.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000381
  legacyIds: []
  discussion: Kubernetes profiling provides the ability to analyze and troubleshoot Controller Manager events over a web interface on a host port. Enabling this service can expose details about the Kubernetes architecture. This service must not be enabled unless deemed necessary.
  checkContent: |-
    Change to the /etc/kubernetes/manifests/ directory on the Kubernetes Control Plane. Run the command:
    grep -i profiling *

    If the setting "profiling" is not configured in the Kubernetes Controller Manager manifest file or it is set to "True", this is a finding.
