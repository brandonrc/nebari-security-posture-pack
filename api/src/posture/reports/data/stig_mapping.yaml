  vulnId: V-242381
  ruleId: SV-242381r1043176_rule
  ruleVersion: CNTR-K8-000220
  groupTitle: SRG-APP-000023-CTR-000055
  ruleTitle: The Kubernetes Controller Manager must create unique service accounts for each work payload.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-000015
  legacyIds: []
  discussion: The Kubernetes Controller Manager is a background process that embeds core control loops regulating cluster system state through the API Server. Every process executed in a pod has an associated service account. By default, service accounts use the same credentials for authentication. Implementing the default settings poses a High risk to the Kubernetes Controller Manager. Setting the "--use-service-account-credential" value lowers the attack surface by generating unique service accounts settings for each controller instance.
  checkContent: |-
    Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane. Run the command:

    grep -i use-service-account-credentials *

    If the setting "--use-service-account-credentials" is not configured in the Kubernetes Controller Manager manifest file or it is set to "false", this is a finding.
  checkContentRef: M
  fixText: |-
    Edit the Kubernetes Controller Manager manifest file in the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

    Set the value of "--use-service-account-credentials" to "true".
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
  vulnId: V-242382
  ruleId: SV-242382r1137638_rule
  ruleVersion: CNTR-K8-000270
  groupTitle: SRG-APP-000033-CTR-000090
  ruleTitle: The Kubernetes API Server must enable Node,RBAC as the authorization mode.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000213
  legacyIds: []
  discussion: |-
    To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates by DOD-approved PKIs, all DOD systems (e.g., networks, web servers, and web portals) must be properly configured to incorporate access control methods that do not rely solely on the possession of a certificate for access. Successful authentication must not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must be implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the process of determining whether an entity, once authenticated, is permitted to access a specific asset.

    Node,RBAC is the method within Kubernetes to control access of users and applications. Kubernetes uses roles to grant authorization API requests made by kubelets.

    Satisfies: SRG-APP-000340-CTR-000770, SRG-APP-000033-CTR-000095, SRG-APP-000378-CTR-000880, SRG-APP-000033-CTR-000090
  checkContent: |-
    Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane. Run the command:
    grep -i authorization-mode *

    If the setting authorization-mode is set to "AlwaysAllow" in the Kubernetes API Server manifest file or is not configured, this is a finding.
  checkContentRef: M
  fixText: |-
    Edit the Kubernetes API Server manifest file in the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

    Set the value of "--authorization-mode" to "Node,RBAC".
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
  vulnId: V-242383
  ruleId: SV-242383r1137641_rule
  ruleVersion: CNTR-K8-000290
  groupTitle: SRG-APP-000038-CTR-000105
  ruleTitle: User-managed resources must be created in dedicated namespaces.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-000366
  legacyIds: []
  discussion: Creating namespaces for user-managed resources is important when implementing Role-Based Access Controls (RBAC). RBAC allows for the authorization of users and helps support proper API server permissions separation and network micro segmentation. If user-managed resources are placed within the default namespaces, it becomes impossible to implement policies for RBAC permission, service account usage, network policies, and more.
  checkContent: |-
    To view the available namespaces, run the command:

    kubectl get namespaces

    The default namespaces to be validated are default, kube-public, and kube-node-lease if it is created.

    For the default namespace, execute the commands:

    kubectl config set-context --current --namespace=default
    kubectl get all

    For the kube-public namespace, execute the commands:

    kubectl config set-context --current --namespace=kube-public
    kubectl get all

    For the kube-node-lease namespace, execute the commands:

    kubectl config set-context --current --namespace=kube-node-lease
    kubectl get all

    The only valid return values are the kubernetes service (i.e., service/kubernetes) and nothing at all.

    If a return value is returned from the "kubectl get all" command and it is not the kubernetes service (i.e., service/kubernetes), this is a finding.
  checkContentRef: M
  fixText: Move any user-managed resources from the default, kube-public, and kube-node-lease namespaces to user namespaces.
  verified: true
  evaluation:
    method: inventory
    namespaces:
    - default
    - kube-public
    - kube-node-lease
    onFail: Open
    onPass: Not_Reviewed
    note: 'Evaluated from the pod/workload inventory only; non-pod resources (Services other than service/kubernetes, ConfigMaps, ...) in these namespaces are not inventoried, so a clean result is Not_Reviewed: a CAT I is never closed on partial evidence.'
- benchmark: kubernetes
  vulnId: V-242384
  ruleId: SV-242384r1137638_rule
  ruleVersion: CNTR-K8-000300
  groupTitle: SRG-APP-000033-CTR-000090
  ruleTitle: The Kubernetes Scheduler must have secure binding.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000213
  legacyIds: []
  discussion: Limiting the number of attack vectors and implementing authentication and encryption on the endpoints available to external sources is paramount when securing the overall Kubernetes cluster. The Scheduler API service exposes port 10251/TCP by default for health and metrics information use. This port does not encrypt or authenticate connections. If this port is exposed externally, an attacker can use this port to attack the entire Kubernetes cluster. By setting the bind address to localhost (i.e., 127.0.0.1), only those internal services that require health and metrics information can access the Scheduler API.
  checkContent: |-
    Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane. Run the command:

    grep -i bind-address *

    If the setting "bind-address" is not set to "127.0.0.1" or is not found in the Kubernetes Scheduler manifest file, this is a finding.
  checkContentRef: M
  fixText: Edit the Kubernetes Scheduler manifest file in the /etc/kubernetes/manifests directory on the Kubernetes Control Plane. Set the argument "--bind-address" to "127.0.0.1".
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
