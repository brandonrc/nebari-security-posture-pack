  ruleVersion: SRG-APP-000474-CTR-001180
  groupTitle: SRG-APP-000474
  ruleTitle: The container platform must provide system notifications to the system administrator and operational staff when anomalies in the operation of the organization-defined security functions are discovered.
  severity: medium
