  vulnId: V-242414
  ruleId: SV-242414r1043177_rule
  ruleVersion: CNTR-K8-000960
  groupTitle: SRG-APP-000142-CTR-000330
  ruleTitle: The Kubernetes cluster must use non-privileged host ports for user pods.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000382
  legacyIds: []
  discussion: Privileged ports are those ports below 1024 and that require system privileges for their use. If containers can use these ports, the container must be run as a privileged user. Kubernetes must stop containers that try to map to these ports directly. Allowing non-privileged ports to be mapped to the container-privileged port is the allowable method when a certain port is needed. An example is mapping port 8080 externally to port 80 in the container.
  checkContent: |-
    On the Control Plane, run the command:
    kubectl get pods --all-namespaces

    The list returned is all pods running within the Kubernetes cluster. For those pods running within the user namespaces (System namespaces are kube-system, kube-node-lease and kube-public), run the command:
    kubectl get pod podname -o yaml | grep -i port

    Note: In the above command, "podname" is the name of the pod. For the command to work correctly, the current context must be changed to the namespace for the pod. The command to do this is:

    kubectl config set-context --current --namespace=namespace-name
    (Note: "namespace-name" is the name of the namespace.)

    Review the ports that are returned for the pod.

    If any host-privileged ports are returned for any of the pods, this is a finding.
  checkContentRef: M
  fixText: For any of the pods that are using host-privileged ports, reconfigure the pod to use a service to map a host non-privileged port to the pod port or reconfigure the image to use non-privileged ports.
  verified: true
  evaluation:
    method: posture
    checks:
    - host-namespaces
    onFail: Not_Reviewed
    onPass: Not_Reviewed
    note: hostPort declarations are not inventoried; pods sharing the host network namespace are listed for the reviewer because any port they bind is a host port.
- benchmark: kubernetes
  vulnId: V-242415
  ruleId: SV-242415r1069466_rule
  ruleVersion: CNTR-K8-001160
  groupTitle: SRG-APP-000171-CTR-000435
  ruleTitle: Secrets in Kubernetes must not be stored as environment variables.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-004062
  - CCI-000196
  legacyIds: []
  discussion: Secrets, such as passwords, keys, tokens, and certificates must not be stored as environment variables. These environment variables are accessible inside Kubernetes by the "Get Pod" API call, and by any system, such as CI/CD pipeline, which has access to the definition file of the container. Secrets must be mounted from files or stored within password vaults.
  checkContent: |-
    Follow these steps to check, from the Kubernetes control plane, if secrets are stored as environment variables.

    1. Find All Pods Using Secrets in Environment Variables.

    To list all pods using secrets as environment variables, execute:

    kubectl get pods --all-namespaces -o yaml | grep -A5 "secretKeyRef"

    If any of the values returned reference environment variables, this is a finding.

    2. Check Environment Variables in a Specific Pod.

    To check if a specific pod is using secrets as environment variables, execute:

    kubectl get pods -n <namespace>
    (Replace <namespace> with the actual namespace, or omit -n <namespace> to check in the default namespace.)
    kubectl describe pod <pod-name> -n <namespace> | grep -A5 "Environment:"

    If secrets are used, output like the following will be displayed:

    Environment:
      SECRET_USERNAME:   <set from secret: my-secret key: username>
      SECRET_PASSWORD:   <set from secret: my-secret key: password>

    If the output is similar to this, the pod is using Kubernetes secrets as environment variables, and this is a finding.

    3. Check the Pod YAML for Secret Usage.

    To check the full YAML definition for environment variables, execute:

    kubectl get pod <pod-name> -n <namespace> -o yaml | grep -A5 "env:"

    Example output:
    yaml
    CopyEdit
    env:
      - name: SECRET_USERNAME
        valueFrom:
          secretKeyRef:
            name: my-secret
            key: username

    This means the pod is pulling the secret named my-secret and setting SECRET_USERNAME from its username key.

    If the pod is pulling a secret and setting an environment variable in the "env:", this is a finding.

    4. Check Secrets in a Deployment, StatefulSet, or DaemonSet.

    If the pod is managed by a Deployment, StatefulSet, or DaemonSet, check their configurations:

    kubectl get deployment <deployment-name> -n <namespace> -o yaml | grep -A5 "env:"

    or

    For all Deployments in all namespaces:

    kubectl get deployments --all-namespaces -o yaml | grep -A5 "env:"

    If the pod is pulling a secret and setting an environment variable in the "env:", this is a finding.

    5. Check Environment Variables Inside a Running Pod.

    If needed, check the environment variables inside a running pod:

    kubectl exec -it <pod-name> -n <namespace> -- env | grep SECRET

    If any of the values returned reference environment variables, this is a finding.
  checkContentRef: M
  fixText: Any secrets stored as environment variables must be moved to the secret files with the proper protections and enforcements or placed within a password vault.
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
  vulnId: V-242417
  ruleId: SV-242417r1137643_rule
  ruleVersion: CNTR-K8-001360
  groupTitle: SRG-APP-000211-CTR-000530
  ruleTitle: Kubernetes must separate user functionality.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001082
  legacyIds: []
  discussion: Separating user functionality from management functionality is a requirement for all the components within the Kubernetes Control Plane. Without the separation, users may have access to management functions that can degrade the Kubernetes architecture and the services being offered, and can offer a method to bypass testing and validation of functions before introduced into a production environment.
  checkContent: |-
    On the Control Plane, run the command:
    kubectl get pods --all-namespaces

    Review the namespaces and pods that are returned. Kubernetes system namespaces are kube-node-lease, kube-public, and kube-system.

    If any user pods are present in the Kubernetes system namespaces, this is a finding.
  checkContentRef: M
  fixText: Move any user pods that are present in the Kubernetes system namespaces to user specific namespaces.
  verified: true
  evaluation:
    method: inventory
    namespaces:
    - kube-system
    - kube-public
    - kube-node-lease
    onFail: Not_Reviewed
    onPass: NotAFinding
    note: Workloads in Kubernetes system namespaces are listed; the reviewer must decide which are platform components and which are user pods.
- benchmark: kubernetes
  vulnId: V-242418
  ruleId: SV-242418r1043178_rule
  ruleVersion: CNTR-K8-001400
  groupTitle: SRG-APP-000219-CTR-000550
  ruleTitle: The Kubernetes API server must use approved cipher suites.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001184
  legacyIds: []
  discussion: The Kubernetes API server communicates to the kubelet service on the nodes to deploy, update, and delete resources. If an attacker were able to get between this communication and modify the request, the Kubernetes cluster could be compromised. Using approved cypher suites for the communication ensures the protection of the transmitted information, confidentiality, and integrity so that the attacker cannot read or alter this communication.
  checkContent: |-
    Change to the /etc/kubernetes/manifests/ directory on the Kubernetes Control Plane. Run the command:
    grep -i tls-cipher-suites *

    If the setting feature tls-cipher-suites is not set in the Kubernetes API server manifest file or contains no value or does not contain TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384, this is a finding.
  checkContentRef: M
  fixText: |-
    Edit the Kubernetes API Server manifest file in the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

    Set the value of "--tls-cipher-suites" to:
    "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
  vulnId: V-242419
  ruleId: SV-242419r1043178_rule
  ruleVersion: CNTR-K8-001410
  groupTitle: SRG-APP-000219-CTR-000550
  ruleTitle: Kubernetes API Server must have the SSL Certificate Authority set.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001184
  legacyIds: []
  discussion: |-
    Kubernetes control plane and external communication are managed by API Server. The main implementation of the API Server is to manage hardware resources for pods and containers using horizontal or vertical scaling. Anyone who can access the API Server can effectively control the Kubernetes architecture. Using authenticity protection, the communication can be protected against man-in-the-middle attacks/session hijacking and the insertion of false information into sessions.

    The communication session is protected by utilizing transport encryption protocols such as TLS. TLS provides the Kubernetes API Server with a means to authenticate sessions and encrypt traffic.

    To enable encrypted communication for API Server, the parameter client-ca-file must be set. This parameter gives the location of the SSL Certificate Authority file used to secure API Server communication.
  checkContent: |-
    Change to the /etc/kubernetes/manifests/ directory on the Kubernetes Control Plane. Run the command:
    grep -i client-ca-file *

    If the setting feature client-ca-file is not set in the Kubernetes API server manifest file or contains no value, this is a finding.
  checkContentRef: M
  fixText: |-
    Edit the Kubernetes API Server manifest file in the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

    Set the value of "--client-ca-file" to path containing Approved Organizational Certificate.
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
  vulnId: V-242420
  ruleId: SV-242420r1043178_rule
  ruleVersion: CNTR-K8-001420
  groupTitle: SRG-APP-000219-CTR-000550
  ruleTitle: Kubernetes Kubelet must have the SSL Certificate Authority set.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001184
  legacyIds: []
  discussion: |-
    Kubernetes container and pod configuration are maintained by Kubelet. Kubelet agents register nodes with the API Server, mount volume storage, and perform health checks for containers and pods. Anyone who gains access to Kubelet agents can effectively control applications within the pods and containers. Using authenticity protection, the communication can be protected against man-in-the-middle attacks/session hijacking and the insertion of false information into sessions.

    The communication session is protected by utilizing transport encryption protocols such as TLS. TLS provides the Kubernetes API Server with a means to authenticate sessions and encrypt traffic.

    To enable encrypted communication for Kubelet, the clientCAFile must be set. This parameter gives the location of the SSL Certificate Authority file used to secure Kubelet communication.
  checkContent: |-
    On the Control Plane, run the command:
    ps -ef | grep kubelet

    If the "--client-ca-file" option exists, this is a finding.

    Note the path to the config file (identified by --config).

    Run the command:
    grep -i clientCAFile <path_to_config_file>

    If the setting "clientCAFile" is not set or contains no value, this is a finding.
  checkContentRef: M
  fixText: |-
    On the Control Plane, run the command:
    ps -ef | grep kubelet

    Remove the "--client-ca-file" option if present.

    Note the path to the config file (identified by --config).

    Edit the Kubernetes Kubelet config file:
    Set the value of "clientCAFile" to a path containing an Approved Organizational Certificate.

    Restart the kubelet service using the following command:
    systemctl daemon-reload && systemctl restart kubelet
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
