  vulnId: V-242407
  ruleId: SV-242407r960960_rule
  ruleVersion: CNTR-K8-000890
  groupTitle: SRG-APP-000133-CTR-000305
  ruleTitle: The Kubernetes KubeletConfiguration files must have file permissions set to 644 or more restrictive.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001499
  legacyIds: []
  discussion: The kubelet configuration file contains the runtime configuration of the kubelet service. If an attacker can gain access to this file, changes can be made to open vulnerabilities and bypass user authorizations inherit within Kubernetes with RBAC implemented.
  checkContent: |-
    On the Kubernetes Control Plane and Worker nodes, run the command:
    ps -ef | grep kubelet

    Check the config file (path identified by: --config):

    Change to the directory identified by --config (example /etc/sysconfig/) and run the command:
    ls -l kubelet

    Each KubeletConfiguration file must have permissions of "644" or more restrictive.

    If any KubeletConfiguration file is less restrictive than "644", this is a finding.
  checkContentRef: M
  fixText: |-
    On the Kubernetes Control Plane and Worker nodes, run the command:
    ps -ef | grep kubelet

    Check the config file (path identified by: --config):

    Change to the directory identified by --config (example /etc/sysconfig/) and run the command:
