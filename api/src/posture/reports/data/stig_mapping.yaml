  ruleTitle: Kubernetes API Server audit logs must be enabled.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000366
  legacyIds: []
  discussion: Kubernetes API Server validates and configures pods and services for the API object. The REST operation provides frontend functionality to the cluster share state. Enabling audit logs provides a way to monitor and identify security risk events or misuse of information. Audit logs are necessary to provide evidence in the case the Kubernetes API Server is compromised requiring a Cyber Security Investigation.
  checkContent: |-
    Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane. Run the command:
    grep -i audit-policy-file *

    If the setting "audit-policy-file" is not set or is found in the Kubernetes API manifest file without valid content, this is a finding.
  checkContentRef: M
  fixText: Edit the Kubernetes API Server manifest file in the /etc/kubernetes/manifests directory on the Kubernetes Control Plane. Set the argument "--audit-policy-file" to "log file directory".
  verified: true
  evaluation:
    method: none
