  ruleId: SV-233030r1137642_rule
  ruleVersion: SRG-APP-000039-CTR-000110
  groupTitle: SRG-APP-000039
  ruleTitle: The container platform must enforce approved authorizations for controlling the flow of information between interconnected systems and services based on organization-defined information flow control policies.
