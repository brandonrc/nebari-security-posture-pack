  ruleId: SV-263599r982473_rule
  ruleVersion: SRG-APP-000910-CTR-000300
  groupTitle: SRG-APP-000910
  ruleTitle: The container platform must include only approved trust anchors in trust stores or certificate stores managed by the organization.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-004909
  legacyIds: []
  discussion: Public key infrastructure (PKI) certificates are certificates with visibility external to organizational systems and certificates related to the internal operations of systems, such as application-specific time services. In cryptographic systems with a hierarchical structure, a trust anchor is an authoritative source (i.e., a certificate authority) for which trust is assumed and not derived. A root certificate for a PKI system is an example of a trust anchor. A trust store or certificate store maintains a list of trusted root certificates.
  checkContent: |-
    Verify the container platform is configured to include only approved trust anchors in trust stores or certificate stores managed by the organization.

    If the container platform is not configured to include only approved trust anchors in trust stores or certificate stores managed by the organization, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to include only approved trust anchors in trust stores or certificate stores managed by the organization.
  verified: true
  evaluation:
    method: none
