  vulnId: V-233063
  ruleId: SV-233063r960951_rule
  ruleVersion: SRG-APP-000126-CTR-000275
  groupTitle: SRG-APP-000126
  ruleTitle: The container platform must use FIPS validated cryptographic mechanisms to protect the integrity of log information.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001350
  legacyIds: []
  discussion: |-
    To fully investigate an incident and to have trust in the audit data that is generated, it is important to put in place data protections. Without integrity protections, unauthorized changes may be made to the audit files and reliable forensic analysis and discovery of the source of malicious system activity may be degraded. Although digital signatures are one example of protecting integrity, this control is not intended to cause a new cryptographic hash to be generated every time a record is added to a log file.

    Integrity protections can also be implemented by using cryptographic techniques for security function isolation and file system protections to protect against unauthorized changes.
  checkContent: |-
    Review the container platform configuration to determine if FIPS-validated cryptographic mechanisms are being used to protect the integrity of log information.

    If FIPS-validated cryptographic mechanisms are not being used to protect the integrity of log information, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to use FIPS-validated cryptographic mechanisms to protect the integrity of log information.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233064
  ruleId: SV-233064r981843_rule
  ruleVersion: SRG-APP-000131-CTR-000280
  groupTitle: SRG-APP-000131
  ruleTitle: The container platform must be built from verified packages.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-003992
  legacyIds: []
  discussion: It is important to patch and upgrade the container platform when patches and upgrades are available. More important is to get these patches and upgrades from a known source. To validate the authenticity of any patches and upgrades before installation, the container platform must check that the files are digitally signed by sources approved by the organization.
  checkContent: |-
    Review the container platform configuration to verify it has been built from packages that are digitally signed by known and approved sources.

    If the container platform was built from packages that are not digitally signed or are from unknown or nonapproved sources, this is a finding.
  checkContentRef: M
  fixText: Rebuild the container platform from verified packages that are digitally signed by known and approved sources.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233065
  ruleId: SV-233065r981844_rule
  ruleVersion: SRG-APP-000131-CTR-000285
  groupTitle: SRG-APP-000131
  ruleTitle: The container platform must verify container images.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-003992
  legacyIds: []
  discussion: The container platform must be capable of validating container images are signed and that the digital signature is from a recognized and approved source approved by the organization. Allowing any container image to be introduced into the registry and instantiated into a container can allow for services to be introduced that are not trusted and may contain malicious code, which introduces unwanted services. These unwanted services can cause harm and security risks to the hosting server, the container platform, other services running within the container platform, and the overall organization.
  checkContent: |-
    Review the container platform configuration to determine if container images are verified by enforcing image signing and that the image is signed recognized by an approved source.

    If container images are not verified or the signature is not verified as a recognized and approved source, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to verify container images are digitally signed and the signature is from a recognized and approved source.
  verified: true
  evaluation:
    method: posture
    checks:
    - mutable-tag
    onFail: Open
    onPass: Not_Reviewed
    note: Mutable tags defeat image verification. Signature verification itself is not evaluated.
- benchmark: container-platform-srg
  vulnId: V-233066
  ruleId: SV-233066r960960_rule
  ruleVersion: SRG-APP-000133-CTR-000290
  groupTitle: SRG-APP-000133
  ruleTitle: The container platform must limit privileges to the container platform registry.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001499
  legacyIds: []
  discussion: To control what is instantiated within the container platform, it is important to control access to the registry. Without this control, container images can be introduced and instantiated by accident or on container platform startup. Without control of the registry, security measures put in place for the runtime can be bypassed meaning the controls of approval and testing are also bypassed. Only those individuals and roles approved by the organization can have access to the container platform registry.
  checkContent: |-
    Review the container platform registry configuration to determine if the level of access to the registry is controlled through user privileges.

    Attempt to perform registry operations to determine if the privileges are enforced.

    If the container platform registry is not limited through user privileges or the user privileges are not enforced, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to use and enforce user privileges when accessing the container platform registry.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233067
  ruleId: SV-233067r960960_rule
  ruleVersion: SRG-APP-000133-CTR-000295
  groupTitle: SRG-APP-000133
  ruleTitle: The container platform must limit privileges to the container platform runtime.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001499
  legacyIds: []
  discussion: To control what is instantiated within the container platform, it is important to control access to the runtime. Without this control, container platform specific services and customer services can be introduced without receiving approval and going through proper testing. Only those individuals and roles approved by the organization can have access to the container platform runtime.
  checkContent: |-
    Review the container platform runtime configuration to determine if the level of access to the runtime is controlled through user privileges.

    Attempt to perform runtime operations to determine if the privileges are enforced.

    If the container platform runtime is not limited through user privileges or the user privileges are not enforced, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to use and enforce user privileges when accessing the container platform runtime.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233068
  ruleId: SV-233068r960960_rule
  ruleVersion: SRG-APP-000133-CTR-000300
  groupTitle: SRG-APP-000133
  ruleTitle: The container platform must limit privileges to the container platform keystore.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001499
  legacyIds: []
  discussion: |-
    The container platform keystore is used to store credentials used to build a trust between the container platform and some external source. This trust relationship is authorized by the organization. If a malicious user were to have access to the container platform keystore, two negative scenarios could develop:

    1) Keys not approved could be introduced and
    2) Approved keys deleted, leading to the introduction of container images from sources that were never approved by the organization.

    To thwart this threat, it is important to protect the container platform keystore and give access to only those individuals and roles approved by the organization.
  checkContent: |-
    Review the container platform keystore configuration to determine if the level of access to the keystore is controlled through user privileges.

    Attempt to perform keystore operations to determine if the privileges are enforced.

    If the container platform keystore is not limited through user privileges or the user privileges are not enforced, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to use and enforce user privileges when accessing the container platform keystore.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233069
  ruleId: SV-233069r960960_rule
  ruleVersion: SRG-APP-000133-CTR-000305
  groupTitle: SRG-APP-000133
  ruleTitle: Configuration files for the container platform must be protected.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001499
  legacyIds: []
  discussion: The secure configuration of the container platform must be protected by disallowing changes to be implemented by non-privileged users. Changes to the container platform can introduce security risks or stability issues and undermine change management procedures. Securing configuration files from non-privileged user modification can be enforced using file ownership and permissions.
  checkContent: |-
    Review the container platform to verify that configuration files cannot be modified by non-privileged users.

    If non-privileged users can modify configuration files, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to only allow configuration modifications by privileged users.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233070
  ruleId: SV-233070r960960_rule
  ruleVersion: SRG-APP-000133-CTR-000310
  groupTitle: SRG-APP-000133
  ruleTitle: Authentication files for the container platform must be protected.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001499
  legacyIds: []
  discussion: |-
    The secure configuration of the container platform must be protected by disallowing changing to be implemented by non-privileged users. Changes to the container platform can introduce security risks and stability issues and undermine change management procedures. To secure authentication files from non-privileged user modification can be enforced using file ownership and permissions.

    Examples of authentication files are keys, certificates, and tokens.
  checkContent: |-
    Review the container platform to verify that authentication files cannot be modified by non-privileged users.

    If non-privileged users can modify key and certificate files, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to only allow authentication file modifications by privileged users.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233071
  ruleId: SV-233071r960963_rule
  ruleVersion: SRG-APP-000141-CTR-000315
  groupTitle: SRG-APP-000141
  ruleTitle: The container platform must be configured with only essential configurations.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000381
  legacyIds: []
  discussion: The container platform can be built with components that are not used for the intended purpose of the organization. To limit the attack surface of the container platform, it is essential that the non-essential services are not installed.
  checkContent: |-
    Review the container platform configuration and verify that only those components needed for operation are installed.

    If components are installed that are not used for the intended purpose of the organization, this is a finding.
  checkContentRef: M
  fixText: Identify the role the container platform is intended to play in the production environment and remove any components that are not needed or used for the intended purpose.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233072
  ruleId: SV-233072r960963_rule
  ruleVersion: SRG-APP-000141-CTR-000320
  groupTitle: SRG-APP-000141
  ruleTitle: The container platform registry must contain only container images for those capabilities being offered by the container platform.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000381
  legacyIds: []
  discussion: Allowing container images to reside within the container platform registry that are not essential to the capabilities being offered by the container platform becomes a potential security risk. By allowing these non-essential container images to exist, the possibility for accidental instantiation exists. The images may be unpatched, not supported, or offer non-approved capabilities. Those images for customer services are considered essential capabilities.
  checkContent: |-
    Review the container platform registry and the container images being stored.

    If container images are stored in the registry and are not being used to offer container platform capabilities, this is a finding.
  checkContentRef: M
  fixText: Remove all container images from the container platform registry that are not being used or contain features and functions not supported by the platform.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233073
  ruleId: SV-233073r1043177_rule
  ruleVersion: SRG-APP-000142-CTR-000325
  groupTitle: SRG-APP-000142
  ruleTitle: The container platform runtime must enforce ports, protocols, and services that adhere to the PPSM CAL.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000382
  legacyIds: []
  discussion: Ports, protocols, and services within the container platform runtime must be controlled and conform to the PPSM CAL. Those ports, protocols, and services that fall outside the PPSM CAL must be blocked by the runtime. Instructions on the PPSM can be found in DoD Instruction 8551.01 Policy.
  checkContent: |-
    Review the container platform documentation and deployment configuration to determine which ports and protocols are enabled.

    Verify the ports and protocols being used are not prohibited by PPSM CAL in accordance to DoD Instruction 8551.01 Policy and are necessary for the operations and applications.

    If any of the ports or protocols is prohibited or not necessary for the operation, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to disable any ports or protocols that are prohibited by the PPSM CAL and not necessary for the operation.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233074
  ruleId: SV-233074r1043177_rule
  ruleVersion: SRG-APP-000142-CTR-000330
  groupTitle: SRG-APP-000142
  ruleTitle: The container platform runtime must enforce the use of ports that are non-privileged.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000382
  legacyIds: []
  discussion: Privileged ports are those ports below 1024 and that require system privileges for their use. If containers are able to use these ports, the container must be run as a privileged user. The container platform must stop containers that try to map to these ports directly. Allowing non-privileged ports to be mapped to the container-privileged port is the allowable method when a certain port is needed. An example is mapping port 8080 externally to port 80 in the container.
  checkContent: |-
    Review the container platform configuration and the containers within the platform by performing the following checks:

    1. Verify the container platform is configured to disallow the use of privileged ports by containers.
    2. Validate all containers within the container platform are using non-privileged ports.
    3. Attempt to instantiate a container image that uses a privileged port.

    If the container platform is not configured to disallow the use of privileged ports, this is a finding.

    If the container platform has containers using privileged ports, this is a finding.

    If the container platform allows containers to be instantiated that use privileged ports, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to disallow the use of privileged ports by containers. Move any containers that are using privileged ports to non-privileged ports.
  verified: true
  evaluation:
    method: posture
    checks:
    - host-namespaces
    onFail: Not_Reviewed
    onPass: Not_Reviewed
    note: hostPort declarations are not inventoried; host-network pods are listed for review.
- benchmark: container-platform-srg
  vulnId: V-233075
  ruleId: SV-233075r1051115_rule
  ruleVersion: SRG-APP-000148-CTR-000335
  groupTitle: SRG-APP-000148
  ruleTitle: The container platform must uniquely identify and authenticate users.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000764
  legacyIds: []
  discussion: The container platform requires user accounts to perform container platform tasks. These tasks may pertain to the overall container platform or may be component-specific, thus requiring users to authenticate against those specific components. To ensure accountability and prevent unauthenticated access, users must be identified and authenticated to prevent potential misuse and compromise of the system.
  checkContent: |-
    Review the container platform configuration to determine if users are uniquely identified and authenticated.

    If users are not uniquely identified or are not authenticated, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to uniquely identify and authenticate users.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233076
  ruleId: SV-233076r1051115_rule
  ruleVersion: SRG-APP-000148-CTR-000340
  groupTitle: SRG-APP-000148
  ruleTitle: The container platform application program interface (API) must uniquely identify and authenticate users.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000764
  legacyIds: []
  discussion: The container platform requires user accounts to perform container platform tasks. These tasks are often performed through the container platform API. Protecting the API from users who are not authorized or authenticated is essential to keep the container platform stable. Protection of platform and application data and enhances the protections put in place for Denial-of Service (DoS) attacks.
  checkContent: |-
    Review the container platform configuration to determine if users are uniquely identified and authenticated before the API is executed.

    If users are not uniquely identified or are not authenticated, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to uniquely identify and authenticate users before container platform API access.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233077
  ruleId: SV-233077r1051115_rule
  ruleVersion: SRG-APP-000148-CTR-000345
  groupTitle: SRG-APP-000148
  ruleTitle: The container platform must uniquely identify and authenticate processes acting on behalf of the users.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000764
  legacyIds: []
  discussion: The container platform will instantiate a container image and use the user privileges given to the user used to execute the container. To ensure accountability and prevent unauthenticated access to containers, the user the container is using to execute must be uniquely identified and authenticated to prevent potential misuse and compromise of the system.
