  vulnId: V-242410
  ruleId: SV-242410r1043177_rule
  ruleVersion: CNTR-K8-000920
  groupTitle: SRG-APP-000142-CTR-000325
  ruleTitle: The Kubernetes API Server must enforce ports, protocols, and services (PPS) that adhere to the Ports, Protocols, and Services Management Category Assurance List (PPSM CAL).
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000382
  legacyIds: []
  discussion: Kubernetes API Server PPSs must be controlled and conform to the PPSM CAL. Those PPS that fall outside the PPSM CAL must be blocked. Instructions on the PPSM can be found in DoD Instruction 8551.01 Policy.
  checkContent: |-
    Change to the /etc/kubernetes/manifests/ directory on the Kubernetes Control Plane. Run the command:
    grep kube-apiserver.manifest -I -secure-port *
    grep kube-apiserver.manifest -I -etcd-servers *
    -edit manifest file:
    VIM <Manifest Name>
    Review livenessProbe:
    HttpGet:
    Port:
    Review ports:
    - containerPort:
    hostPort:
    - containerPort:
