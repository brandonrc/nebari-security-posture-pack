  vulnId: V-242434
  ruleId: SV-242434r961131_rule
  ruleVersion: CNTR-K8-001620
  groupTitle: SRG-APP-000233-CTR-000585
  ruleTitle: Kubernetes Kubelet must enable kernel protection.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-001084
  legacyIds: []
  discussion: System kernel is responsible for memory, disk, and task management. The kernel provides a gateway between the system hardware and software. Kubernetes requires kernel access to allocate resources to the Control Plane. Threat actors that penetrate the system kernel can inject malicious code or hijack the Kubernetes architecture. It is vital to implement protections through Kubernetes components to reduce the attack surface.
  checkContent: |-
    On the Control Plane, run the command:
    ps -ef | grep kubelet

    If the "--protect-kernel-defaults" option exists, this is a finding.

    Note the path to the config file (identified by --config).

    Run the command:
    grep -i protectKernelDefaults <path_to_config_file>

    If the setting "protectKernelDefaults" is not set or is set to false, this is a finding.
  checkContentRef: M
  fixText: |-
    On the Control Plane, run the command:
    ps -ef | grep kubelet

    Remove the "--protect-kernel-defaults" option if present.

    Note the path to the Kubernetes Kubelet config file (identified by --config).

    Edit the Kubernetes Kubelet config file:
    Set "protectKernelDefaults" to "true".

    Restart the kubelet service using the following command:
    systemctl daemon-reload && systemctl restart kubelet
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
  vulnId: V-242436
  ruleId: SV-242436r961359_rule
  ruleVersion: CNTR-K8-002000
  groupTitle: SRG-APP-000342-CTR-000775
  ruleTitle: The Kubernetes API server must have the ValidatingAdmissionWebhook enabled.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-002263
  legacyIds: []
  discussion: Enabling the admissions webhook allows for Kubernetes to apply policies against objects that are to be created, read, updated, or deleted. By applying a pod security policy, control can be given to not allow images to be instantiated that run as the root user. If pods run as the root user, the pod then has root privileges to the host system and all the resources it has. An attacker can use this to attack the Kubernetes cluster. By implementing a policy that does not allow root or privileged pods, the pod users are limited in what the pod can do and access.
  checkContent: |-
    Prior to version 1.21, to enforce security policiesPod Security Policies (psp) were used. Those are now deprecated and will be removed from version 1.25.

    Migrate from PSP to PSA:
    https://kubernetes.io/docs/tasks/configure-pod-container/migrate-from-psp/

    Pre-version 1.25 Check:
    Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane. Run the command:
    grep -i ValidatingAdmissionWebhook *

    If a line is not returned that includes enable-admission-plugins and ValidatingAdmissionWebhook, this is a finding.
  checkContentRef: M
  fixText: |-
    Edit the Kubernetes API Server manifest file in the /etc/kubernetes/manifests directory on the Kubernetes Control Plane. Set the argument "--enable-admission-plugins" to include "ValidatingAdmissionWebhook".  Each enabled plugin is separated by commas.

    Note: It is best to implement policies first and then enable the webhook, otherwise a denial of service may occur.
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
  vulnId: V-242437
  ruleId: SV-242437r961359_rule
  ruleVersion: CNTR-K8-002010
  groupTitle: SRG-APP-000342-CTR-000775
  ruleTitle: Kubernetes must have a pod security policy set.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-002263
  legacyIds: []
  discussion: Enabling the admissions webhook allows for Kubernetes to apply policies against objects that are to be created, read, updated, or deleted. By applying a pod security policy, control can be given to not allow images to be instantiated that run as the root user. If pods run as the root user, the pod then has root privileges to the host system and all the resources it has. An attacker can use this to attack the Kubernetes cluster. By implementing a policy that does not allow root or privileged pods, the pod users are limited in what the pod can do and access.
  checkContent: |-
    Prior to version 1.21, to enforce security policiesPod Security Policies (psp) were used. Those are now deprecated and will be removed from version 1.25.

    Migrate from PSP to PSA:
    https://kubernetes.io/docs/tasks/configure-pod-container/migrate-from-psp/

    Pre-version 1.25 Check:
    On the Control Plane, run the command:
    kubectl get podsecuritypolicy

    If there is no pod security policy configured, this is a finding.

    For any pod security policies listed, edit the policy with the command:
    kubectl edit podsecuritypolicy policyname
    (Note: "policyname" is the name of the policy.)

    Review the runAsUser, supplementalGroups and fsGroup sections of the policy.

    If any of these sections are missing, this is a finding.

    If the rule within the runAsUser section is not set to "MustRunAsNonRoot", this is a finding.

    If the ranges within the supplementalGroups section has min set to "0" or min is missing, this is a finding.

    If the ranges within the fsGroup section has a min set to "0" or the min is missing, this is a finding.
  checkContentRef: M
  fixText: |-
    From the Control Plane, save the following policy to a file called restricted.yml.

    apiVersion: policy/v1beta1
    kind: PodSecurityPolicy
    metadata:
    name: restricted
    annotations:
    apparmor.security.beta.kubernetes.io/allowedProfileNames: 'runtime/default',
    seccomp.security.alpha.kubernetes.io/defaultProfileName: 'runtime/default',
    apparmor.security.beta.kubernetes.io/defaultProfileName: 'runtime/default'
    spec:
    privileged: false
    # Required to prevent escalations to root.
    allowPrivilegeEscalation: false
    # This is redundant with non-root + disallow privilege escalation,
    # but we can provide it for defense in depth.
    requiredDropCapabilities:
    - ALL
    # Allow core volume types.
    volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    # Assume that persistentVolumes set up by the cluster admin are safe to use.
    - 'persistentVolumeClaim'
    hostNetwork: false
    hostIPC: false
    hostPID: false
    runAsUser:
    # Require the container to run without root privileges.
    rule: 'MustRunAsNonRoot'
    seLinux:
    # This policy assumes the nodes are using AppArmor rather than SELinux.
    rule: 'RunAsAny'
    supplementalGroups:
    rule: 'MustRunAs'
    ranges:
    # Forbid adding the root group.
    - min: 1
    max: 65535
    fsGroup:
    rule: 'MustRunAs'
    ranges:
    # Forbid adding the root group.
    - min: 1
    max: 65535
    readOnlyRootFilesystem: false

    To implement the policy, run the command:
    kubectl create -f restricted.yml
  verified: true
  evaluation:
    method: posture
    checks:
    - privileged
    - run-as-root
    - privilege-escalation
    onFail: Open
    onPass: Not_Reviewed
    exemptNamespaces: true
    note: 'Evidence-based: running privileged/root/escalating pods show the admission policy does not enforce least privilege. The STIG check itself inspects the admission configuration, which this tool does not read; a clean result still needs manual review.'
- benchmark: kubernetes
  vulnId: V-242438
  ruleId: SV-242438r961620_rule
  ruleVersion: CNTR-K8-002600
  groupTitle: SRG-APP-000435-CTR-001070
  ruleTitle: Kubernetes API Server must configure timeouts to limit attack surface.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002415
  legacyIds: []
  discussion: Kubernetes API Server request timeouts sets the duration a request stays open before timing out. Since the API Server is the central component in the Kubernetes Control Plane, it is vital to protect this service. If request timeouts were not set, malicious attacks or unwanted activities might affect multiple deployments across different applications or environments. This might deplete all resources from the Kubernetes infrastructure causing the information system to go offline. The "--request-timeout" value must never be set to "0". This disables the request-timeout feature. (By default, the "--request-timeout" is set to "1 minute".)
  checkContent: |-
    Change to the /etc/kubernetes/manifests/ directory on the Kubernetes Control Plane. Run the command:
    grep -I request-timeout *

    If Kubernetes API Server manifest file does not exist, this is a finding.

    If the setting "--request-timeout" is set to "0" in the Kubernetes API Server manifest file, or is not configured this is a finding.
  checkContentRef: M
  fixText: |-
    Edit the Kubernetes API Server manifest file in the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

    Set the value of "--request-timeout" greater than "0".
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
  vulnId: V-242442
  ruleId: SV-242442r1188293_rule
  ruleVersion: CNTR-K8-002700
  groupTitle: SRG-APP-000454-CTR-001110
  ruleTitle: Kubernetes must remove old components after updated versions have been installed.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002617
  legacyIds: []
  discussion: Previous versions of Kubernetes components that are not removed after updates have been installed may be exploited by adversaries by allowing the vulnerabilities to still exist within the cluster. It is important for Kubernetes to remove old pods when newer pods are created using new images to always be at the desired security state.
  checkContent: |-
    To view all pods and the images used to create the pods, from the Control Plane, run the following command:
    kubectl get pods --all-namespaces -o jsonpath="{..image}" | \
    tr -s '[[:space:]]' '\n' | \
    sort | \
    uniq -c

    Review the images used for pods running within Kubernetes.

    If there are multiple versions of the same image, this is a finding.
  checkContentRef: M
  fixText: |-
    Remove any old pods that are using older images. On the Control Plane, run the command:
    kubectl delete pod podname
    (Note: "podname" is the name of the pod to delete.)
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
  vulnId: V-242443
  ruleId: SV-242443r1137649_rule
  ruleVersion: CNTR-K8-002720
  groupTitle: SRG-APP-000456-CTR-001125
  ruleTitle: Kubernetes must contain the latest updates as authorized by IAVMs, CTOs, DTMs, and STIGs.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002635
  legacyIds: []
  discussion: |-
    Kubernetes software must stay up to date with the latest patches, service packs, and hot fixes. Not updating the Kubernetes control plane will expose the organization to vulnerabilities.

    Flaws discovered during security assessments, continuous monitoring, incident response activities, or information system error handling must also be addressed expeditiously.

    Organization-defined time periods for updating security-relevant container platform components may vary based on a variety of factors including, for example, the security category of the information system or the criticality of the update (i.e., severity of the vulnerability related to the discovered flaw).

    This requirement will apply to software patch management solutions that are used to install patches across the enclave and also to applications themselves that are not part of that patch management solution. For example, many browsers today provide the capability to install their own patch software. Patch criticality, as well as system criticality will vary. Therefore, the tactical situations regarding the patch management process will also vary. This means that the time period utilized must be a configurable parameter. Time frames for application of security-relevant software updates may be dependent upon the IAVM process.

    The container platform components will be configured to check for and install security-relevant software updates within an identified time period from the availability of the update. The container platform registry will ensure the images are current. The specific time period will be defined by an authoritative source (e.g., IAVM, CTOs, DTMs, and STIGs).
  checkContent: |-
    Authenticate on the Kubernetes Control Plane. Run the command:
    kubectl version --short

    If kubectl version has a setting not supporting Kubernetes skew policy, this is a finding.

    Note: Kubernetes Skew Policy can be found at: https://kubernetes.io/docs/setup/release/version-skew-policy/#supported-versions
  checkContentRef: M
  fixText: Upgrade Kubernetes to the supported version. Institute and adhere to the policies and procedures to ensure that patches are consistently applied within the time allowed.
  verified: true
  evaluation:
    method: vulnerabilities
    severities:
    - critical
    - high
    fixableOnly: true
    onFail: Not_Reviewed
    onPass: Not_Reviewed
    note: The STIG check verifies the Kubernetes version skew policy, which this tool does not evaluate. Fixable critical/high image vulnerabilities are listed as supporting IAVM evidence.
- benchmark: kubernetes
  vulnId: V-242444
  ruleId: SV-242444r961863_rule
  ruleVersion: CNTR-K8-003110
  groupTitle: SRG-APP-000516-CTR-001325
  ruleTitle: The Kubernetes component manifests must be owned by root.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000366
  legacyIds: []
  discussion: The Kubernetes manifests are those files that contain the arguments and settings for the Control Plane services. These services are etcd, the api server, controller, proxy, and scheduler. If these files can be changed, the scheduler will be implementing the changes immediately. Many of the security settings within the document are implemented through these manifests.
  checkContent: |-
    Review the ownership of the Kubernetes manifests files by using the command:

    stat -c %U:%G /etc/kubernetes/manifests/* | grep -v root:root

    If the command returns any non root:root file permissions, this is a finding.
  checkContentRef: M
  fixText: |-
