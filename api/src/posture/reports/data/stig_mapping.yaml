  vulnId: V-263601
  ruleId: SV-263601r982477_rule
  ruleVersion: SRG-APP-000920-CTR-000320
  groupTitle: SRG-APP-000920
  ruleTitle: The container platform must synchronize system clocks within and between systems or system components.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-004922
  legacyIds: []
  discussion: Time synchronization of system clocks is essential for the correct execution of many system services, including identification and authentication processes that involve certificates and time-of-day restrictions as part of access control. Denial of service or failure to deny expired credentials may result without properly synchronized clocks within and between systems and system components. Time is commonly expressed in Coordinated Universal Time (UTC), a modern continuation of Greenwich Mean Time (GMT), or local time with an offset from UTC. The granularity of time measurements refers to the degree of synchronization between system clocks and reference clocks, such as clocks synchronizing within hundreds of milliseconds or tens of milliseconds. Organizations may define different time granularities for system components. Time service can be critical to other security capabilities such as access control and identification and authentication depending on the nature of the mechanisms
    used to support the capabilities.
  checkContent: |-
    Verify the container platform is configured to synchronize system clocks within and between systems or system components.

    If the container platform is not configured to synchronize system clocks within and between systems or system components, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to synchronize system clocks within and between systems or system components.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-270875
  ruleId: SV-270875r1050646_rule
  ruleVersion: SRG-APP-000247-CTR-000330
  groupTitle: SRG-APP-000247
  ruleTitle: The container must have resource request limits set.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001095
  legacyIds: []
  discussion: Setting a container resource request limit allows the container platform to determine the best location for the container to execute. The container platform looks at the resources available and finds the location that will require the minimum resources for the container to execute. Examples of resources that can be specified are CPU, memory, and storage.
  checkContent: |-
    Review the container platform configuration to determine that resource limits are set.

    If the container platform does not enforce resource limits, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to restrict the ability of users or other systems to launch denial-of-service (DoS) attacks from the container platform components by setting resource limits on resources such as memory, storage, and CPU utilization.
  verified: true
  evaluation:
    method: posture
    checks:
    - no-resource-limits
    - no-resource-requests
    onFail: Open
    onPass: NotAFinding
- benchmark: container-platform-srg
  vulnId: V-270876
  ruleId: SV-270876r1050649_rule
  ruleVersion: SRG-APP-000380-CTR-000340
  groupTitle: SRG-APP-000380
  ruleTitle: The container root filesystem must be mounted as read-only.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001813
  legacyIds: []
  discussion: Any changes to a container must be made by rebuilding the image and redeploying the new container image. Once a container is running, changes to the root filesystem should not be needed, thus preserving the immutable nature of the container. Any attempts to change the root filesystem are usually malicious in nature and can be prevented by making the root filesystem read-only.
  checkContent: |-
    Review the container platform configuration to determine that the root filesystem is mounted as read-only.

    If the container platform does not enforce such access restrictions, this is a finding.
  checkContentRef: M
  fixText: Review and remove nonsystem containers previously created with read-write permissions. Configure the container platform to force the root filesystem to be mounted as read-only.
  verified: true
  evaluation:
    method: posture
    checks:
    - writable-rootfs
    onFail: Open
    onPass: NotAFinding
- benchmark: container-platform-srg
  vulnId: V-278968
  ruleId: SV-278968r1137653_rule
  ruleVersion: SRG-APP-001035-CTR-000323
  groupTitle: SRG-APP-001035
  ruleTitle: The container platform must be a version supported by the vendor.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-003376
  legacyIds: []
  discussion: |-
    Unsupported software and systems should not be used because fixes to newly identified bugs will not be implemented by the vendor. The lack of support can result in potential vulnerabilities.

    Software and systems at unsupported servicing levels or releases will not receive security updates for new vulnerabilities, which leaves them subject to exploitation.

    When maintenance updates and patches are no longer available, software is no longer considered supported and should be upgraded or decommissioned.
  checkContent: |-
    Verify the container platform is a version supported by the vendor.

    If the container platform is not a version supported by the vendor, this is a finding.
  checkContentRef: M
  fixText: Install a container platform version supported by the vendor.
  verified: true
  evaluation:
    method: none
