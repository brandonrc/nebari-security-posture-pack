  legacyIds: []
  discussion: |-
    Enforcing a minimum password lifetime helps prevent repeated password changes to defeat the password reuse or history enforcement requirement.

    Restricting this setting limits the user's ability to change their password. Passwords need to be changed at specific policy-based intervals; however, if the application allows the user to immediately and continually change their password, then the password could be repeatedly changed in a short period of time to defeat the organization's policy regarding password reuse.
  checkContent: |-
    Review the container platform configuration to determine if it enforces 24 hours/1 day as the minimum password lifetime.

    If the container platform does not enforce 24 hours/1 day as the minimum password lifetime, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to enforce 24 hours/1 day as the minimum password lifetime.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233098
  ruleId: SV-233098r1043190_rule
  ruleVersion: SRG-APP-000174-CTR-000450
  groupTitle: SRG-APP-000174
  ruleTitle: The container platform must enforce a 60-day maximum password lifetime restriction.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-004066
  legacyIds: []
  discussion: |-
    Any password, no matter how complex, can eventually be cracked; therefore, passwords need to be changed at specific intervals.

    One method of minimizing this risk is to use complex passwords and periodically change them. If the application does not limit the lifetime of passwords and force users to change their passwords, there is the risk that the system and/or application passwords could be compromised.

    This requirement does not include emergency administration accounts that are meant for access to the application in case of failure. These accounts are not required to have maximum password lifetime restrictions.
  checkContent: |-
    Review the container platform configuration to determine if it enforces a 60-day maximum password lifetime restriction.

    If the container platform does not enforce a 60-day maximum password lifetime restriction, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to enforce a 60-day maximum password lifetime restriction.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233101
  ruleId: SV-233101r961044_rule
  ruleVersion: SRG-APP-000177-CTR-000465
  groupTitle: SRG-APP-000177
  ruleTitle: The container platform must map the authenticated identity to the individual user or group account for PKI-based authentication.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000187
  legacyIds: []
  discussion: The container platform and its components may require authentication before use. When the authentication is PKI-based, the container platform or component must map the certificate to a user account. If the certificate is not mapped to a user account, the ability to determine the identity of the individual user or group will not be available for forensic analysis.
  checkContent: |-
    Review documentation and configuration to ensure the container platform provides a PKI integration capability that meets DoD PKI infrastructure requirements.

    If the container platform is not configured to meet this requirement, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to utilize the DoD Enterprise PKI infrastructure.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233102
  ruleId: SV-233102r961047_rule
  ruleVersion: SRG-APP-000178-CTR-000470
  groupTitle: SRG-APP-000178
  ruleTitle: The container platform must obscure feedback of authentication information during the authentication process to protect the information from possible exploitation/use by unauthorized individuals.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000206
  legacyIds: []
  discussion: |-
    To prevent the compromise of authentication information such as passwords during the authentication process, the feedback from the container platform and its components, e.g., runtime, registry, and keystore, must not provide any information that would allow an unauthorized user to compromise the authentication mechanism.

    Obfuscation of user-provided information when typed is a method used in addressing this risk.

    Displaying asterisks when a user types in a password is an example of obscuring feedback of authentication information.
  checkContent: |-
    Review container platform documentation and configuration to determine if any interfaces that are provided for authentication purposes display the user's password when it is typed into the data entry field.

    If authentication information is not obfuscated when entered, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to obscure feedback of authentication information during the authentication process to protect the information from possible exploitation/use by unauthorized individuals.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233105
  ruleId: SV-233105r961056_rule
  ruleVersion: SRG-APP-000181-CTR-000485
  groupTitle: SRG-APP-000181
  ruleTitle: The container platform must provide an audit reduction capability that supports on-demand reporting requirements.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001876
  legacyIds: []
  discussion: |-
    The ability to generate on-demand reports, including after the audit data has been subjected to audit reduction, greatly facilitates the organization's ability to generate incident reports as needed to better handle larger-scale or more complex security incidents.

    Audit reduction is a process that manipulates collected audit information and organizes such information in a summary format that is more meaningful to analysts. The report generation capability provided by the application must support on-demand (i.e., customizable, ad hoc, and as-needed) reports.

    This requirement is specific to applications with audit reduction capabilities; however, applications need to support on-demand audit review and analysis.
  checkContent: |-
    Review the container platform configuration to determine if the container platform is configured to provide an audit reduction capability that supports on-demand reporting requirements.

    If the container platform is not configured to support on-demand reporting requirements, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to support on-demand reporting requirements.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233106
  ruleId: SV-233106r961062_rule
  ruleVersion: SRG-APP-000185-CTR-000490
  groupTitle: SRG-APP-000185
  ruleTitle: The container platform must employ strong authenticators in the establishment of non-local maintenance and diagnostic sessions.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000877
  legacyIds: []
  discussion: |-
    If maintenance tools are used by unauthorized personnel, they may accidentally or intentionally damage or compromise the system. The act of managing systems and applications includes the ability to access sensitive application information, such as, system configuration details, diagnostic information, user information, and potentially sensitive application data.

    Non-local maintenance and diagnostic activities are those activities conducted by individuals communicating through a network, either an external network (e.g., the internet) or an internal network. Local maintenance and diagnostic activities are those activities carried out by individuals physically present at the information system or information system component and not communicating across a network connection. Typically, strong authentication requires authenticators that are resistant to replay attacks and employ multifactor authentication. Strong authenticators include, for example, PKI where certificates are stored on a token protected by a password, passphrase, or biometric.

    This requirement applies to hardware/software diagnostic test equipment or tools. This requirement does not cover hardware/software components that may support information system maintenance, yet are a part of the system (e.g., the software implementing "ping," "ls," "ipconfig," or the hardware and software implementing the monitoring port of an Ethernet switch).
  checkContent: |-
    Review the container platform configuration to determine if the container platform is configured to employ strong authenticators in the establishment of non-local maintenance and diagnostic sessions.

    If the container platform is not configured to employ strong authenticators in the establishment of non-local maintenance and diagnostic sessions, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to employ strong authenticators in the establishment of non-local maintenance and diagnostic sessions.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233108
  ruleId: SV-233108r961068_rule
  ruleVersion: SRG-APP-000190-CTR-000500
  groupTitle: SRG-APP-000190
  ruleTitle: 'The application must terminate all network connections associated with a communications session at the end of the session, or as follows: for in-band management sessions (privileged sessions), the session must be terminated after 10 minutes of inactivity.'
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001133
  legacyIds: []
  discussion: |-
    Terminating an idle session within a short time period reduces the window of opportunity for unauthorized personnel to take control of a management session enabled on the console or console port that has been left unattended. In addition, quickly terminating an idle session will also free up resources committed by the managed network element.

    Terminating network connections associated with communications sessions includes, for example, de-allocating associated TCP/IP address/port pairs at the operating system level, or de-allocating networking assignments at the application level if multiple application sessions are using a single, operating system level network connection. This does not mean that the application terminates all sessions or network access; it only ends the inactive session and releases the resources associated with that session.
  checkContent: |-
    Review documentation and configuration settings to determine if the container platform is configured to close user sessions after defined conditions or trigger events are met.

    If the container platform is not configured or cannot be configured to disconnect users after defined conditions and trigger events are met, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to terminate user sessions on defined conditions or trigger events.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233114
  ruleId: SV-233114r1137643_rule
  ruleVersion: SRG-APP-000211-CTR-000530
  groupTitle: SRG-APP-000211
  ruleTitle: The container platform must separate user functionality (including user interface services) from information system management functionality.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001082
  legacyIds: []
  discussion: |-
    Separating user functionality from management functionality is a requirement for all the components within the container platform. Without the separation, users may have access to management functions that can degrade the container platform and the services being offered and can offer a method to bypass testing and validation of functions before introduced into a production environment.

    The separation should be enforced by each component within the container platform.

    This requirement also applies to Zero Trust initiatives.
  checkContent: |-
    Review the container platform configuration to determine if management functionality is separated from user functionality.

    Validate that the separation is also implemented within the components by trying to execute management functions for each component as a user.

    If the container platform is not configured to separate management and user functionality or if component management and user functionality are not separated, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform and its components to separate management and user functionality.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233118
  ruleId: SV-233118r1043178_rule
  ruleVersion: SRG-APP-000219-CTR-000550
  groupTitle: SRG-APP-000219
  ruleTitle: The container platform must protect authenticity of communications sessions with the use of FIPS-validated 140-2 or 140-3 security requirements for cryptographic modules.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-001184
  legacyIds: []
  discussion: The container platform is responsible for pulling images from trusted sources and placing those images into its registry. To protect the transmission of images, the container platform must use FIPS-validated 140-2 or 140-3 cryptographic modules. This added protection defends against main-in-the-middle attacks where malicious code could be added to an image during transmission.
  checkContent: |-
    Review the container platform configuration to determine if FIPS-validated 140-2 or 140-3 cryptographic modules are being used to protect container images during transmission.

    If FIPS-validated 140-2 or 140-3 cryptographic modules are not being use, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to use FIPS-validated 140-2 or 140-3 cryptographic modules to protect container images during transmission.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233122
  ruleId: SV-233122r961122_rule
  ruleVersion: SRG-APP-000225-CTR-000570
  groupTitle: SRG-APP-000225
  ruleTitle: The container platform runtime must fail to a secure state if system initialization fails, shutdown fails, or aborts fail.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001190
  legacyIds: []
  discussion: The container platform offers services for container image orchestration and services for users. If any of these services were to fail into an insecure state, security measures for user and data separation and image instantiation could become absent. In addition, audit log protections could be relaxed allowing for investigation of what occurred could be lost. To protect services and data, it is important for the container platform to fail to a secure state if the container platform registry initialization fails, shutdown fails, or aborts fail.
  checkContent: |-
    Review documentation and configuration to determine if the container platform runtime fails to a secure state if system initialization fails, shutdown fails, or aborts fail.

    If the container platform runtime cannot be configured to fail securely, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform runtime to fail to a secure state if system initialization fails, shutdown fails, or aborts fail.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233123
  ruleId: SV-233123r961125_rule
  ruleVersion: SRG-APP-000226-CTR-000575
  groupTitle: SRG-APP-000226
  ruleTitle: The container platform must preserve any information necessary to determine the cause of the disruption or failure.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001665
  legacyIds: []
  discussion: When a failure occurs within the container platform, preserving the state of the container platform and its components, along with other container services, helps to facilitate container platform restart and return to the operational mode of the organization with less disruption to mission essential processes. When preserving state, considerations for preservation of data confidentiality and integrity must be taken into consideration.
  checkContent: |-
    Review the container platform configuration to determine if information necessary to determine the cause of a disruption or failure is preserved.

    If the information is not preserved, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to preserve information necessary to determine the cause of the disruption or failure.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233125
  ruleId: SV-233125r961131_rule
  ruleVersion: SRG-APP-000233-CTR-000585
  groupTitle: SRG-APP-000233
  ruleTitle: The container platform runtime must isolate security functions from non-security functions.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001084
  legacyIds: []
  discussion: The container platform runtime must be configured to isolate those services used for security functions from those used for non-security functions. This separation can be performed using environment variables, labels, network segregation, and kernel groups.
  checkContent: |-
    Verify container platform runtime configuration settings to determine whether container services used for security functions are located in an isolated security function such as a separate environment variables, labels, network segregation, and kernel groups.

    If security-related functions are not separate, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform runtime to isolate security functions from non-security functions.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233126
  ruleId: SV-233126r971528_rule
  ruleVersion: SRG-APP-000234-CTR-000590
  groupTitle: SRG-APP-000234
  ruleTitle: The container platform must never automatically remove or disable emergency accounts.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001682
  legacyIds: []
  discussion: |-
    Emergency accounts are administrator accounts that are established in response to crisis situations where the need for rapid account activation is required. Therefore, emergency account activation may bypass normal account authorization processes. If these accounts are automatically disabled, system maintenance during emergencies may not be possible, thus adversely affecting system availability.

    Emergency accounts are different from infrequently used accounts (i.e., local logon accounts used by system administrators when network or normal logon/access is not available). Infrequently used accounts also remain available and are not subject to automatic termination dates. However, an emergency account is normally a different account that is created for use by vendors or system maintainers.

    To address access requirements, many application developers choose to integrate their applications with enterprise-level authentication/access mechanisms that meet or exceed access control policy requirements. Such integration allows the application developer to off-load those access control functions and focus on core application features and functionality.
  checkContent: |-
    Review the container platform to determine if emergency accounts are automatically removed or disabled.

    If emergency accounts are automatically removed or disabled, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to never remove or disable emergency accounts.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233127
  ruleId: SV-233127r1137644_rule
  ruleVersion: SRG-APP-000243-CTR-000595
  groupTitle: SRG-APP-000243
  ruleTitle: The container platform must prohibit containers from accessing privileged resources.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001090
  legacyIds: []
  discussion: |-
    Containers images instantiated within the container platform may request access to host system resources. Access to privileged resources can allow for unauthorized and unintended transfer of information, but in some cases, these resources may be needed for the service being offered by the container. By default, containers should be denied instantiation when privileged system resources are requested and granted only after approval has been given.

    When access to privileged resources is necessary for a container, a new policy for execution should be written for the container. The default behavior must not give containers privileged access to host system resources.

    Examples of system resources that should be protected are kernel namespaces and host system sensitive directories such as /etc and /usr.

    This requirement also applies to Zero Trust initiatives.
  checkContent: |-
    Review documentation and configuration to determine if the container platform disallows instantiation of containers trying to access host system privileged resources.

    If the container platform does not block containers requesting host system privileged resources, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to block instantiation of containers requesting access to host system-privileged resources.
  verified: true
  evaluation:
    method: posture
    checks:
    - privileged
    - host-namespaces
    - host-path
    - added-capabilities
    onFail: Open
    onPass: NotAFinding
    requireRestrictedPsa: true
    note: 'The requirement is that the platform prohibits privileged access: NotAFinding only when Pod Security Admission enforces "restricted" on every in-scope namespace; an observed absence of privileged pods alone is Not_Reviewed.'
- benchmark: container-platform-srg
  vulnId: V-233128
  ruleId: SV-233128r1137645_rule
  ruleVersion: SRG-APP-000243-CTR-000600
  groupTitle: SRG-APP-000243
  ruleTitle: The container platform must prevent unauthorized and unintended information transfer via shared system resources.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001090
  legacyIds: []
  discussion: |-
    The container platform makes host system resources available to container services. These shared resources, such as the host system kernel, network connections, and storage, must be protected to prevent unauthorized and unintended information transfer. The protections must be implemented for users and processes acting on behalf of users.

    This requirement also applies to Zero Trust initiatives.
  checkContent: |-
    Review the container platform architecture documentation to find out if and how it protects the resources of one process or user (such as working memory, storage, host system kernel, network connections) from unauthorized access by another user or process.

    If the container platform configuration settings do not effectively implement these protections to prevent unauthorized access by another user or process, this is a finding.
  checkContentRef: M
  fixText: Deploy a container platform capable of effectively protecting the resources of one process or user from unauthorized access by another user or process. Configure the container platform to effectively protect the resources of one process or user from unauthorized access by another user or process. The container security solution should help the user understand where the code in the environment was deployed from, and provide controls that prevent deployment from untrusted sources or registries.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233129
  ruleId: SV-233129r961152_rule
  ruleVersion: SRG-APP-000246-CTR-000605
  groupTitle: SRG-APP-000246
  ruleTitle: The container platform must restrict individuals' ability to launch organizationally defined denial-of-service (DoS) attacks against other information systems.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001094
  legacyIds: []
  discussion: The container platform will offer services to users and these services share resources available on the hosting system. To share the resources in a manner that does not exhaust or over utilize resources, it is necessary for the container platform to have mechanisms that allow developers to size there containers to provide minimum and maximum amounts. If there is no mechanism to specify limits, container services can cause DoS by over utilization.
  checkContent: |-
    Review the container platform implementation and security documentation and components settings to determine if the information system restricts the ability of users or systems to launch organization-defined DoS attacks against other information systems or networks from the container platform.

    If the container platform is not configured to restrict this ability, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to restrict the ability of users or other systems to launch DoS attacks from the container platform components by setting resource quotas on resources such as memory, storage, and CPU utilization.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233133
  ruleId: SV-233133r961167_rule
  ruleVersion: SRG-APP-000266-CTR-000625
  groupTitle: SRG-APP-000266
  ruleTitle: The container platform must generate error messages that provide information necessary for corrective actions without revealing information that could be exploited by adversaries.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001312
  legacyIds: []
  discussion: The container platform is responsible for offering services to users. These services could be across diverse user groups and data types. To protect information about the container platform, services, users, and data, it is important during error message generation to offer enough information to diagnose the error, but not reveal information that needs to be protected.
  checkContent: |-
    Review documentation and logs to determine if the container platform writes sensitive information such as passwords or private keys into the logs and administrative messages.

    If the container platform writes sensitive or potentially harmful information into the logs and administrative messages, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to not write sensitive information into the logs and administrative messages.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233142
  ruleId: SV-233142r961206_rule
  ruleVersion: SRG-APP-000290-CTR-000670
  groupTitle: SRG-APP-000290
  ruleTitle: The container platform must use cryptographic mechanisms to protect the integrity of audit tools.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001496
  legacyIds: []
  discussion: |-
    Protecting the integrity of the tools used for auditing purposes is a critical step to ensuring the integrity of audit data. Audit data includes all information (e.g., audit records, audit settings, and audit reports) needed to successfully audit information system activity.

    Audit tools include, but are not limited to, vendor provided and open source audit tools needed to successfully view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.

    It is common for attackers to replace the audit tools or inject code into the existing tools with the purpose of providing the capability to hide or erase system activity from the audit logs.

    To address this risk, audit tools must be cryptographically signed in order to provide the capability to identify when the audit tools have been modified, manipulated, or replaced. An example is a checksum hash of the file or files.
  checkContent: |-
    Review the container platform configuration to determine if the integrity of the audit tools is protected using cryptographic mechanisms.

    If audit tools are not protected through cryptographic mechanisms, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to use cryptographic mechanisms to protect the integrity of audit tools.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233143
  ruleId: SV-233143r981871_rule
  ruleVersion: SRG-APP-000291-CTR-000675
  groupTitle: SRG-APP-000291
  ruleTitle: The container platform must notify system administrators (SAs) and the information system security officer (ISSO) when accounts are created.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000015
  legacyIds: []
  discussion: |-
    Once an attacker establishes access to an application, the attacker often attempts to create a persistent method of re-establishing access. One way to accomplish this is for the attacker to simply create a new account. Sending notification of account creation events to the SA and ISSO is one method for mitigating this risk.

    To address access requirements, many application developers choose to integrate their applications with enterprise-level authentication/access/auditing mechanisms that meet or exceed access control policy requirements. Such integration allows the application developer to offload those access control functions and focus on core application features and functionality.
  checkContent: |-
    Review the container platform configuration to determine if system administrators and ISSO are notified when accounts are created.

    If SAs and ISSO are not notified, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to notify SAs and ISSO when accounts are created.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233144
  ruleId: SV-233144r981872_rule
  ruleVersion: SRG-APP-000292-CTR-000680
  groupTitle: SRG-APP-000292
  ruleTitle: The container platform must notify system administrators (SAs) and the information system security officer (ISSO) when accounts are modified.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000015
  legacyIds: []
  discussion: |-
    When application accounts are modified, user accessibility is affected. Accounts are utilized for identifying individual users or for identifying the application processes themselves. Sending notification of account modification events to the system administrator and ISSO is one method for mitigating this risk. Such a capability greatly reduces the risk that application accessibility will be negatively affected for extended periods of time and provides logging that can be used for forensic purposes.

    To address access requirements, many operating systems can be integrated with enterprise-level authentication/access/auditing mechanisms that meet or exceed access control policy requirements.
  checkContent: |-
    Review the container platform configuration to determine if system administrators and ISSO are notified when accounts are modified.

    If system administrators and ISSO are not notified, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to notify system administrators and ISSO when accounts are modified.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233145
  ruleId: SV-233145r981873_rule
  ruleVersion: SRG-APP-000293-CTR-000685
  groupTitle: SRG-APP-000293
  ruleTitle: The container platform must notify system administrators and ISSO for account disabling actions.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000015
  legacyIds: []
  discussion: |-
    When application accounts are disabled, user accessibility is affected. Accounts are utilized for identifying individual users or for identifying the application processes themselves. Sending notification of account disabling events to the system administrator and ISSO is one method for mitigating this risk. Such a capability greatly reduces the risk that application accessibility will be negatively affected for extended periods of time and provides logging that can be used for forensic purposes.

    To address access requirements, many operating systems can be integrated with enterprise-level authentication/access/auditing mechanisms that meet or exceed access control policy requirements.
  checkContent: |-
    Review the container platform configuration to determine if system administrators and ISSO are notified when accounts are disabled.

    If system administrators and ISSO are not notified, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to notify system administrators and ISSO when accounts are disabled.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233146
  ruleId: SV-233146r981874_rule
  ruleVersion: SRG-APP-000294-CTR-000690
  groupTitle: SRG-APP-000294
  ruleTitle: The container platform must notify system administrators and ISSO for account removal actions.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000015
  legacyIds: []
  discussion: |-
    When application accounts are removed, user accessibility is affected. Accounts are utilized for identifying users or for identifying the application processes themselves. Sending notification of account removal events to the system administrator and ISSO is one method for mitigating this risk. Such a capability greatly reduces the risk that application accessibility will be negatively affected for extended periods of time, and provides logging that can be used for forensic purposes.

    To address access requirements, many operating systems can be integrated with enterprise-level authentication/access/auditing mechanisms that meet or exceed access control policy requirements.
  checkContent: |-
    Review the container platform configuration to determine if system administrators and ISSO are notified when accounts are removed.

    If system administrators and ISSO are not notified, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to notify system administrators and ISSO when accounts are removed.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233149
  ruleId: SV-233149r961227_rule
  ruleVersion: SRG-APP-000297-CTR-000705
  groupTitle: SRG-APP-000297
  ruleTitle: Access to the container platform must display an explicit logout message to user indicating the reliable termination of authenticated communication sessions.
  severity: low
  cat: III
  weight: '10.0'
  ccis:
  - CCI-002364
  legacyIds: []
  discussion: Access to the container platform will occur through web and terminal sessions. Any web interfaces must conform to application and web security requirements. Terminal access to the container platform and its components must provide a logout facility that terminates the connection to the component or the platform.
  checkContent: |-
    Review documentation and configuration settings to determine if the container platform displays a logout message.

    If the container platform does not display a logout message, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform components to display an explicit logout message to users.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233155
  ruleId: SV-233155r981875_rule
  ruleVersion: SRG-APP-000317-CTR-000735
  groupTitle: SRG-APP-000317
  ruleTitle: The container platform must terminate shared/group account credentials when members leave the group.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-004045
  legacyIds: []
  discussion: If shared/group account credentials are not terminated when individuals leave the group, the user that left the group can still gain access even though they are no longer authorized. A shared/group account credential is a shared form of authentication that allows multiple individuals to access the application using a single account. There may also be instances when specific user actions need to be performed on the information system without unique user identification or authentication. Examples of credentials include passwords and group membership certificates.
  checkContent: |-
    Determine if the container platform is configured to terminate shared/group account credentials when members leave the group.

    If the container platform does not terminated shared/group account credentials when members leave the group, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to terminate shared/group account credentials when members leave the group.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233157
  ruleId: SV-233157r961290_rule
  ruleVersion: SRG-APP-000319-CTR-000745
  groupTitle: SRG-APP-000319
  ruleTitle: The container platform must automatically audit account-enabling actions.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002130
  legacyIds: []
  discussion: |-
    Once an attacker establishes access to an application, the attacker often attempts to create a persistent method of re-establishing access. One way to accomplish this is for the attacker to simply enable a new or disabled account. Automatically auditing account enabling actions provides logging that can be used for forensic purposes.

    To address access requirements, many application developers choose to integrate their applications with enterprise-level authentication/access/auditing mechanisms that meet or exceed access control policy requirements. Such integration allows the application developer to off-load those access control functions and focus on core application features and functionality.
  checkContent: |-
    Determine if the container platform is configured to automatically audit account-enabling actions.

    If the container platform is not configured to automatically audit account-enabling actions, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to automatically audit account-enabling actions.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233158
  ruleId: SV-233158r981878_rule
  ruleVersion: SRG-APP-000320-CTR-000750
  groupTitle: SRG-APP-000320
  ruleTitle: The container platform must notify the system administrator (SA) and information system security officer (ISSO) of account enabling actions.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000015
  legacyIds: []
  discussion: |-
    Once an attacker establishes access to an application, the attacker often attempts to create a persistent method of re-establishing access. One way to accomplish this is for the attacker to simply enable a new or disabled account. Sending notification of account enabling events to the system administrator and ISSO is one method for mitigating this risk. Such a capability greatly reduces the risk that application accessibility will be negatively affected for extended periods of time and provides logging that can be used for forensic purposes.

    To detect and respond to events that affect user accessibility and application processing, applications must notify the appropriate individuals so they can investigate the event.

    To address access requirements, many application developers choose to integrate their applications with enterprise-level authentication/access/auditing mechanisms that meet or exceed access control policy requirements. Such integration allows the application developer to offload those access control functions and focus on core application features and functionality.
  checkContent: |-
    Determine if the container platform is configured to notify system administrator and ISSO of account enabling actions.

    If the container platform is not configured to notify the SA and ISSO of account enabling actions, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to notify the SA and ISSO of account enabling actions.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233162
  ruleId: SV-233162r961353_rule
  ruleVersion: SRG-APP-000340-CTR-000770
  groupTitle: SRG-APP-000340
  ruleTitle: The container platform must prevent non-privileged users from executing privileged functions to include disabling, circumventing, or altering implemented security safeguards/countermeasures.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002235
  legacyIds: []
  discussion: Controlling what users can perform privileged functions prevents unauthorized users from performing tasks that may expose data or degrade the container platform. When users are not segregated into privileged and non-privileged users, unauthorized individuals may perform tasks such as deploying containers, pulling images into the register, and modify keys in the keystore. These actions can introduce malicious containers and cause denial-of-service (DoS) attacks and undermine the container platform integrity. The enforcement may take place at the container platform and can be implemented within each container platform component (e.g. runtime, registry, and keystore).
  checkContent: |-
    Review documentation to obtain the definition of the container platform functionality considered privileged in the context of the information system in question.

    Review the container platform security configuration and/or other means used to protect privileged functionality from unauthorized use.

    If the configuration does not protect all of the actions defined as privileged, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to security to protect all privileged functionality. Assigning roles that limit what actions a particular user can perform are the most common means of meeting this requirement.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233163
  ruleId: SV-233163r961359_rule
  ruleVersion: SRG-APP-000342-CTR-000775
  groupTitle: SRG-APP-000342
  ruleTitle: Container images instantiated by the container platform must execute using least privileges.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002233
  legacyIds: []
  discussion: |-
    Containers running within the container platform must execute as non-privileged. When a container can execute as a privileged container, the privileged container is also a privileged user within the hosting system, and the hosting system becomes a major security risk. It is important for the container platform runtime to validate the container user and disallow instantiation if the container is trying to execute with more privileges than required, as a privileged user, or is trying to perform a privilege escalation.

    When privileged access is necessary for a container, a new policy for execution should be written for the container. The default behavior must not give containers privileged execution.

    Examples of privileged users are root, admin, and default service accounts for the container platform.
  checkContent: |-
    Review documentation and configuration to determine if the container platform disallows instantiation of containers trying to execute with more privileges than required or with privileged permissions.

    If the container platform does not block containers requesting privileged permissions, privilege escalation, or allows containers to have more privileges than required, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to block instantiation with no more privileges than necessary.
  verified: true
  evaluation:
    method: posture
    checks:
    - run-as-root
    - privilege-escalation
    - capabilities-not-dropped
    - seccomp-unconfined
    - automount-sa-token
    onFail: Open
    onPass: NotAFinding
    requireRestrictedPsa: true
    note: NotAFinding only when Pod Security Admission enforces "restricted" on every in-scope namespace; an observed absence of violations alone is Not_Reviewed.
- benchmark: container-platform-srg
  vulnId: V-233164
  ruleId: SV-233164r961362_rule
  ruleVersion: SRG-APP-000343-CTR-000780
  groupTitle: SRG-APP-000343
  ruleTitle: The container platform must audit the execution of privileged functions.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002234
  legacyIds: []
  discussion: Privileged functions within the container platform can be component specific or can envelope the entire container platform. Because of the nature of the commands, it is important to understand what command was executed for either investigation of an incident or for debugging/error correction; therefore, privileged function execution must be audited.
  checkContent: |-
    Review container platform documentation and log configuration to verify the application server logs privileged activity.

    If the container platform is not configured to log privileged activity, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to log privileged activity.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233165
  ruleId: SV-233165r961368_rule
  ruleVersion: SRG-APP-000345-CTR-000785
  groupTitle: SRG-APP-000345
  ruleTitle: The container platform must automatically lock an account until the locked account is released by an administrator when three unsuccessful login attempts in 15 minutes are exceeded.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002238
  legacyIds: []
  discussion: By limiting the number of failed login attempts, the risk of unauthorized system access via user password guessing, otherwise known as brute forcing, is reduced. Limits are imposed by locking the account.
  checkContent: |-
    Determine if the container platform is configured to automatically lock an account until the locked account is released by an administrator when three unsuccessful login attempts in 15 minutes are exceeded.

    If the container platform is not configured to lock the account, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to automatically lock an account until the locked account is released by an administrator when three unsuccessful login attempts in 15 minutes are exceeded.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233166
  ruleId: SV-233166r961863_rule
  ruleVersion: SRG-APP-000516-CTR-000790
  groupTitle: SRG-APP-000516
  ruleTitle: The container platform must provide the configuration for organization-identified individuals or roles to change the auditing to be performed on all components, based on all selectable event criteria within organization-defined time thresholds.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000366
  legacyIds: []
  discussion: |-
    Auditing requirements may change per organization or situation within and organization. With the container platform allowing an organization to customize the auditing, an organization can decide to extend or limit auditing as necessary to meet organizational requirements. Auditing that is limited to conserve resources may be extended to address certain threat situations. In addition, auditing may be limited to a specific set of events to facilitate audit reduction, analysis, and reporting. Organizations can establish time thresholds in which audit actions are changed, for example, near real-time, within minutes, or within hours.

    Modifying auditing within the container platform must be controlled to only those individuals or roles identified by the organization to modify auditable events.
  checkContent: |-
    Review documentation and configuration setting.

    If the container platform does not provide the ability for users in authorized roles to reconfigure auditing at any time of the user's choosing, this is a finding.

    If changes in audit configuration cannot take effect until after a certain time or date, or until some event, such as a server restart, has occurred, and if that time or event does not meet the requirements specified by the organization, this is a finding.
  checkContentRef: M
  fixText: Deploy a container platform that provides the ability for users in authorized roles to reconfigure auditing at any time. Deploy a container platform that allows audit configuration changes to take effect within the timeframe required by the organization and without involving actions or events that the organization rules unacceptable.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233168
  ruleId: SV-233168r961392_rule
  ruleVersion: SRG-APP-000357-CTR-000800
  groupTitle: SRG-APP-000357
  ruleTitle: The container platform must allocate audit record storage capacity in accordance with organization-defined audit record storage requirements.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001849
  legacyIds: []
  discussion: |-
    In order to ensure applications have a sufficient storage capacity in which to write the audit logs, applications need to be able to allocate audit record storage capacity.

    The task of allocating audit record storage capacity is usually performed during initial installation of the application and is closely associated with the DBA and system administrator roles. The DBA or system administrator will usually coordinate the allocation of physical drive space with the application owner/installer and the application will prompt the installer to provide the capacity information, the physical location of the disk, or both.
  checkContent: |-
    Review the container platform configuration to determine if audit record storage capacity is allocated in accordance with organization-defined audit record storage requirements.

    If audit record storage capacity is not allocated in accordance with organization-defined audit record storage requirements, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to allocate audit record storage capacity in accordance with organization-defined audit record storage requirements.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233169
  ruleId: SV-233169r961395_rule
  ruleVersion: SRG-APP-000358-CTR-000805
  groupTitle: SRG-APP-000358
  ruleTitle: Audit records must be stored at a secondary location.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001851
  legacyIds: []
  discussion: Auditable events are used in the investigation of incidents and must be protected from being deleted or altered. Often, events that took place in the past must be viewed to understand the entire incident. For the purposes of audit event protection and recall, audit events are often off-loaded to an external storage location. The container platform must provide a mechanism to assist in the off-loading of the audit data or at a minimum, must not hinder an external process used for audit event off-loading.
  checkContent: |-
    Verify the log records are being off-loaded to a separate system or transferred from the container platform storage location to a storage location other than the container platform itself.

    The information system may demonstrate this capability using a log management application, system configuration, or other means.

    If logs are not being off-loaded, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to off-load the logs to a remote log or management server.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233170
  ruleId: SV-233170r961398_rule
  ruleVersion: SRG-APP-000359-CTR-000810
  groupTitle: SRG-APP-000359
  ruleTitle: The container platform must provide an immediate warning to the SA and ISSO (at a minimum) when allocated audit record storage volume reaches 75 percent of repository maximum audit record storage capacity.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001855
  legacyIds: []
  discussion: If security personnel are not notified immediately upon storage volume utilization reaching 75 percent, they are unable to plan for storage capacity expansion.
  checkContent: |-
    Review the container platform configuration to determine if it is configured to provide an immediate warning to the SA and ISSO (at a minimum) when allocated audit record storage volume reaches 75 percent of repository maximum audit record storage capacity.

    If the container platform is not configured to provide an immediate real-time alert, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to provide an immediate real-time alert to the SA and ISSO when allocated audit record storage volume reaches 75 percent of repository maximum audit record storage capacity.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233171
  ruleId: SV-233171r961401_rule
  ruleVersion: SRG-APP-000360-CTR-000815
  groupTitle: SRG-APP-000360
  ruleTitle: The container platform must provide an immediate real-time alert to the SA and ISSO, at a minimum, of all audit failure events requiring real-time alerts.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001858
  legacyIds: []
  discussion: |-
    It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit logs as required. Without a real-time alert, security personnel may be unaware of an impending failure of the audit capability and system operation may be adversely affected.

    Alerts provide organizations with urgent messages. Real-time alerts provide these messages immediately (i.e., the time from event detection to alert occurs in seconds or less).
  checkContent: |-
    Review the container platform configuration to determine if it is configured to provide an immediate real-time alert to the SA and ISSO of all audit failure events requiring real-time alerts.

    If the container platform is not configured to provide an immediate real-time alert, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to provide an immediate real-time alert to the SA and ISSO of all audit failure events requiring real-time alerts.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233181
  ruleId: SV-233181r961443_rule
  ruleVersion: SRG-APP-000374-CTR-000865
  groupTitle: SRG-APP-000374
  ruleTitle: All audit records must use UTC or GMT time stamps.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001890
  legacyIds: []
  discussion: |-
    The container platform and its components must generate audit records using either Coordinated Universal Time (UTC) or Greenwich Mean Time (GMT) time stamps or local time that offset from UTC. All the components must use the same standard so that the events can be tied together to understand what took place within the overall container platform.

    Time stamps generated by the container platform and its components must include date and time.
  checkContent: |-
    Review the container platform documentation and configuration files to determine if time stamps for log records can be mapped to UTC or GMT or local time that offsets from UTC.

    If the time stamp cannot be mapped to UTC or GMT, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to use UTC or GMT or local time that offset from UTC based time stamps for log records.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233182
  ruleId: SV-233182r961446_rule
  ruleVersion: SRG-APP-000375-CTR-000870
  groupTitle: SRG-APP-000375
  ruleTitle: The container platform must record time stamps for audit records that meet a granularity of one second for a minimum degree of precision.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001889
  legacyIds: []
  discussion: |-
    To properly investigate an event, it is important to have enough granularity within the time stamps to determine the chronological order of the audited events. Without this granularity, events may be interpreted out of proper sequence, thus hobbling the investigation or causing the investigation to come to inaccurate conclusions.

    Time stamps generated by the container platform include date and time. Granularity of time measurements refers to the degree of synchronization between information system clocks and reference clocks.
  checkContent: |-
    Review the container platform documentation and configuration files to determine if time stamps for log records meet a granularity of one second.

    If the time stamp cannot generate to a one-second granularity, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to use time stamps for log records that can meet a granularity of one second.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233184
  ruleId: SV-233184r981884_rule
  ruleVersion: SRG-APP-000378-CTR-000880
  groupTitle: SRG-APP-000378
  ruleTitle: The container platform must prohibit the installation of patches and updates without explicit privileged status.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-003980
  legacyIds: []
  discussion: Controlling access to those users and roles responsible for patching and updating the container platform reduces the risk of untested or potentially malicious software from being installed within the platform. This access may be separate from the access required to install container images into the registry and those access requirements required to instantiate an image into a service. Explicit privileges (escalated or administrative privileges) provide the regular user with explicit capabilities and control that exceeds the rights of a regular user.
  checkContent: |-
    Review the container platform configuration to determine if patches and updates can only be installed through accounts with privileged status.

    Attempt to install a patch or upgrade using a nonprivileged user account.

    If patches or updates can be installed using a nonprivileged account or the container platform is not configured to stop the installation using a nonprivileged account, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to only allow patch installation and upgrades using privileged accounts.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233185
  ruleId: SV-233185r981885_rule
  ruleVersion: SRG-APP-000378-CTR-000885
  groupTitle: SRG-APP-000378
  ruleTitle: The container platform runtime must prohibit the instantiation of container images without explicit privileged status.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-003980
  legacyIds: []
  discussion: Controlling access to those users and roles responsible for container image instantiation reduces the risk of untested or potentially malicious containers from being executed within the platform and on the hosting system. This access may be separate from the access required to install container images into the registry and those access requirements required to perform patch management and upgrades within the container platform. Explicit privileges (escalated or administrative privileges) provide the regular user with explicit capabilities and control that exceeds the rights of a regular user.
  checkContent: |-
    Review the container platform runtime configuration to determine if only accounts given specific container instantiation privileges can execute the container image instantiation process.

    Attempt to instantiate a container image using an account that does not have the proper privileges to execute the process.

    If container images can be instantiated using an account without the proper privileges, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform runtime to prohibit the instantiation of container images without explicit container image instantiation privileges given to users.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233186
  ruleId: SV-233186r981888_rule
  ruleVersion: SRG-APP-000378-CTR-000890
  groupTitle: SRG-APP-000378
  ruleTitle: The container platform registry must prohibit installation or modification of container images without explicit privileged status.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-003980
  legacyIds: []
  discussion: Controlling access to those users and roles that perform container platform registry functions reduces the risk of untested or potentially malicious containers from being introduced into the platform. This access may be separate from the access required to instantiate container images into services and those access requirements required to perform patch management and upgrades within the container platform. Explicit privileges (escalated or administrative privileges) provide the regular user with explicit capabilities and control that exceeds the rights of a regular user.
  checkContent: |-
    Review container platform registry security settings with respect to nonadministrative users' ability to create, alter, or replace container images.

    If any such permissions exist and are not documented and approved, this is a finding.
  checkContentRef: M
  fixText: Document and obtain approval for any nonadministrative users who require the ability to create, alter, or replace container images within the container platform registry. Implement the approved permissions. Revoke any unapproved permissions.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233188
  ruleId: SV-233188r961461_rule
  ruleVersion: SRG-APP-000380-CTR-000900
  groupTitle: SRG-APP-000380
  ruleTitle: The container platform must enforce access restrictions for container platform configuration changes.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001813
  legacyIds: []
  discussion: Configuration changes cause the container platform to change the way it operates. These changes can be used to improve the system with added features or performance, but these configuration changes can also be used to introduce malicious features and degrade performance. To control the configuration changes made to the container platform, it is important that only authorized users are allowed, through container platform enforcement, to make configuration changes.
  checkContent: |-
    Review documentation and configuration settings to determine if the container platform enforces access restrictions associated with changes to container platform components configuration.

    If the container platform does not enforce such access restrictions, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to enforce access restrictions associated with changes to the container platform components configuration.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233189
  ruleId: SV-233189r981889_rule
  ruleVersion: SRG-APP-000381-CTR-000905
  groupTitle: SRG-APP-000381
  ruleTitle: The container platform must enforce access restrictions and support auditing of the enforcement actions.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-003938
  legacyIds: []
  discussion: |-
    Auditing the enforcement of access restrictions against changes to the container platform helps identify attacks and provides forensic data for investigation for after-the-fact actions. Attempts to change configurations, components, or data maintained by a component (e.g., images in the registry, running containers in the runtime, or keys in the keystore) must be audited.

    Enforcement actions are the methods or mechanisms used to prevent unauthorized changes to configuration settings. Enforcement action methods may be as simple as denying access to a file based on the application of file permissions (access restriction). Audit items may consist of lists of actions blocked by access restrictions or changes identified after the fact.
  checkContent: |-
    Review container platform documentation and logs to determine if enforcement actions used to restrict access associated with changes to the container platform are logged.

    If these actions are not logged, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to log the enforcement actions used to restrict access associated with changes.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233190
  ruleId: SV-233190r961470_rule
  ruleVersion: SRG-APP-000383-CTR-000910
  groupTitle: SRG-APP-000383
  ruleTitle: All non-essential, unnecessary, and unsecure DoD ports, protocols, and services must be disabled in the container platform.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001762
  legacyIds: []
  discussion: |-
    To properly offer services to the user and to orchestrate containers, the container platform may offer services that use ports and protocols that best fit those services. The container platform, when offering the services, must only offer the services on ports and protocols authorized by the DoD.

    To validate that the services are using only the approved ports and protocols, the organization must perform a periodic scan/review of the container platform and disable functions, ports, protocols, and services deemed to be unneeded or non-secure.
  checkContent: |-
    Review the container platform configuration to determine if services or capabilities presently on the information system are required for operational or mission needs.

    If additional services or capabilities are present on the system, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to only utilize secure ports and protocols required for operation that have been accepted for use as per the Ports, Protocols, and Services Category Assignments List (CAL) from DISA (PPSM).
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233191
  ruleId: SV-233191r961473_rule
  ruleVersion: SRG-APP-000384-CTR-000915
  groupTitle: SRG-APP-000384
  ruleTitle: The container platform must prevent component execution in accordance with organization-defined policies regarding software program usage and restrictions, and/or rules authorizing the terms and conditions of software program usage.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001764
  legacyIds: []
  discussion: The container platform may offer components such as DNS services, firewall services, router services, or web services that are not required by every organization to meet their needs. Container platform components may also add capabilities that run counter to the mission or that provide users with functionality that exceeds mission requirements. To meet the requirements of an organization, the container platform must have a method to remove or disable components not required to meet the organization's mission.
  checkContent: |-
    Review documentation and configuration setting to determine if policies, rules, or restrictions exist regarding usage of container platform components.

    If no such no restrictions are in place, this is not a finding.

    Identify any components the organization requires to be disabled or removed and configure the container platform according to that policy.

    If the container platform components are not disabled or removed according to the organization's policy, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform so that any platform components that are not required in order to meet the organization's mission are disabled or removed. Document the components that must be disabled or removed for reference.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233192
  ruleId: SV-233192r961479_rule
  ruleVersion: SRG-APP-000386-CTR-000920
  groupTitle: SRG-APP-000386
  ruleTitle: The container platform registry must employ a deny-all, permit-by-exception (whitelist) policy to allow only authorized container images in the container platform.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001774
  legacyIds: []
  discussion: |-
    Controlling the sources where container images can be pulled from allows the organization to define what software can be run within the container platform. Allowing any container image to be introduced and instantiated within the container platform may introduce malicious code and vulnerabilities to the platform and the hosting system.

    The container platform registry must deny all container images except for those signed by organizational-approved sources.
  checkContent: |-
    Review documentation and configuration settings to identify if the container platform whitelisting specifies which container platform components are allowed to execute.

    Check for the existence of policy settings or policy files that can be configured to restrict container platform component execution. Demonstrate how the program execution is restricted. Look for a deny-all, permit-by-exception policy of restriction.

    Some methods for restricting execution include but are not limited to the use of custom capabilities built into the application or Software Restriction Policies, Application Security Manager, or Role-Based Access Controls (RBAC).

    If container platform whitelisting is not utilized or does not follow a deny-all, permit-by-exception (whitelist) policy, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to utilize a deny-all, permit-by-exception policy when allowing the execution of authorized software.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233193
  ruleId: SV-233193r1050787_rule
  ruleVersion: SRG-APP-000389-CTR-000925
  groupTitle: SRG-APP-000389
  ruleTitle: The container platform must require users to reauthenticate when organization-defined circumstances or situations require reauthentication.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002038
  legacyIds: []
  discussion: |-
    Controlling user access is paramount in securing the container platform. During a user's access to the container platform, events may occur that change the user's access and which require reauthentication. For instance, if the capability to change security roles or escalate privileges is implemented, it is critical the user reauthenticate.

    In addition to the reauthentication requirements associated with change in security roles or privilege escalation, organizations may require reauthentication of individuals in other situations, including (but not limited to) the following circumstances:

    (i) When authenticators change;
    (ii) When roles change;
    (iii) When security categories of information systems change;
    (iv) When the execution of privileged functions occurs;
    (v) After a fixed period of time; or
    (vi) Periodically.

    Within the DOD, the minimum circumstances requiring reauthentication are privilege escalation and role changes.
  checkContent: |-
    Review documentation and configuration to determine if the container platform requires a user to reauthenticate when organization-defined circumstances or situations are met.

    If the container platform does not meet this requirement, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to require a user to reauthenticate when organization-defined circumstances or situations are met.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233195
  ruleId: SV-233195r961494_rule
  ruleVersion: SRG-APP-000391-CTR-000935
  groupTitle: SRG-APP-000391
  ruleTitle: The container platform must be configured to use multi-factor authentication for user authentication.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001953
  legacyIds: []
  discussion: |-
    Controlling access to the container platform and its components is paramount in having a secure and stable system. Validating users is the first step in controlling the access. Users may be validated by the overall container platform or they may be validated by each component. To standardize and reduce the risks of unauthorized access, the use of multifactor token-based credentials is the preferred method.

    DoD has mandated the use of the CAC to support identity management and personal authentication for systems covered under HSPD 12, as well as a primary component of layered protection for national security systems.
  checkContent: |-
    Review documentation and configuration to ensure the container platform is configured to use an approved DoD multifactor token (CAC) when accessing platform via user interfaces.

    If multifactor authentication is not configured, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to accept standard DoD multifactor token-based credentials when users interface with the platform.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233200
  ruleId: SV-233200r961521_rule
  ruleVersion: SRG-APP-000400-CTR-000960
  groupTitle: SRG-APP-000400
  ruleTitle: The container platform must prohibit the use of cached authenticators after an organization-defined time period.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002007
  legacyIds: []
  discussion: If cached authentication information is out of date, the validity of the authentication information may be questionable.
  checkContent: |-
    Review the container platform configuration to determine if the platform is configured to prohibit the use of cached authenticators after an organization-defined time period.

    If the container platform is not configured to prohibit the use of cached authenticators after an organization-defined time period, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to prohibit the use of cached authenticators after an organization-defined time period.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233201
  ruleId: SV-233201r981893_rule
  ruleVersion: SRG-APP-000401-CTR-000965
  groupTitle: SRG-APP-000401
  ruleTitle: The container platform, for PKI-based authentication, must implement a local cache of revocation data to support path discovery and validation in case of the inability to access revocation information via the network.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-004068
  legacyIds: []
  discussion: The potential of allowing access to users who are no longer authorized  (have revoked certificates) increases unless a local cache of revocation data is configured.
  checkContent: |-
    Review the container platform configuration.

     If the container platform is not implemented to use a local cache of revocation data to support path discovery and validation in case of the inability to access revocation information via the network, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to implement a local cache of revocation data to support path discovery and validation in case of the inability to access revocation information via the network.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233202
  ruleId: SV-233202r961527_rule
  ruleVersion: SRG-APP-000402-CTR-000970
  groupTitle: SRG-APP-000402
  ruleTitle: The container platform must accept Personal Identity Verification (PIV) credentials from other federal agencies.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002009
  legacyIds: []
  discussion: |-
    Controlling access to the container platform and its components is paramount in having a secure and stable system. Validating users is the first step in controlling the access. Users may be validated by the overall container platform or they may be validated by each component. It is essential to accept PIV credentials from other federal agencies and eliminate the possibility of access being denied to authorized users.

    PIV credentials are those credentials issued by federal agencies that conform to FIPS Publication 201 and supporting guidance documents. OMB Memorandum 11-11 requires federal agencies to continue implementing the requirements specified in HSPD-12 to enable agency-wide use of PIV credentials.
  checkContent: |-
    Review the documentation and configuration to determine if the container platform accepts PIV credentials from other federal agencies.

    If the container platform does not accept other federal agency PIV credentials, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to accept PIV credentials from other federal agencies.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233206
  ruleId: SV-233206r961548_rule
  ruleVersion: SRG-APP-000409-CTR-000990
  groupTitle: SRG-APP-000409
  ruleTitle: The container platform must audit non-local maintenance and diagnostic sessions' organization-defined audit events associated with non-local maintenance.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002884
  legacyIds: []
  discussion: To fully investigate an attack, it is important to understand the event and those events taking place during the same time period. Often, non-local administrative access and diagnostic sessions are not logged. These events are seen as only administrative functions and not worthy of being audited, but these events are important in any investigation and are a major tool for assessing and investigating attacks.
  checkContent: |-
    Review the container platform to verify if the platform is auditing non-local maintenance and diagnostic sessions' organization-defined audit events.

    If the container platform is not auditing non-local maintenance and diagnostic sessions' organization-defined audit events, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to audit non-local maintenance and diagnostic sessions' organization-defined audit events.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233207
  ruleId: SV-233207r961554_rule
  ruleVersion: SRG-APP-000411-CTR-000995
  groupTitle: SRG-APP-000411
  ruleTitle: Container platform applications and Application Program Interfaces (API) used for nonlocal maintenance sessions must use FIPS-validated keyed-hash message authentication code (HMAC) to protect the integrity of nonlocal maintenance and diagnostic communications.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002890
  legacyIds: []
  discussion: |-
    Unapproved mechanisms that are used for authentication to the cryptographic module are not verified, and therefore cannot be relied on to provide confidentiality or integrity, and DoD data may be compromised.

    Nonlocal maintenance and diagnostic activities are activities conducted by individuals communicating through either an external network (e.g., the internet) or an internal network.

    Currently, HMAC is the only FIPS-approved algorithm for generating and verifying message/data authentication codes in accordance with FIPS 198-1. Products that are FIPS 140-2 validated will have an HMAC that meets specification; however, the option must be configured for use as the only message authentication code used for authentication to cryptographic modules.

    Separate requirements for configuring applications and protocols used by each product (e.g., SNMPv3, SSHv2, NTP, and other protocols and applications that require server/client authentication) are required to implement this requirement. The SSHv2 protocol suite must be mandated in the product because it includes layer 7 protocols such as SCP and SFTP that can be used for secure file transfers.
  checkContent: |-
    Validate that container platform applications and APIs used for nonlocal maintenance sessions are using FIPS-validated HMAC to protect the integrity of nonlocal maintenance and diagnostic communications.

    If the sessions are not using FIPS-validated HMAC, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform applications and APIs used for nonlocal maintenance sessions to use FIPS-validated HMAC to protect the integrity of nonlocal maintenance and diagnostic communications.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233208
  ruleId: SV-233208r961557_rule
  ruleVersion: SRG-APP-000412-CTR-001000
  groupTitle: SRG-APP-000412
  ruleTitle: The container platform must configure web management tools and Application Program Interfaces (API) with FIPS-validated Advanced Encryption Standard (AES) cipher block algorithm to protect the confidentiality of maintenance and diagnostic communications for nonlocal maintenance sessions.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-003123
  legacyIds: []
  discussion: |-
    Without confidentiality protection mechanisms, unauthorized individuals may gain access to sensitive information via a remote access session.

    Nonlocal maintenance and diagnostic activities are activities conducted by individuals communicating through either an external network (e.g., the internet) or an internal network.
  checkContent: |-
    Validate the container platform web management tools and Application Program Interfaces (API) are configured to use FIPS-validated Advanced Encryption Standard (AES) cipher block algorithms to protect the confidentiality of maintenance and diagnostic communications for nonlocal maintenance sessions.

    If the web management tools and API are not configured to use FIPS-validated Advanced Encryption Standard (AES) cipher block algorithms, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform web management tools and Application Program Interfaces (API) with FIPS-validated Advanced Encryption Standard (AES) cipher block algorithm to protect the confidentiality of maintenance and diagnostic communications for nonlocal maintenance sessions.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233210
  ruleId: SV-233210r961563_rule
  ruleVersion: SRG-APP-000414-CTR-001010
  groupTitle: SRG-APP-000414
  ruleTitle: Vulnerability scanning applications must implement privileged access authorization to all container platform components, containers, and container images for selected organization-defined vulnerability scanning activities.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001067
  legacyIds: []
  discussion: |-
    In certain situations, the nature of the vulnerability scanning may be more intrusive, or the container platform component that is the subject of the scanning may contain highly sensitive information. Privileged access authorization to selected system components facilitates more thorough vulnerability scanning and protects the sensitive nature of such scanning.

    The vulnerability scanning application must utilize privileged access authorization for the scanning account.
  checkContent: |-
    Validate that scanning applications have privileged access to container platform components, containers, and container images to properly perform vulnerability scans.

    If privileged access is not given to the scanning application, this is a finding.
  checkContentRef: M
  fixText: Configure the vulnerability scanning application to have privileged access to the container platform components, containers, and container images.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233211
  ruleId: SV-233211r961863_rule
  ruleVersion: SRG-APP-000416-CTR-001015
  groupTitle: SRG-APP-000516
  ruleTitle: The container platform must implement NSA-approved cryptography to protect classified information in accordance with applicable federal laws, Executive Orders, directives, policies, regulations, and standards.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002450
  legacyIds: []
  discussion: Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect data and images. The container platform must implement cryptographic modules adhering to the higher standards approved by the federal government since this provides assurance they have been tested and validated.
  checkContent: |-
    Review documentation to verify that the container platform is using NSA-approved cryptography to protect classified data and applications.

    If the container platform is not using NSA-approved cryptography for classified data and applications, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to utilize NSA-approved cryptography to protect classified information.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233220
  ruleId: SV-233220r1050650_rule
  ruleVersion: SRG-APP-000429-CTR-001060
  groupTitle: SRG-APP-000429
  ruleTitle: The container platform keystore must implement encryption to prevent unauthorized disclosure of information at rest within the container platform.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-002476
  legacyIds: []
  discussion: Container platform keystore is used for container deployments for persistent storage of all its REST API objects. These objects are sensitive in nature and should be encrypted at rest to avoid any unauthorized disclosure. Selection of a cryptographic mechanism is based on the need to protect the confidentiality of organizational information. The strength of mechanism is commensurate with the security category and/or classification of the information.
  checkContent: |-
    Review container platform keystore documentation and configuration to verify encryption levels meet the information sensitivity level.

    If the container platform keystore encryption configuration does not meet system requirements, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform keystore encryption to maintain the confidentiality and integrity of information for applicable sensitivity level.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233221
  ruleId: SV-233221r1137646_rule
  ruleVersion: SRG-APP-000431-CTR-001065
  groupTitle: SRG-APP-000431
  ruleTitle: The container platform runtime must maintain separate execution domains for each container by assigning each container a separate address space.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002530
  legacyIds: []
  discussion: |-
    Container namespace access is limited upon runtime execution. Each container is a distinct process so that communication between containers is performed in a manner controlled through security policies that limits the communication so one container cannot modify another container. Different groups of containers with different security needs should be deployed in separate namespaces as a first level of isolation.

    Namespaces are a key boundary for network policies, orchestrator access control restrictions, and other important security controls. Separating workloads into namespaces can help contain attacks and limit the impact of mistakes or destructive actions by authorized users.

    This requirement also applies to Zero Trust initiatives.
  checkContent: |-
    Review container platform runtime documentation and configuration is maintaining a separate execution domain for each executing process. Different groups of applications, and services with different security needs, should be deployed in separate namespaces as a first level of isolation.

    If container platform runtime is not configured to execute processes in separate domains and namespaces, this is a finding.

    If namespaces use defaults, this is a finding.
  checkContentRef: M
  fixText: Deploy a container platform runtime capable of maintaining a separate execution domain and namespace for each executing process. Create a namespace for each containers, defining them as logical groups.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233222
  ruleId: SV-233222r961620_rule
  ruleVersion: SRG-APP-000435-CTR-001070
  groupTitle: SRG-APP-000435
  ruleTitle: The container platform must protect against or limit the effects of all types of denial-of-service (DoS) attacks by employing organization-defined security safeguards.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002385
  legacyIds: []
  discussion: |-
    DoS is a condition when a resource is not available for legitimate users. When this occurs, the organization either cannot accomplish its mission or must operate at degraded capacity.

    This requirement addresses the configuration of the container platform to mitigate the impact of DoS attacks that have occurred. For each container platform component, known and potential DoS attacks must be identified and solutions for each type implemented. A variety of technologies exist to limit or, in some cases, eliminate the effects of DoS attacks (e.g., limiting runtime processes or restricting the number of sessions the container platform runtime open, limiting container resources to memory and CPU).

    Processes are an important indicator of security-and operations-relevant container activity. Process names and their arguments provide important visibility into a container’s activity. If an image includes non-default aliases or renamed binaries, attackers will still attempt to use well-known names.

    The same malicious or unwanted activity might affect multiple deployments across different applications or environments. Staff investigating a potential incident need to find those exposures quickly.
  checkContent: |-
    Review documentation and configuration to determine if the container platform can protect against or limit the effects of all types of DoS attacks by employing defined security safeguards against resource depletion. Examples of resource limits are on memory, storage, and CPU.

    If the container platform cannot be configured to protect against or limit the effects of all types of DoS, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to protect against or limit the effects of all types of DoS attacks by employing defined security safeguards. Safeguards such as resource limits on memory, storage, and CPU can be used.
  verified: true
  evaluation:
    method: posture
    checks:
    - no-resource-limits
    onFail: Open
    onPass: Not_Reviewed
    note: Resource limits are one DoS control; rate limiting and quotas are not evaluated.
- benchmark: container-platform-srg
  vulnId: V-233224
  ruleId: SV-233224r961632_rule
  ruleVersion: SRG-APP-000439-CTR-001080
  groupTitle: SRG-APP-000439
  ruleTitle: The application must protect the confidentiality and integrity of transmitted information.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-002418
  legacyIds: []
  discussion: |-
    Without protection of the transmitted information, confidentiality and integrity may be compromised since unprotected communications can be intercepted and either read or altered.

    This requirement applies only to those applications that either are distributed or can allow access to data non-locally. Use of this requirement will be limited to situations where the data owner has a strict requirement for ensuring data integrity and confidentiality is maintained at every step of the data transfer and handling process. When transmitting data, applications need to leverage transmission protection mechanisms, such as TLS, TLS VPNs, or IPsec.

    Communication paths outside the physical protection of a controlled boundary are exposed to the possibility of interception and modification. Protecting the confidentiality and integrity of organizational information can be accomplished by physical means (e.g., employing physical distribution systems) or by logical means (e.g., employing cryptographic techniques). If physical means of protection are employed, then logical means (cryptography) do not have to be employed, and vice versa.
  checkContent: |-
    Review container platform configuration to determine if it is using a transmission method that maintains the confidentiality and integrity of information during transmission.

    If a transmission method is not being used that maintains the confidentiality and integrity of the data, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to utilize a transmission method that maintains the confidentiality and integrity of information during transmission.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233226
  ruleId: SV-233226r961638_rule
  ruleVersion: SRG-APP-000441-CTR-001090
  groupTitle: SRG-APP-000441
  ruleTitle: The container platform must maintain the confidentiality and integrity of information during preparation for transmission.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002420
  legacyIds: []
  discussion: Information may be unintentionally or maliciously disclosed or modified during preparation for transmission within the container platform during aggregation, at protocol transformation points, and during container image runtime. These unauthorized disclosures or modifications compromise the confidentiality or integrity of the information. When transmitting data, the container platform components need to leverage transmission protection mechanisms, such as TLS, TLS VPNs, or IPsec.
  checkContent: |-
    Review the documentation and deployed configuration to determine if the container platform maintains the confidentiality and integrity of information during preparation before transmission.

    If the confidentiality and integrity are not maintained using mechanisms such as TLS, TLS VPNs, or IPsec during preparation before transmission, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to maintain the confidentiality and integrity of information using mechanisms such as TLS, TLS VPNs, or IPsec during preparation for transmission.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233227
  ruleId: SV-233227r961641_rule
  ruleVersion: SRG-APP-000442-CTR-001095
  groupTitle: SRG-APP-000442
  ruleTitle: The container platform must maintain the confidentiality and integrity of information during reception.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002422
  legacyIds: []
  discussion: Information either can be unintentionally or maliciously disclosed or modified during reception for reception within the container platform during aggregation, at protocol transformation points, and during container image runtime. These unauthorized disclosures or modifications compromise the confidentiality or integrity of the information. When receiving data, the container platform components need to leverage protection mechanisms, such as TLS, TLS VPNs, or IPsec.
  checkContent: |-
    Review documentation and configuration settings to determine if the container platform maintains the confidentiality and integrity of information during reception.

    If confidentiality and integrity are not maintained using mechanisms such as TLS, TLS VPNs, or IPsec during reception, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to maintain the confidentiality and integrity using mechanisms such as TLS, TLS VPNs, or IPsec during reception.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233228
  ruleId: SV-233228r961656_rule
  ruleVersion: SRG-APP-000447-CTR-001100
  groupTitle: SRG-APP-000447
  ruleTitle: The container platform must behave in a predictable and documented manner that reflects organizational and system objectives when invalid inputs are received.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002754
  legacyIds: []
  discussion: |-
    Software or code parameters typically follow well-defined protocols that use structured messages (i.e., commands or queries) to communicate between software modules or system components. Structured messages can contain raw or unstructured data interspersed with metadata or control information. If attacker-supplied inputs to construct structured messages without properly encoding such messages, then the attacker could insert malicious commands or special characters that can cause the data to be interpreted as control information or metadata.

    This requirement guards against adverse or unintended system behavior caused by invalid inputs, where container platform components responses to the invalid input may be disruptive or cause the container image runtime to fail into an unsafe state.

    The behavior will be derived from the organizational and system requirements and includes, but is not limited to, notification of the appropriate personnel, creating an audit record, and rejecting invalid input.
  checkContent: |-
    Review the configuration to determine if the container platform behaves in a predictable and documented manner that reflects organizational and system objectives when invalid inputs are received.

    If the container platform does not meet this requirement, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform behave in a predictable and documented manner that reflects organizational and system objectives when invalid inputs are received.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233229
  ruleId: SV-233229r961665_rule
  ruleVersion: SRG-APP-000450-CTR-001105
  groupTitle: SRG-APP-000450
  ruleTitle: The container platform must implement organization-defined security safeguards to protect system CPU and memory from resource depletion and unauthorized code execution.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002824
  legacyIds: []
  discussion: |-
    The execution of images within the container platform runtime must implement organizational defined security safeguards to prevent distributed denial-of-service (DDOS) and other possible attacks against the container image at runtime.

    Security safeguards employed to protect memory and CPU include, for example, data execution prevention and address space layout randomization. Data execution prevention safeguards can be software-enforced. Other means of protection are to limit memory and CPU resources to a container.
  checkContent: |-
    Review the container platform configuration to determine if safeguards are in place to protect the system memory and CPU from resource depletion and unauthorized execution.

    If safeguards are not in place, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to have safeguards in place to protect the system memory and CPU from resource depletion and unauthorized code execution.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233230
  ruleId: SV-233230r961677_rule
  ruleVersion: SRG-APP-000454-CTR-001110
  groupTitle: SRG-APP-000454
  ruleTitle: The container platform must remove old components after updated versions have been installed.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002617
  legacyIds: []
  discussion: Previous versions of container platform components that are not removed from the container platform after updates have been installed may be exploited by adversaries by causing older components to execute which contain vulnerabilities. When these components are deleted, the likelihood of this happening is removed.
  checkContent: |-
    Review container platform registry documentation and configuration to determine if organization-defined images contains latest approved vendor software image version.

    If organization-defined images do not contain the latest approved vendor software image version, this is a finding.

    Review container platform registry documentation and configuration to determine if organization-defined images are removed after updated versions have been installed.

    If organization-defined images are not removed after updated versions have been installed, this is a finding.

    Review container platform runtime documentation and configuration to determine if organization-define images are executing latest image version from the container platform registry.

    If container platform runtime is not executing latest organization-defined images from the container platform registry, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform registry to update organization-defined images with current approved vendor version and remove obsolete images after updated versions have been installed. Configure the container platform runtime to execute latest organization-defined images from the container platform registry.
  verified: true
  evaluation:
    method: none
