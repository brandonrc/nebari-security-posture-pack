  vulnId: V-233271
  ruleId: SV-233271r1137647_rule
  ruleVersion: SRG-APP-000514-CTR-001315
  groupTitle: SRG-APP-000514
  ruleTitle: The container platform must use a valid FIPS 140-2 or FIPS 140-3 approved cryptographic module to generate hashes.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002450
  legacyIds: []
  discussion: |-
    The cryptographic module used must have at least one validated hash algorithm. This validated hash algorithm must be used to generate cryptographic hashes for all cryptographic security function within the container platform components being evaluated.

    FIPS 140-2/140-3 precludes the use of invalidated cryptography for the cryptographic protection of sensitive or valuable data within federal systems. Unvalidated cryptography is viewed by NIST as providing no protection to the information or data. In effect, the data would be considered unprotected plaintext. If the agency specifies that the information or data be cryptographically protected, then FIPS 140-2/140-3 is applicable. In essence, if cryptography is required, it must be validated. Cryptographic modules that have been approved for classified use may be used in lieu of modules that have been validated against the FIPS 140-2/140-3 standard.

    This requirement also applies to Zero Trust initiatives.
  checkContent: |-
    Review the container platform configuration to validate that valid FIPS 140-2/140-3 approved cryptographic modules are being used to generate hashes.

    If non-valid or unapproved FIPS 140-2/140-3 cryptographic modules are being used to generate hashes, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to use valid FIPS 140-2/140-3 approved cryptographic modules to generate hashes.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233273
  ruleId: SV-233273r961863_rule
  ruleVersion: SRG-APP-000516-CTR-001325
  groupTitle: SRG-APP-000516
  ruleTitle: Container platform components must be configured in accordance with the security configuration settings based on DoD security configuration or implementation guidance, including SRGs, STIGs, NSA configuration guides, CTOs, and DTMs.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000366
  legacyIds: []
  discussion: Container platform components are part of the overall container platform, offering services that enable the container platform to fully orchestrate user containers. These components may fall outside the scope of this document, but they still must be secured. Examples of such components are DNS, routers, and firewalls. These and any other services offered by the container platform must follow the appropriate STIG or SRG for the technology offered. If a STIG or SRG is not available for the technology, then best practices for the technology must be used. For example, the Cloud Native Computing Foundation (CNCF) is an open-source organization that is working on container platform best practices.
  checkContent: |-
    Review the container platform configuration to determine the services offered by the container platform and validate that any services that are offered are configured in accordance with the security configuration settings based on DoD security configuration or implementation guidance, including SRGs, STIGs, NSA configuration guides, CTOs, and DTMs.

    If container platform services are not configured in accordance with the security configuration settings based on DoD security configuration or implementation guidance, including SRGs, STIGs, NSA configuration guides, CTOs, and DTMs, this is a finding.
  checkContentRef: M
  fixText: Configure container services in accordance with the security configuration settings based on DoD security configuration or implementation guidance, including SRGs, STIGs, NSA configuration guides, CTOs, and DTMs.
  verified: true
  evaluation:
    method: posture
    checks:
    - privileged
    - host-namespaces
    - host-path
    - run-as-root
    - privilege-escalation
    - added-capabilities
    - capabilities-not-dropped
    - writable-rootfs
    - no-resource-limits
    - no-resource-requests
    - mutable-tag
    - no-liveness-probe
    - no-readiness-probe
    - automount-sa-token
    - seccomp-unconfined
    - no-netpol
    aggregate: true
    onFail: Open
    onPass: Not_Reviewed
    note: Aggregates every workload posture check; host and control-plane configuration is not evaluated.
