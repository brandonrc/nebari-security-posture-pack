  vulnId: V-242409
  ruleId: SV-242409r960963_rule
  ruleVersion: CNTR-K8-000910
  groupTitle: SRG-APP-000141-CTR-000315
  ruleTitle: Kubernetes Controller Manager must disable profiling.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000381
