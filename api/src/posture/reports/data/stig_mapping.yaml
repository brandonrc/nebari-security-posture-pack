  vulnId: V-233031
  ruleId: SV-233031r960840_rule
  ruleVersion: SRG-APP-000065-CTR-000115
  groupTitle: SRG-APP-000065
  ruleTitle: The container platform must enforce the limit of three consecutive invalid logon attempts by a user during a 15-minute time period.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000044
  legacyIds: []
  discussion: By limiting the number of failed login attempts, the risk of unauthorized system access via user password guessing, otherwise known as brute forcing, is reduced. Limits are imposed by locking the account.
  checkContent: |-
    Review the container platform to determine if it is configured to enforce the limit of three consecutive invalid logon attempts by a user during a 15-minute time period.

    If the container platform is not configured to enforce the limit of three consecutive invalid logon attempts by a user during a 15-minute time period, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to enforce the limit of three consecutive invalid logon attempts by a user during a 15-minute time period.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233032
  ruleId: SV-233032r960843_rule
  ruleVersion: SRG-APP-000068-CTR-000120
  groupTitle: SRG-APP-000068
  ruleTitle: The container platform must display the Standard Mandatory DoD Notice and Consent Banner before granting access to platform components.
  severity: low
  cat: III
  weight: '10.0'
  ccis:
  - CCI-000048
  legacyIds: []
  discussion: The container platform has countless components where different access levels are needed. To control access, the user must first log in to the component and then be presented with a DoD-approved use notification banner before granting access to the component. This guarantees privacy and security notification verbiage used is consistent with applicable federal laws, Executive Orders, directives, policies, regulations, standards, and guidance.
  checkContent: |-
    Review the container platform configuration to determine if the Standard Mandatory DoD Notice and Consent Banner is configured to be displayed before granting access to platform components.

    Log in to the container platform components and verify that the Standard Mandatory DoD  Notice and Consent Banner is being displayed before granting access.

    If the Standard Mandatory DoD Notice and Consent Banner is not configured or is not displayed before granting access to container platform components, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to display the Standard Mandatory DoD Notice and Consent Banner before granting access to container platform components.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233033
  ruleId: SV-233033r960846_rule
  ruleVersion: SRG-APP-000069-CTR-000125
  groupTitle: SRG-APP-000069
  ruleTitle: The container platform must retain the Standard Mandatory DoD Notice and Consent Banner on the screen until users acknowledge the usage and conditions and take explicit actions to log on for further access.
  severity: low
  cat: III
  weight: '10.0'
  ccis:
  - CCI-000050
  legacyIds: []
  discussion: |-
    The banner must be acknowledged by the user prior to allowing the user access to any container platform component. This provides assurance that the user has seen the message and accepted the conditions for access. If the consent banner is not acknowledged by the user, DoD will not be in compliance with system use notifications required by law.

    To establish acceptance of the application usage policy, a click-through banner at application logon is required. The application must prevent further activity until the user executes a positive action to manifest agreement by clicking on a box indicating "OK".
  checkContent: |-
    Log in to the container platform components to determine if the Standard Mandatory DoD Notice and Consent Banner remains on the screen until users acknowledge the usage and conditions and take explicit actions to log on for further access.

    If the Standard Mandatory DoD Notice and Consent Banner does not stay on the screen until the users acknowledge the usage and conditions, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to retain the Standard Mandatory DoD Notice and Consent Banner on the screen until users acknowledge the usage and conditions and take explicit actions to log on for further access.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233038
  ruleId: SV-233038r960879_rule
  ruleVersion: SRG-APP-000089-CTR-000150
  groupTitle: SRG-APP-000089
  ruleTitle: The container platform must generate audit records for all DoD-defined auditable events within all components in the platform.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000169
  legacyIds: []
  discussion: Within the container platform, audit data can be generated from any of the deployed container platform components. This audit data is important when there are issues, including security incidents that must be investigated. To make the audit data worthwhile for the investigation of events, it is necessary to have the appropriate and required data logged. To handle the need to log DoD-defined auditable events, the container platform must offer a mechanism to change and manage the events that are audited.
  checkContent: |-
    Review the container platform configuration to determine if the container platform is configured to generate audit records for all DoD-defined auditable events within all components in the platform.

    Generate DoD-defined auditable events within all the components to determine if the events are being audited.

    If the container platform is not configured to generate audit records for all DoD-defined auditable events within the components or the events are  not generating audit records, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to generate audit records for all DoD-defined auditable events within all the components of the container platform.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233039
  ruleId: SV-233039r960882_rule
  ruleVersion: SRG-APP-000090-CTR-000155
  groupTitle: SRG-APP-000090
  ruleTitle: The container platform must allow only the ISSM (or individuals or roles appointed by the ISSM) to select which auditable events are to be audited.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000171
  legacyIds: []
  discussion: |-
    Without the capability to restrict which roles and individuals can select which events are audited, unauthorized personnel may be able to prevent the auditing of critical events. Misconfigured audits may degrade the system's performance by overwhelming the audit log. Misconfigured audits may also make it more difficult to establish, correlate, and investigate the events relating to an incident, or identify those responsible for one.

    The list of audited events is the set of events for which audits are to be generated. This set of events is typically a subset of the list of all events for which the system is capable of generating audit records.
  checkContent: |-
    Review the container platform to determine if the container platform is configured to allow only the ISSM (or individuals or roles appointed by the ISSM) to select which auditable events are to be audited.

    If the container platform is not configured to only allow the ISSM (or individuals or roles appointed by the ISSM) to select which auditable events are to be audited, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to only allow the ISSM (or individuals or roles appointed by the ISSM) to select which auditable events are to be audited.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233040
  ruleId: SV-233040r960885_rule
  ruleVersion: SRG-APP-000091-CTR-000160
  groupTitle: SRG-APP-000091
  ruleTitle: The container platform must generate audit records when successful/unsuccessful attempts to access privileges occur.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000172
  legacyIds: []
  discussion: |-
    Without generating audit records that are specific to the security and mission needs of the organization, it would be difficult to establish, correlate, and investigate the events relating to an incident, or identify those responsible for one.

    Audit records can be generated from various components within the information system (e.g., module or policy filter).
  checkContent: |-
    Review the container platform configuration to determine if it is configured to generate audit records when successful/unsuccessful attempts are made to access privileges.

    If the container platform is not configured to generate audit records on successful/unsuccessful access to privileges, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to generate audit records when successful/unsuccessful attempts are made to access privileges occur.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233041
  ruleId: SV-233041r960888_rule
  ruleVersion: SRG-APP-000092-CTR-000165
  groupTitle: SRG-APP-000092
  ruleTitle: The container platform must initiate session auditing upon startup.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001464
  legacyIds: []
  discussion: When the container platform is started, container platform components and user services can also be started. It is important that the container platform begin auditing on startup in order to handle container platform startup events along with events for container platform components and services that begin on startup.
  checkContent: |-
    Review the container platform configuration for session audits.

    Ensure audit policy for session logging at startup is enabled.

    Verify events are written to the log.

    Validate system documentation is current.

    If the container platform is not configured to meet this requirement, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to generate audit logs for session logging at startup. Revise all applicable system documentation.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233042
  ruleId: SV-233042r960891_rule
  ruleVersion: SRG-APP-000095-CTR-000170
  groupTitle: SRG-APP-000095
  ruleTitle: All audit records must identify what type of event has occurred within the container platform.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000130
  legacyIds: []
  discussion: Within the container platform, audit data can be generated from any of the deployed container platform components. This audit data is important when there are issues, such as security incidents, that must be investigated. To make the audit data worthwhile for the investigation of events, it is necessary to know what type of event occurred.
  checkContent: |-
    Review the container platform configuration for audit event types. Ensure audit policy for event type is enabled.

    Verify records showing what type of event occurred are written to the log.

    Validate system documentation is current.

    If log data does not show the type of event, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to include the event type in the log data. Revise all applicable system documentation.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233043
  ruleId: SV-233043r960894_rule
  ruleVersion: SRG-APP-000096-CTR-000175
  groupTitle: SRG-APP-000096
  ruleTitle: The container platform audit records must have a date and time association with all events.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000131
  legacyIds: []
  discussion: Within the container platform, audit data can be generated from any of the deployed container platform components. This audit data is important when there are issues, such as security incidents, that must be investigated. To make the audit data worthwhile for the investigation of events, it is necessary to know when the event occurred. To establish the time of the event, the audit record must contain the date and time.
  checkContent: |-
    Review the container platform configuration for audit events date and time.

    Ensure audit policy for event date and time are enabled.

    Verify records showing event date and time are included in the log.

    Validate system documentation is current.

    If the date and time are not included, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to include log date and time with the event. Revise all applicable system documentation.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233044
  ruleId: SV-233044r960897_rule
  ruleVersion: SRG-APP-000097-CTR-000180
  groupTitle: SRG-APP-000097
  ruleTitle: All audit records must identify where in the container platform the event occurred.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000132
  legacyIds: []
  discussion: Within the container platform, audit data can be generated from any of the deployed container platform components. This audit data is important when there are issues, such as security incidents, that must be investigated. To make the audit data worthwhile for the investigation of events, it is necessary to know where within the container platform the event occurred.
  checkContent: |-
    Review the container platform configuration to determine if all audit records identify where in the container platform the event occurred.

    Generate audit records and view the audit records to verify that the records do identify where in the container platform the event occurred.

    If the container platform is not configured to generate audit records that identify where in the container platform the event occurred, or if the generated audit records do not identify where in the container platform the event occurred, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to generate audit records that identify where in the container platform the event occurred.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233045
  ruleId: SV-233045r960900_rule
  ruleVersion: SRG-APP-000098-CTR-000185
  groupTitle: SRG-APP-000098
  ruleTitle: All audit records must identify the source of the event within the container platform.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000133
  legacyIds: []
  discussion: Audit data is important when there are issues, to include security incidents that must be investigated. Since the audit data may be part of a larger audit system, it is important for the audit data to also include the container platform name for traceability back to the container platform itself and not just the container platform components.
  checkContent: |-
    Review container platform audit policy configuration for logons establishing the sources of events.

    Ensure audit policy is configured to generate sufficient information to resolve the source, e.g., source IP, of the log event.

    Verify records showing by requesting a user access the container platform and generate log events, and then review the logs to determine if the source of the event can be established.

    If the source of the event cannot be determined, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform registry, keystore, and runtime to generate the source of each loggable event. Revise all applicable system documentation.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233046
  ruleId: SV-233046r960903_rule
  ruleVersion: SRG-APP-000099-CTR-000190
  groupTitle: SRG-APP-000099
  ruleTitle: All audit records must generate the event results within the container platform.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000134
  legacyIds: []
  discussion: Within the container platform, audit data can be generated from any of the deployed container platform components. This audit data is important when there are issues, such as security incidents, that must be investigated. To make the audit data worthwhile for the investigation of events, it is necessary to know the outcome of the event.
  checkContent: |-
    Review the container platform configuration to determine if audit records contain the audit event results.

    Generate audit records and review the data to validate that the record does contain the event result.

    If the container platform is not configured to generate audit records with  the event result or the audit record does not contain the event result, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to generate audit records that contain the event result.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233047
  ruleId: SV-233047r960906_rule
  ruleVersion: SRG-APP-000100-CTR-000195
  groupTitle: SRG-APP-000100
  ruleTitle: All audit records must identify any users associated with the event within the container platform.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001487
  legacyIds: []
  discussion: Without information that establishes the identity of the user associated with the events, security personnel cannot determine responsibility for the potentially harmful event.
  checkContent: |-
    Review container platform documentation and the log files on the application server to determine if the logs contain information that establishes the identity of the user or process associated with log event data.

    If the container platform does not produce logs that establish the identity of the user or process associated with log event data, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform logging system to log the identity of the user or process related to the events.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233048
  ruleId: SV-233048r960906_rule
  ruleVersion: SRG-APP-000100-CTR-000200
  groupTitle: SRG-APP-000100
  ruleTitle: All audit records must identify any containers associated with the event within the container platform.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001487
  legacyIds: []
  discussion: Without information that establishes the identity of the containers offering user services or running on behalf of a user within the platform associated with audit events, security personnel cannot determine responsibility for potentially harmful events.
  checkContent: |-
    Review the container platform configuration to determine if it is configured to generate audit records that contain the component information that generated the audit record.

    Generate audit records and review the data to determine if records are generated containing the component information that generated the record.

    If the container platform is not configured to generate audit records containing the component information or records are generated that do not contain the component information that generated the record, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to include the component information that generated the audit record.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233049
  ruleId: SV-233049r960909_rule
  ruleVersion: SRG-APP-000101-CTR-000205
  groupTitle: SRG-APP-000101
  ruleTitle: The container platform must generate audit records containing the full-text recording of privileged commands or the individual identities of group account users.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000135
  legacyIds: []
  discussion: During an investigation of an incident, it is important to fully understand what took place. Often, information is not part of the audited event due to the data's nature, security risk, or audit log size. Organizations must consider limiting the additional audit information to only that information explicitly needed for specific audit requirements. At a minimum, the organization must audit either full-text recording of privileged commands, or the individual identities of group users, or both.
  checkContent: |-
    Review the documentation and deployment configuration to determine if the container platform is configured to generate full-text recording of privileged commands or the individual identities of group users at a minimum.

    Have a user execute a privileged command and review the log data to validate that the full-text or identity of the individual is being logged.

    If the container platform is not meeting this requirement, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to generate the full-text recording of privileged commands, or the individual identities of group users, or both.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233052
  ruleId: SV-233052r960918_rule
  ruleVersion: SRG-APP-000111-CTR-000220
  groupTitle: SRG-APP-000111
  ruleTitle: The container platform components must provide the ability to send audit logs to a central enterprise repository for review and analysis.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000154
  legacyIds: []
  discussion: The container platform components must send audit events to a central managed audit log repository to provide reporting, analysis, and alert notification. Incident response relies on successful timely, accurate system analysis in order for the organization to identify and respond to possible security events.
  checkContent: |-
    Review the configuration settings to determine if the container platform components are configured to send audit events to central managed audit log repository.

    If the container platform is not configured to send audit events to central managed audit log repository, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform components to send audit logs to a central managed audit log repository.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233055
  ruleId: SV-233055r960927_rule
  ruleVersion: SRG-APP-000116-CTR-000235
  groupTitle: SRG-APP-000116
  ruleTitle: The container platform must use internal system clocks to generate audit record time stamps.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000159
  legacyIds: []
  discussion: Understanding when and sequence of events for an incident is crucial to understand what may have taken place. Without a common clock, the components generating audit events could be out of synchronization and would then present a picture of the event that is warped and corrupted. To give a clear picture, it is important that the container platform and its components use a common internal clock.
  checkContent: |-
    Review the container platform configuration files to determine if the internal system clock is used for time stamps.

    If the container platform does not use the internal system clock to generate time stamps, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to use internal system clocks to generate time stamps for log records.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233056
  ruleId: SV-233056r960930_rule
  ruleVersion: SRG-APP-000118-CTR-000240
  groupTitle: SRG-APP-000118
  ruleTitle: The container platform must protect audit information from any type of unauthorized read access.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000162
  legacyIds: []
  discussion: |-
    If audit data were to become compromised, then competent forensic analysis and discovery of the true source of potentially malicious system activity is difficult if not impossible to achieve. In addition, access to audit records provides information an attacker could potentially use to his or her advantage.

    To ensure the veracity of audit data, the information system and/or the application must protect audit information from any and all unauthorized access. This includes read, write, and copy access.

    This requirement can be achieved through multiple methods, which will depend upon system architecture and design. Commonly employed methods for protecting audit information include least privilege permissions as well as restricting the location and number of log file repositories.

    Additionally, applications with user interfaces to audit records should not allow for the unfettered manipulation of or access to those records via the application. If the application provides access to the audit data, the application becomes accountable for ensuring audit information is protected from unauthorized access.

    Audit information includes all information (e.g., audit records, audit settings, and audit reports) needed to successfully audit information system activity.
  checkContent: |-
    Review the container platform configuration to determine where audit information is stored.

    If the audit information is not protected from any type of unauthorized read access, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to protect the storage of audit information from unauthorized read access.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233057
  ruleId: SV-233057r960933_rule
  ruleVersion: SRG-APP-000119-CTR-000245
  groupTitle: SRG-APP-000119
  ruleTitle: The container platform must protect audit information from unauthorized modification.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000163
  legacyIds: []
  discussion: |-
    If audit data were to become compromised, then forensic analysis and discovery of the true source of potentially malicious system activity would be impossible to achieve.

    To ensure the veracity of audit data, the information system and/or the application must protect audit information from unauthorized modification.

    This requirement can be achieved through multiple methods, which will depend upon system architecture and design. Some commonly employed methods include ensuring log files receive the proper file system permissions and limiting log data locations.

    Applications providing a user interface to audit data will leverage user permissions and roles identifying the user accessing the data and the corresponding rights that the user enjoys in order to make access decisions regarding the modification of audit data.

    Audit information includes all information (e.g., audit records, audit settings, and audit reports) needed to successfully audit information system activity.
  checkContent: |-
    Review the container platform configuration to determine where audit information is stored.

    If the audit log data is not protected from unauthorized modification, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to protect the storage of audit information from unauthorized modification.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233058
  ruleId: SV-233058r960936_rule
  ruleVersion: SRG-APP-000120-CTR-000250
  groupTitle: SRG-APP-000120
  ruleTitle: The container platform must protect audit information from unauthorized deletion.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000164
  legacyIds: []
  discussion: |-
    If audit data were to become compromised, then forensic analysis and discovery of the true source of potentially malicious system activity would be impossible to achieve.

    To ensure the veracity of audit data, the information system and/or the application must protect audit information from unauthorized deletion. This requirement can be achieved through multiple methods, which will depend upon system architecture and design.

    Some commonly employed methods include: ensuring log files receive the proper file system permissions utilizing file system protections, restricting access, and backing up log data to ensure log data is retained.

    Applications providing a user interface to audit data will leverage user permissions and roles identifying the user accessing the data and the corresponding rights the user enjoys in order make access decisions regarding the deletion of audit data.

    Audit information includes all information (e.g., audit records, audit settings, and audit reports) needed to successfully audit information system activity. Audit information may include data from other applications or be included with the audit application itself.
  checkContent: |-
    Review the container platform configuration to determine where audit information is stored.

    If the audit log data is not protected from unauthorized deletion, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to protect the storage of audit information from unauthorized deletion.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233059
  ruleId: SV-233059r960939_rule
  ruleVersion: SRG-APP-000121-CTR-000255
  groupTitle: SRG-APP-000121
  ruleTitle: The container platform must protect audit tools from unauthorized access.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001493
  legacyIds: []
  discussion: |-
    Protecting audit data also includes identifying and protecting the tools used to view and manipulate log data. Therefore, protecting audit tools is necessary to prevent unauthorized operation on audit data.

    Applications providing tools to interface with audit data will leverage user permissions and roles identifying the user accessing the tools and the corresponding rights the user enjoys in order to make access decisions regarding the access to audit tools.

    Audit tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.
  checkContent: |-
    Review the container platform to validate container platform audit tools are protected from unauthorized access.

    If the audit tools are not protected from unauthorized access, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to protect audit tools from unauthorized access.
  verified: true
  evaluation:
    method: none
