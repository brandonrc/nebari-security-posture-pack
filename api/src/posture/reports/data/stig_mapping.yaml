  vulnId: V-233273
  ruleId: SV-233273r961863_rule
  ruleVersion: SRG-APP-000516-CTR-001325
  groupTitle: SRG-APP-000516
  ruleTitle: Container platform components must be configured in accordance with the security configuration settings based on DoD security configuration or implementation guidance, including SRGs, STIGs, NSA configuration guides, CTOs, and DTMs.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000366
  legacyIds: []
  discussion: Container platform components are part of the overall container platform, offering services that enable the container platform to fully orchestrate user containers. These components may fall outside the scope of this document, but they still must be secured. Examples of such components are DNS, routers, and firewalls. These and any other services offered by the container platform must follow the appropriate STIG or SRG for the technology offered. If a STIG or SRG is not available for the technology, then best practices for the technology must be used. For example, the Cloud Native Computing Foundation (CNCF) is an open-source organization that is working on container platform best practices.
  checkContent: |-
    Review the container platform configuration to determine the services offered by the container platform and validate that any services that are offered are configured in accordance with the security configuration settings based on DoD security configuration or implementation guidance, including SRGs, STIGs, NSA configuration guides, CTOs, and DTMs.

    If container platform services are not configured in accordance with the security configuration settings based on DoD security configuration or implementation guidance, including SRGs, STIGs, NSA configuration guides, CTOs, and DTMs, this is a finding.
  checkContentRef: M
  fixText: Configure container services in accordance with the security configuration settings based on DoD security configuration or implementation guidance, including SRGs, STIGs, NSA configuration guides, CTOs, and DTMs.
  verified: true
  evaluation:
    method: posture
    checks:
    - privileged
    - host-namespaces
    - host-path
    - run-as-root
    - privilege-escalation
    - added-capabilities
    - capabilities-not-dropped
    - writable-rootfs
    - no-resource-limits
    - no-resource-requests
    - mutable-tag
    - no-liveness-probe
    - no-readiness-probe
    - automount-sa-token
    - seccomp-unconfined
    - no-netpol
    aggregate: true
    onFail: Open
    onPass: Not_Reviewed
    note: Aggregates every workload posture check; host and control-plane configuration is not evaluated.
- benchmark: container-platform-srg
  vulnId: V-233275
  ruleId: SV-233275r961863_rule
  ruleVersion: SRG-APP-000516-CTR-001335
  groupTitle: SRG-APP-000516
  ruleTitle: The container platform must continuously scan components, containers, and images for vulnerabilities.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000366
  legacyIds: []
  discussion: |-
    Finding vulnerabilities quickly within the container platform and within containers deployed within the platform is important to keep the overall platform secure. When a vulnerability within a component or container is unknown or allowed to remain unpatched, other containers and customers within the platform become vulnerability. The vulnerability can lead to the loss of application data, organizational infrastructure data, and denial of service (DoS) to hosted applications.

    Vulnerability scanning can be performed by the container platform or by external applications.
  checkContent: |-
    Review the container platform to validate continuous vulnerability scans of components, containers, and container images are being performed.

    If continuous vulnerability scans are not being performed, this is a finding.
  checkContentRef: M
  fixText: Implement continuous vulnerability scans of container platform components, containers, and container images either by the container platform or from external vulnerability scanning applications.
  verified: true
  evaluation:
    method: scanner-coverage
    maxAgeDays: 7
    onFail: Open
    onPass: NotAFinding
- benchmark: container-platform-srg
  vulnId: V-270875
  ruleId: SV-270875r1050646_rule
  ruleVersion: SRG-APP-000247-CTR-000330
  groupTitle: SRG-APP-000247
  ruleTitle: The container must have resource request limits set.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001095
  legacyIds: []
  discussion: Setting a container resource request limit allows the container platform to determine the best location for the container to execute. The container platform looks at the resources available and finds the location that will require the minimum resources for the container to execute. Examples of resources that can be specified are CPU, memory, and storage.
  checkContent: |-
    Review the container platform configuration to determine that resource limits are set.

    If the container platform does not enforce resource limits, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to restrict the ability of users or other systems to launch denial-of-service (DoS) attacks from the container platform components by setting resource limits on resources such as memory, storage, and CPU utilization.
  verified: true
  evaluation:
    method: posture
    checks:
    - no-resource-limits
    - no-resource-requests
    onFail: Open
    onPass: NotAFinding
- benchmark: container-platform-srg
  vulnId: V-270876
  ruleId: SV-270876r1050649_rule
  ruleVersion: SRG-APP-000380-CTR-000340
  groupTitle: SRG-APP-000380
  ruleTitle: The container root filesystem must be mounted as read-only.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001813
  legacyIds: []
  discussion: Any changes to a container must be made by rebuilding the image and redeploying the new container image. Once a container is running, changes to the root filesystem should not be needed, thus preserving the immutable nature of the container. Any attempts to change the root filesystem are usually malicious in nature and can be prevented by making the root filesystem read-only.
  checkContent: |-
    Review the container platform configuration to determine that the root filesystem is mounted as read-only.

    If the container platform does not enforce such access restrictions, this is a finding.
  checkContentRef: M
  fixText: Review and remove nonsystem containers previously created with read-write permissions. Configure the container platform to force the root filesystem to be mounted as read-only.
  verified: true
  evaluation:
    method: posture
    checks:
    - writable-rootfs
    onFail: Open
    onPass: NotAFinding
