    sudo find /etc/kubernetes/pki -name "*.key" | xargs stat -c '%n %a'

    If any of the files have permissions more permissive than "600", this is a finding.
  checkContentRef: M
  fixText: |-
    Change the ownership of the key files to "600" by executing the command:

    find /etc/kubernetes/pki -name "*.key" | xargs chmod 600
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
  vulnId: V-245541
  ruleId: SV-245541r1069469_rule
  ruleVersion: CNTR-K8-001300
  groupTitle: SRG-APP-000190-CTR-000500
  ruleTitle: Kubernetes Kubelet must not disable timeouts.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001133
  legacyIds: []
  discussion: Idle connections from the Kubelet can be used by unauthorized users to perform malicious activity to the nodes, pods, containers, and cluster within the Kubernetes Control Plane. Setting the streamingConnectionIdleTimeout defines the maximum time an idle session is permitted prior to disconnect. Setting the value to "0" never disconnects any idle sessions. Idle timeouts must never be set to "0" and should be defined at "5m" (the default is 4hr).
  checkContent: |-
    Follow these steps to check streaming-connection-idle-timeout:

    1. On the Control Plane, run the command:

    ps -ef | grep kubelet

    If the "--streaming-connection-idle-timeout" option exists, this is a finding.

    Note the path to the config file (identified by --config).

    2. Run the command:

    grep -i streamingConnectionIdleTimeout <path_to_config_file>

    If the setting "streamingConnectionIdleTimeout" is set to less than "5m" or is not configured, this is a finding.
  checkContentRef: M
  fixText: |-
    Follow these steps to configure streaming-connection-idle-timeout:
    1. On the Control Plane, run the command:
    ps -ef | grep kubelet

    Remove the "--streaming-connection-idle-timeout" option if present.

    Note the path to the config file (identified by --config).

    2. Edit the Kubernetes Kubelet file in the --config directory on the Kubernetes Control Plane:

    Set the argument "streamingConnectionIdleTimeout" to a value of "5m".
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
  vulnId: V-245542
  ruleId: SV-245542r961632_rule
  ruleVersion: CNTR-K8-002620
  groupTitle: SRG-APP-000439-CTR-001080
  ruleTitle: Kubernetes API Server must disable basic authentication to protect information in transit.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-002448
  legacyIds: []
  discussion: Kubernetes basic authentication sends and receives request containing username, uid, groups, and other fields over a clear text HTTP communication. Basic authentication does not provide any security mechanisms using encryption standards. PKI certificate-based authentication must be set over a secure channel to ensure confidentiality and integrity. Basic authentication must not be set in the manifest file.
  checkContent: |-
    Change to the /etc/kubernetes/manifests/ directory on the Kubernetes Control Plane. Run the command:
    grep -i basic-auth-file *

    If "basic-auth-file" is set in the Kubernetes API server manifest file this is a finding.
  checkContentRef: M
  fixText: Edit the Kubernetes API Server manifest file in the /etc/kubernetes/manifests directory on the Kubernetes Control Plane. Remove the setting "--basic-auth-file".
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
  vulnId: V-245543
  ruleId: SV-245543r961632_rule
  ruleVersion: CNTR-K8-002630
  groupTitle: SRG-APP-000439-CTR-001080
  ruleTitle: Kubernetes API Server must disable token authentication to protect information in transit.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-002448
  legacyIds: []
  discussion: Kubernetes token authentication uses password known as secrets in a plaintext file. This file contains sensitive information such as token, username and user uid. This token is used by service accounts within pods to authenticate with the API Server. This information is very valuable for attackers with malicious intent if the service account is privileged having access to the token. With this token a threat actor can impersonate the service account gaining access to the Rest API service.
  checkContent: |-
    Change to the /etc/kubernetes/manifests/ directory on the Kubernetes Control Plane. Run the command:
    grep -i token-auth-file *

    If "--token-auth-file" is set in the Kubernetes API server manifest file, this is a finding.
  checkContentRef: M
  fixText: |-
    Edit the Kubernetes API Server manifest file in the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

    Remove the setting "--token-auth-file".
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
  vulnId: V-245544
  ruleId: SV-245544r961632_rule
  ruleVersion: CNTR-K8-002640
  groupTitle: SRG-APP-000439-CTR-001080
  ruleTitle: Kubernetes endpoints must use approved organizational certificate and key pair to protect information in transit.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-002448
  legacyIds: []
  discussion: |-
    Kubernetes control plane and external communication is managed by API Server. The main implementation of the API Server is to manage hardware resources for pods and container using horizontal or vertical scaling. Anyone who can gain access to the API Server can effectively control your Kubernetes architecture. Using authenticity protection, the communication can be protected against man-in-the-middle attacks/session hijacking and the insertion of false information into sessions.

    The communication session is protected by utilizing transport encryption protocols, such as TLS. TLS provides the Kubernetes API Server with a means to be able to authenticate sessions and encrypt traffic.

    By default, the API Server does not authenticate to the kubelet HTTPs endpoint. To enable secure communication for API Server, the parameter -kubelet-client-certificate and kubelet-client-key must be set. This parameter gives the location of the certificate and key pair used to secure API Server communication.
  checkContent: |-
    Change to the /etc/kubernetes/manifests/ directory on the Kubernetes Control Plane. Run the command:
    grep -i kubelet-client-certificate *
    grep -I kubelet-client-key *

    If the setting "--kubelet-client-certificate" is not configured in the Kubernetes API server manifest file or contains no value, this is a finding.

    If the setting "--kubelet-client-key" is not configured in the Kubernetes API server manifest file or contains no value, this is a finding.
  checkContentRef: M
  fixText: Edit the Kubernetes API Server manifest file in the /etc/kubernetes/manifests directory on the Kubernetes Control Plane. Set the value of "--kubelet-client-certificate" and "--kubelet-client-key" to an Approved Organizational Certificate and key pair.
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
  vulnId: V-254800
  ruleId: SV-254800r961359_rule
  ruleVersion: CNTR-K8-002011
  groupTitle: SRG-APP-000342-CTR-000775
  ruleTitle: Kubernetes must have a Pod Security Admission control file configured.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-002263
  legacyIds: []
  discussion: |-
    An admission controller intercepts and processes requests to the Kubernetes API prior to persistence of the object, but after the request is authenticated and authorized.

    Kubernetes (> v1.23)offers a built-in Pod Security admission controller to enforce the Pod Security Standards. Pod security restrictions are applied at the namespace level when pods are created.

    The Kubernetes Pod Security Standards define different isolation levels for Pods. These standards define how to restrict the behavior of pods in a clear, consistent fashion.
  checkContent: |-
    Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane. Run the command:

    "grep -i admission-control-config-file *"

    If the setting "--admission-control-config-file" is not configured in the Kubernetes API Server manifest file, this is a finding.

    Inspect the .yaml file defined by the --admission-control-config-file. Verify PodSecurity is properly configured.
    If least privilege is not represented, this is a finding.
  checkContentRef: M
  fixText: |-
    Edit the Kubernetes API Server manifest file in the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

    Set the value of "--admission-control-config-file" to a valid path for the file.

    Create an admission controller config file:
    Example File:
    ```yaml
    apiVersion: apiserver.config.k8s.io/v1
    kind: AdmissionConfiguration
    plugins:
    - name: PodSecurity
      configuration:
        apiVersion: pod-security.admission.config.k8s.io/v1beta1
        kind: PodSecurityConfiguration
        # Defaults applied when a mode label is not set.
        defaults:
          enforce: "privileged"
          enforce-version: "latest"
        exemptions:
          # Don't forget to exempt namespaces or users that are responsible for deploying
          # cluster components, because they need to run privileged containers
          usernames: ["admin"]
          namespaces: ["kube-system"]

    See for more details:
    Migrate from PSP to PSA:
    https://kubernetes.io/docs/tasks/configure-pod-container/migrate-from-psp/

    Best Practice: https://kubernetes.io/docs/concepts/security/pod-security-policy/#recommended-practice.
  verified: true
  evaluation:
    method: posture
    checks:
    - privileged
    - host-namespaces
    - host-path
    - run-as-root
    - privilege-escalation
    - added-capabilities
    - seccomp-unconfined
    onFail: Open
    onPass: Not_Reviewed
    exemptNamespaces: true
    note: Pods violating the Pod Security Standards "restricted" profile are running, so Pod Security Admission is not enforcing least privilege for those namespaces. The --admission-control-config-file flag itself must be verified manually.
- benchmark: kubernetes
  vulnId: V-254801
  ruleId: SV-254801r961359_rule
  ruleVersion: CNTR-K8-002001
  groupTitle: SRG-APP-000342-CTR-000775
  ruleTitle: Kubernetes must enable PodSecurity admission controller on static pods and Kubelets.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-002263
  legacyIds: []
  discussion: |-
    PodSecurity admission controller is a component that validates and enforces security policies for pods running within a Kubernetes cluster. It is responsible for evaluating the security context and configuration of pods against defined policies.

    To enable PodSecurity admission controller on Static Pods (kube-apiserver, kube-controller-manager, or kube-schedule), the argument "--feature-gates=PodSecurity=true" must be set.

    To enable PodSecurity admission controller on Kubelets, the featureGates PodSecurity=true argument must be set.

    (Note: The PodSecurity feature gate is GA as of  v1.25.)
  checkContent: |-
    On the Control Plane, change to the manifests' directory at /etc/kubernetes/manifests and run the command:
    grep -i feature-gates *

    For each manifest file, if the "--feature-gates" setting does not exist, does not contain the "--PodSecurity" flag, or sets the flag to "false", this is a finding.

    On each Control Plane and Worker Node, run the command:
    ps -ef | grep kubelet

    If the "--feature-gates" option exists, this is a finding.

    Note the path to the config file (identified by --config).

    Inspect the content of the config file:
    If the "featureGates" setting is not present, does not contain the "PodSecurity" flag, or sets the flag to "false", this is a finding.
  checkContentRef: M
  fixText: |-
    On the Control Plane, change to the manifests' directory at /etc/kubernetes/manifests and run the command:
    grep -i feature-gates *

    Ensure the argument "--feature-gates=PodSecurity=true" is present in each manifest file.

    On each Control Plane and Worker Node, run the command:
    ps -ef | grep kubelet

    Remove the "--feature-gates" option if present.

    Note the path to the config file (identified by --config).

    Edit the Kubernetes Kubelet config file:
    Add a "featureGates" setting if one does not yet exist. Add the feature gate "PodSecurity=true".

    Restart the kubelet service using the following command:
    systemctl daemon-reload && systemctl restart kubelet
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
  vulnId: V-274882
  ruleId: SV-274882r1137640_rule
  ruleVersion: CNTR-K8-001162
  groupTitle: SRG-APP-000033-CTR-000100
  ruleTitle: Kubernetes Secrets must be encrypted at rest.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-000213
  legacyIds: []
  discussion: Kubernetes Secrets may store sensitive information such as passwords, tokens, and keys. These values are stored in the etcd database used by Kubernetes unencrypted. To protect these Secrets at rest, these values must be encrypted.
  checkContent: |-
    Change to the /etc/kubernetes/manifests directory on the Kubernetes Master Node. Run the command:
    grep -i encryption-provider-config *

    If the setting "encryption-provider-config" is not configured, this is a finding.

    If the setting is configured, check the contents of the file specified by its argument.

    If the file does not specify the Secret's resource, this is a finding.

    If the identity provider is specified as the first provider for the resource, this is also a finding.
  checkContentRef: M
  fixText: |-
    Edit the Kubernetes API Server manifest file in the /etc/kubernetes/manifests directory on the Kubernetes Master Node.

    Set the value of "--encryption-provider-config" to the path to the encryption config.

    The encryption config must specify the Secret's resource and provider. Below is an example:
    {
      "kind": "EncryptionConfiguration",
      "apiVersion": "apiserver.config.k8s.io/v1",
      "resources": [
        {
          "resources": [
            "secrets"
          ],
          "providers": [
            {
              "aescbc": {
                "keys": [
                  {
                    "name": "aescbckey",
                    "secret": "xxxxxxxxxxxxxxxxxxx"
                  }
                ]
              }
            },
            {
              "identity": {}
            }
          ]
        }
      ]
    }
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
  vulnId: V-274883
  ruleId: SV-274883r1107239_rule
  ruleVersion: CNTR-K8-001161
  groupTitle: SRG-APP-000171-CTR-000435
  ruleTitle: Sensitive information must be stored using Kubernetes Secrets or an external Secret store provider.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-004062
  legacyIds: []
  discussion: |-
    Sensitive information, such as passwords, keys, and tokens must not be stored in application code.

    Kubernetes offers a resource called Secrets that are designed for storing sensitive information for use by applications. Secrets are created and managed separately from application code. Additionally, they can be encrypted at rest and access to the secrets can be controlled via RBAC.
  checkContent: |-
    On the Kubernetes Master node, run the following command:
    kubectl get all,cm -A -o yaml

    Manually review the output for sensitive information.

    If any sensitive information is found, this is a finding.
  checkContentRef: M
  fixText: Any sensitive information found must be stored in an approved external Secret store provider or use Kubernetes Secrets (attached on an as-needed basis to pods).
  verified: true
  evaluation:
    method: none
- benchmark: kubernetes
  vulnId: V-274884
  ruleId: SV-274884r1107245_rule
  ruleVersion: CNTR-K8-001163
  groupTitle: SRG-APP-000429-CTR-001060
  ruleTitle: Kubernetes must limit Secret access on a need-to-know basis.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002476
  legacyIds: []
  discussion: Kubernetes secrets may store sensitive information such as passwords, tokens, and keys. Access to these secrets should be limited to a need-to-know basis via Kubernetes RBAC.
  checkContent: |-
    Review the Kubernetes accounts and their corresponding roles.

    If any accounts have read (list, watch, get) access to Secrets without a documented organizational requirement, this is a finding.

    Run the below command to list the workload resources for applications deployed to Kubernetes:
    kubectl get all -A -o yaml

    If Secrets are attached to applications without a documented requirement, this is a finding.
  checkContentRef: M
  fixText: For Kubernetes accounts that have read access to Secrets without a documented requirement, modify the corresponding Role or ClusterRole to remove list, watch, and get privileges for Secrets.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233015
  ruleId: SV-233015r960759_rule
  ruleVersion: SRG-APP-000014-CTR-000035
  groupTitle: SRG-APP-000014
  ruleTitle: The container platform must use TLS 1.2 or greater for secure container image transport from trusted sources.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000068
  legacyIds: []
  discussion: The authenticity and integrity of the container image during the container image lifecycle is part of the overall security posture of the container platform. This begins with the container image creation and pull of a base image from a trusted source for child container image creation and the instantiation of the new image into a running service. If an insecure protocol is used during transmission of container images at any step of the lifecycle, a bad actor may inject nefarious code into the container image. The container image, when instantiated, then becomes a security risk to the container platform, the host server, and other containers within the container platform. To thwart the injection of code during transmission, a secure protocol (TLS 1.2 or newer) must be used. Further guidance on secure transport protocols can be found in NIST SP 800-52.
  checkContent: |-
    Review the container platform configuration to verify that TLS 1.2 or greater is being used for secure container image transport from trusted sources.

    If TLS 1.2 or greater is not being used for secure container image transport, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to use TLS 1.2 or greater when components communicate internally or externally. The fix ensures that all communication components in the container platform are configured to utilize secure versions of TLS.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233016
  ruleId: SV-233016r960759_rule
  ruleVersion: SRG-APP-000014-CTR-000040
  groupTitle: SRG-APP-000014
  ruleTitle: The container platform must use TLS 1.2 or greater for secure communication.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000068
  legacyIds: []
  discussion: The authenticity and integrity of the container platform and communication between nodes and components must be secure. If an insecure protocol is used during transmission of data, the data can be intercepted and manipulated. The manipulation of data can be used to inject status changes of the container platform, causing the execution of containers or reporting an incorrect healthcheck. To thwart the manipulation of the data during transmission, a secure protocol (TLS 1.2 or newer) must be used. Further guidance on secure transport protocols can be found in NIST SP 800-52.
  checkContent: |-
    Review the container platform configuration to verify that TLS 1.2 or greater is being used for communication by the container platform nodes and components.

    If TLS 1.2 or greater is not being used for secure communication, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to use TLS 1.2 or greater for node and component communication.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233019
  ruleId: SV-233019r1043176_rule
  ruleVersion: SRG-APP-000023-CTR-000055
  groupTitle: SRG-APP-000023
  ruleTitle: The container platform must use a centralized user management solution to support account management functions.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000015
  legacyIds: []
  discussion: |-
    Enterprise environments make application account management challenging and complex. A manual process for account management functions adds the risk of a potential oversight or other error.

    A comprehensive application account management process that includes automation helps to ensure accounts designated as requiring attention are consistently and promptly addressed. Examples include, but are not limited to, using automation to take action on multiple accounts designated as inactive, suspended, or terminated or by disabling accounts located in non-centralized account stores, such as multiple servers. This requirement applies to all account types, including individual/user, shared, group, system, guest/anonymous, emergency, developer/manufacturer/vendor, temporary, and service.

    The application must be configured to automatically provide account management functions, and these functions must immediately enforce the organization's current account policy. The automated mechanisms may reside within the application itself or may be offered by the operating system or other infrastructure-providing automated account management capabilities. Automated mechanisms may be comprised of differing technologies, that when placed together, contain an overall automated mechanism supporting an organization's automated account management requirements.

    Account management functions include: assignment of group or role membership; identifying account type; specifying user access authorizations (i.e., privileges); account removal, update, or termination; and administrative alerts. The use of automated mechanisms can include: using email or text messaging to automatically notify account managers when users are terminated or transferred; using the information system to monitor account usage; or using automated telephonic notification to report atypical system account usage.
  checkContent: |-
    Review the container platform to determine if it is using a centralized user management system for user management functions.

    If the container platform is not using a centralized user management system for user management functions, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to use a centralized user management system for user management functions.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233020
  ruleId: SV-233020r960771_rule
  ruleVersion: SRG-APP-000024-CTR-000060
  groupTitle: SRG-APP-000024
  ruleTitle: The container platform must automatically remove or disable temporary user accounts after 72 hours.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000016
  legacyIds: []
  discussion: |-
    If temporary user accounts remain active when no longer needed or for an excessive period, these accounts may be used to gain unauthorized access. To mitigate this risk, automated termination of all temporary user accounts must be set upon account creation.

    Temporary user accounts are established as part of normal account activation procedures when there is a need for short-term accounts without the demand for immediacy in account activation.

    If temporary user accounts are used, the application must be configured to automatically terminate these types of accounts after a DoD-defined period of 72 hours.

    To address access requirements, many application developers choose to integrate their applications with enterprise-level authentication/access mechanisms that meet or exceed access control policy requirements. Such integration allows the application developer to off-load those access control functions and focus on core application features and functionality.
  checkContent: |-
    Review the container platform configuration to determine if temporary user accounts are automatically removed or disabled after 72 hours.

    If temporary user accounts are not automatically removed or disabled after 72 hours, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to automatically remove or disable temporary user accounts after 72 hours.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233021
  ruleId: SV-233021r960774_rule
  ruleVersion: SRG-APP-000025-CTR-000065
  groupTitle: SRG-APP-000025
  ruleTitle: The container platform must automatically disable accounts after a 35-day period of account inactivity.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000017
  legacyIds: []
  discussion: |-
    Attackers that are able to exploit an inactive account can potentially obtain and maintain undetected access to an application. Owners of inactive accounts will not notice if unauthorized access to their user account has been obtained. Applications need to track periods of user inactivity and disable accounts after 35 days of inactivity. Such a process greatly reduces the risk that accounts will be hijacked, leading to a data compromise.

    To address access requirements, many application developers choose to integrate their applications with enterprise-level authentication/access mechanisms that meet or exceed access control policy requirements. Such integration allows the application developer to off-load those access control functions and focus on core application features and functionality.

    This policy does not apply to either emergency accounts or infrequently used accounts. Infrequently used accounts are local login administrator accounts used by system administrators when network or normal logon/access is not available. Emergency accounts are administrator accounts created in response to crisis situations.
  checkContent: |-
    Determine if the container platform automatically disables accounts after a 35-day period of account inactivity.

    If the container platform does not automatically disable accounts after a 35-day period of account inactivity, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to automatically disable accounts after a 35-day period of account inactivity.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233022
  ruleId: SV-233022r960777_rule
  ruleVersion: SRG-APP-000026-CTR-000070
  groupTitle: SRG-APP-000026
  ruleTitle: The container platform must automatically audit account creation.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000018
  legacyIds: []
  discussion: |-
    Once an attacker establishes access to a system, the attacker often attempts to create a persistent method of re-establishing access. One way to accomplish this is for the attacker to create a new account. Auditing of account creation is one method for mitigating this risk. A comprehensive account management process will ensure an audit trail documents the creation of application user accounts and, as required, notifies administrators and/or application when accounts are created. Such a process greatly reduces the risk that accounts will be surreptitiously created, and provides logging that can be used for forensic purposes.

    To address access requirements, many application developers choose to integrate their applications with enterprise-level authentication/access/auditing mechanisms that meet or exceed access control policy requirements. Such integration allows the application developer to off-load those access control functions and focus on core application features and functionality.
  checkContent: |-
    Review the container platform configuration to determine if audit records are automatically created upon account creation.

    If audit records are not automatically created upon account creation, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to automatically create audit records on account creation.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233023
  ruleId: SV-233023r960780_rule
  ruleVersion: SRG-APP-000027-CTR-000075
  groupTitle: SRG-APP-000027
  ruleTitle: The container platform must automatically audit account modification.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001403
  legacyIds: []
  discussion: |-
    Once an attacker establishes access to a system, the attacker often attempts to create a persistent method of re-establishing access. One way to accomplish this is for the attacker to modify an existing account. Auditing of account creation is one method for mitigating this risk. A comprehensive account management process will ensure an audit trail documents the creation of application user accounts and, as required, notifies administrators and/or application when accounts are created. Such a process greatly reduces the risk that accounts will be surreptitiously created and provides logging that can be used for forensic purposes.

    To address access requirements, many application developers choose to integrate their applications with enterprise-level authentication/access/auditing mechanisms that meet or exceed access control policy requirements. Such integration allows the application developer to off-load those access control functions and focus on core application features and functionality.
  checkContent: |-
    Review the container platform configuration to determine if account modification is automatically audited.

    If account modification is not automatically audited, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to automatically audit account modification.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233024
  ruleId: SV-233024r960783_rule
  ruleVersion: SRG-APP-000028-CTR-000080
  groupTitle: SRG-APP-000028
  ruleTitle: The container platform must automatically audit account-disabling actions.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001404
  legacyIds: []
  discussion: |-
    When application accounts are disabled, user accessibility is affected. Once an attacker establishes access to an application, the attacker often attempts to disable authorized accounts to disrupt services or prevent the implementation of countermeasures. Auditing account-disabling actions provides logging that can be used for forensic purposes.

    To address access requirements, many application developers choose to integrate their applications with enterprise-level authentication/access/audit mechanisms meeting or exceeding access control policy requirements. Such integration allows the application developer to off-load those access control functions and focus on core application features and functionality.
  checkContent: |-
    Review the container platform configuration to determine if account disabling is automatically audited.

    If account disabling is not automatically audited, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to automatically audit account disabling.
  verified: true
  evaluation:
    method: none
