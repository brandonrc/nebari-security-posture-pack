  vulnId: V-233276
  ruleId: SV-233276r961869_rule
  ruleVersion: SRG-APP-000560-CTR-001340
  groupTitle: SRG-APP-000560
  ruleTitle: The container platform must prohibit communication using TLS versions 1.0 and 1.1, and SSL 2.0 and 3.0.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-001453
  legacyIds: []
  discussion: |-
    The container platform and its components will prohibit the use of SSL and unauthorized versions of TLS protocols to properly secure communication.

    The use of unsupported protocol exposes vulnerabilities to the container platform by rogue traffic interceptions, man-in-the middle-attacks, and impersonation of users or services from the container platform runtime, registry, and keystore.

    The container platform and its components will adhere to NIST 800-52R2.
  checkContent: |-
    Review the container platform configuration to determine if TLS versions 1.0 and 1.1, SSL 2.0 and 3.0 are prohibited for communication.

    If communication using TLS versions 1.0 and 1.1, SSL 2.0 and 3.0 is permitted, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to prohibit communication using TLS versions 1.0 and 1.1, SSL 2.0 and 3.0.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233284
  ruleId: SV-233284r961893_rule
  ruleVersion: SRG-APP-000605-CTR-001380
  groupTitle: SRG-APP-000605
  ruleTitle: The container platform must validate certificates used for Transport Layer Security (TLS) functions by performing an RFC 5280-compliant certification path validation.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000185
  legacyIds: []
  discussion: |-
    A certification path is the path from the end entity certificate to a trusted root certification authority (CA). Certification path validation is necessary for a relying party to make an informed decision regarding acceptance of an end entity certificate and discourages the use of self-signed certificates.

    Certification path validation includes checks such as certificate issuer trust, time validity, and revocation status for each certificate in the certification path. Revocation status information for CA and subject certificates in a certification path is commonly provided via certificate revocation lists (CRLs) or online certificate status protocol (OCSP) responses. Compliance checks should be in accordance to RFC 5280.

    Not adhering to RFC 5280 could result in rogue certificates, session hijacks, man-in-the-middle, denial-of-service attacks, malware, and data or information manipulation.
  checkContent: |-
    Review the container platform configuration to verify the container platform is validating certificates used for Transport Layer Security (TLS) functions by performing a RFC 5280-compliant certification path validation and that self-signed certificates are not being used.

    If the container platform is not validating certificates used for TLS functions by performing an RFC 5280-compliant certification path validation, this is a finding.

    If self-signed certificates are in use, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to validate certificates used for Transport Layer Security (TLS) functions by performing an RFC 5280-compliant certification path validation and to disable the use of self-signed certificates.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233285
  ruleId: SV-233285r961896_rule
  ruleVersion: SRG-APP-000610-CTR-001385
  groupTitle: SRG-APP-000610
  ruleTitle: The container platform must use FIPS-validated SHA-2 or higher hash function for digital signature generation and verification (non-legacy use).
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000803
  legacyIds: []
  discussion: Without the use of digital signature, information can be altered by unauthorized accounts accessing or modifying the container platform registry, keystore, and container at runtime. Digital signatures provide non-repudiation for transactions between the components within the container platform. Without the use of approved FIPS-validated SHA-2 or higher hash function with digital signatures, the container platform cannot claim the validity of the individual or service identity and guarantee private key is kept secret. Keeping the private keys secure is vital for validating individuals or service identity prior to information exchange. The container platform must be configured to use SHA-2 or higher hash functions for digital signatures in accordance with SP 800-131Ar2.
  checkContent: |-
    Review the container platform configuration to validate that a FIPS-validated SHA-2 or higher hash function is being used for digital signature generation and verification.

    If a FIPS-validated SHA-2 or higher hash function is not being used for digital signature generation and verification, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to use a FIPS-validated SHA-2 or higher hash function for digital signature generation and verification.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233289
  ruleId: SV-233289r1137648_rule
  ruleVersion: SRG-APP-000635-CTR-001405
  groupTitle: SRG-APP-000635
  ruleTitle: The container platform must use a FIPS-validated cryptographic module to implement encryption services for unclassified information requiring confidentiality.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-002450
  legacyIds: []
  discussion: |-
    Unvalidated cryptography is viewed by NIST as providing no protection to the information or data. In effect, the data would be considered unprotected plaintext. If the agency specifies that the information or data be cryptographically protected, then FIPS 140-2/140-3 is applicable. In essence, if cryptography is required, it must be validated. Cryptographic modules that have been approved for classified use may be used in lieu of modules that have been validated against the FIPS 140-2/140-3 standard.

    The cryptographic module used must have one FIPS-validated encryption algorithm (i.e., validated Advanced Encryption Standard [AES]). This validated algorithm must be used for encryption for cryptographic security function within the container platform component and information residing in the container platform registry and keystore.

    This requirement also applies to Zero Trust initiatives.
  checkContent: |-
    Review the container platform configuration to ensure FIPS-validated cryptographic modules are implemented to encrypt unclassified information requiring confidentiality.

    If FIPS-validated cryptographic modules are not being used, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to use FIPS-validated cryptographic modules to encrypt unclassified information requiring confidentiality.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-233290
  ruleId: SV-233290r961911_rule
  ruleVersion: SRG-APP-000645-CTR-001410
  groupTitle: SRG-APP-000645
  ruleTitle: The container platform must prohibit or restrict the use of protocols that transmit unencrypted authentication information or use flawed cryptographic algorithms for transmission.
  severity: high
  cat: I
  weight: '10.0'
  ccis:
  - CCI-000382
  legacyIds: []
  discussion: |-
    The use of secure ports, protocols and services within the container platform must be controlled and conform to the PPSM CAL. Those ports, protocols, and services that fall outside the PPSM CAL must be blocked by the runtime. Instructions on the PPSM can be found in DoD Instruction 8551.01 Policy.

    Unsecure protocols for transmission will expose the information system data and information, making the session susceptible to manipulation, hijacking, and man-in-the middle attacks.
  checkContent: |-
    Review the container platform configuration to verify that container platform is not using protocols that transmit authentication data unencrypted and that the container platform is not using flawed cryptographic algorithms for transmission.

    If the container platform is using protocols to transmit authentication data unencrypted or is using flawed cryptographic algorithms, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to use protocols that transmit authentication data encrypted and to use cryptographic algorithms that are not flawed.
  verified: true
  evaluation:
    method: none
- benchmark: container-platform-srg
  vulnId: V-257291
  ruleId: SV-257291r961287_rule
  ruleVersion: SRG-APP-000318-CTR-000740
  groupTitle: SRG-APP-000318
  ruleTitle: The container platform must enforce organization-defined circumstances and/or usage conditions for organization-defined accounts.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-002145
  legacyIds: []
  discussion: |-
    Activity under unusual conditions can indicate hostile activity. For example, what is normal activity during business hours can indicate hostile activity if it occurs during off hours.

    Depending on mission needs and conditions, account usage restrictions based on conditions and circumstances may be critical to limit access to resources and data to comply with operational or mission access control requirements. Thus, the application must be configured to enforce the specific conditions or circumstances under which application accounts can be used (e.g., by restricting usage to certain days of the week, time of day, or specific durations of time).
  checkContent: |-
    Determine if the container platform is configured to enforce organization-defined circumstances and/or usage conditions for organization-defined accounts.

    If the container platform does not enforce organization-defined circumstances and/or usage conditions for organization-defined accounts, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to enforce organization-defined circumstances and/or usage conditions for organization-defined accounts.
  verified: true
  evaluation:
    method: none
