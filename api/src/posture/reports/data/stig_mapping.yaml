  ruleTitle: The container platform must use multifactor authentication for network access to privileged accounts.
  severity: medium
  cat: II
  weight: '10.0'
  ccis:
  - CCI-000765
  legacyIds: []
  discussion: |-
    Without the use of multifactor authentication, the ease of access to privileged functions is greatly increased.

    Multifactor authentication requires using two or more factors to achieve authentication.

    Factors include:
    (i) something a user knows (e.g., password/PIN);
    (ii) something a user has (e.g., cryptographic identification device, token); or
    (iii) something a user is (e.g., biometric).

    A privileged account is defined as an information system account with authorizations of a privileged user.

    Network access is defined as access to an information system by a user (or a process acting on behalf of a user) communicating through a network (e.g., local area network, wide area network, or the internet).
  checkContent: |-
    Review the container platform configuration to determine if the container platform is configured to use multifactor authentication for network access to privileged accounts.

    If the container platform does not use multifactor authentication for network access to privileged accounts, this is a finding.
  checkContentRef: M
  fixText: Configure the container platform to use multifactor authentication for network access to privileged accounts.
  verified: true
  evaluation:
    method: none
