[project]
name = "nebari-security-posture"
version = "0.1.0"
description = "Nebari Security Posture pack: API + scan worker (Trivy, Grype, Clair consensus)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy[asyncio]==2.1.2",
  "asyncpg==0.31.0",
  "alembic==1.20.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "pyjwt[crypto]==2.15.1",
  "kubernetes==36.0.3",
  "apscheduler==3.11.3",
  "pyyaml==6.0.3",
  # compliance report generators (posture.reports, see reports-requirements.txt)
  "openpyxl==3.1.5",
  "jinja2==3.1.6",
  "weasyprint==70.0",
  # >>> operations / scale: /metrics (posture.metrics), streaming scanner JSON parse
  "prometheus-client==0.23.1",
  "ijson==3.4.0",
  # <<< operations / scale
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "pytest-cov==7.1.0", "cryptography==50.0.2", "jsonschema==4.26.0"]
lint = ["ruff==0.16.10", "mypy==2.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["src"]
# The Postgres scenario modules (test_integration, test_reports_api, ...) are ordered test_01..
# steps sharing DB state: never shuffle (quality M3). See CONTRIBUTING.md.
addopts = "-p no:randomly"
markers = ["integration: needs Postgres via TEST_DATABASE_URL"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
target-version = "py312"
line-length = 140
extend-exclude = ["src/posture/alembic/versions"]

[tool.ruff.lint]
# pyflakes + the non-style pycodestyle errors (ruff's classic defaults). Formatting is not
# enforced (yet): `ruff format --check` would rewrite most files. ASYNC (blocking open()
# in async defs, `timeout` params) reports 17 findings in scanners/mirror/controls_engine;
# enable it once those are cleaned up.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["posture"]
branch = true
omit = ["src/posture/alembic/versions/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.mypy]
# Advisory for now (the `mypy` CI job is non-blocking); tighten module by module.
python_version = "3.12"
mypy_path = "src"
packages = ["posture"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
