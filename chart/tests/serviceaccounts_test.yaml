suite: ServiceAccount split on the workloads (security C1 / architecture B4)
release:
  name: security-posture
  namespace: security-posture
tests:
  - it: the API runs as <fullname>-api without a mounted token
    template: templates/api.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: security-posture-api
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: the scan worker and the privileged worker use different ServiceAccounts
    template: templates/worker.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.template.spec.serviceAccountName
          value: security-posture-scanner
        documentSelector:
          path: metadata.name
          value: security-posture-worker
      - equal:
          path: spec.template.spec.serviceAccountName
          value: security-posture-controls
        documentSelector:
          path: metadata.name
          value: security-posture-worker-privileged

  - it: without the split a single worker runs with the controls ServiceAccount
    template: templates/worker.yaml
    set:
      worker.splitPrivileged: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.template.spec.serviceAccountName
          value: security-posture-controls

  - it: honours ServiceAccount name overrides
    template: templates/worker.yaml
    set:
      serviceAccount.create: false
      serviceAccount.names.api: sp-api
      serviceAccount.names.scanner: sp-scan
      serviceAccount.names.controls: sp-ctl
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: sp-scan
        documentSelector:
          path: metadata.name
          value: security-posture-worker
