# Default values for nebari-security-posture-pack.
#
# Contract: docs/DESIGN.md (sections 3, 5, 8). Every component runs in the
# release namespace. The namespace MUST carry `nebari.dev/managed: "true"`
# when nebariapp.enabled is true or the nebari-operator ignores the NebariApp.
#
# This file contains NO secrets. Database credentials are generated into
# Secret <fullname>-db by a pre-install/pre-upgrade hook Job (Argo CD: PreSync)
# that only creates it when it is missing, or read from an existing Secret you
# name (postgresql.existingSecret - recommended under Argo CD / GitOps).
#
# values.schema.json validates the types and enums of this file.

# =============================================================================
# Images
# =============================================================================
# First-party images (api, worker, ui) are built from this repo. Third-party
# images are pinned by tag AND digest. A non-empty `digest` (sha256:...) wins
# over `tag`; the tag is kept for readability. The digests are the multi-arch
# index digests of the tags, resolved with any of:
#   skopeo inspect --format '{{.Digest}}' docker://docker.io/library/postgres:16.15-alpine
#   crane digest postgres:16.15-alpine
#   docker buildx imagetools inspect postgres:16.15-alpine   (the "Digest:" line)
# Bump tag and digest together.
images:
  api:
    repository: quay.io/nebari/nebari-security-posture-pack-api
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent
  worker:
    # api image + trivy, grype, clairctl and skopeo binaries.
    repository: quay.io/nebari/nebari-security-posture-pack-worker
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent
  ui:
    repository: quay.io/nebari/nebari-security-posture-pack-ui
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent
  trivy:
    repository: aquasec/trivy
    tag: "0.75.0"
    digest: "sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa"
    pullPolicy: IfNotPresent
  clair:
    repository: quay.io/projectquay/clair
    tag: "4.9.0"
    digest: "sha256:23329c3368e4425514af425c98e61dcc2492e0578f100655b83f0ddb3a8f2f93"
    pullPolicy: IfNotPresent
  postgres:
    # Also used for the wait-for-db init containers (pg_isready) and the
    # pg_dump backup CronJob.
    repository: postgres
    tag: "16.15-alpine"
    digest: "sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea"
    pullPolicy: IfNotPresent

# =============================================================================
# Admin gating
# =============================================================================
# Keycloak groups allowed to use the pack. Feeds all three gating layers:
#   1. nebariapp.auth.groups (gateway enforcement on operators that support it)
#   2. the optional chart-rendered SecurityPolicy (adminGate.securityPolicy)
#   3. ADMIN_GROUPS for the API's own JWT verification
# A leading "/" is ignored when matching (NIC's realm mapper emits "/group",
# grace's operator mapper emits "group"); the SecurityPolicy accepts both.
adminGroups:
  - admin

adminGate:
  securityPolicy:
    # Render an Envoy Gateway SecurityPolicy (OIDC + JWT + authorization
    # default Deny, allow on the `groups` claim) targeting the HTTPRoute the
    # operator creates for the NebariApp (<fullname>-route). Use this on
    # upstream operator builds that only use auth.groups for landing-page
    # visibility. When enabled, the NebariApp's auth.enforceAtGateway is
    # rendered false automatically so the route carries exactly one policy;
    # the operator still provisions the Keycloak client (provisionClient).
    # Requires nebariapp.enabled.
    enabled: false
    # Token issuer as stamped into the `iss` claim (public Keycloak URL).
    # Also used as oidc.provider.issuer (EG >= 1.9 requires https there).
    # Example: https://keycloak.example.com/auth/realms/nebari (required when enabled)
    externalIssuer: ""
    # In-cluster Keycloak realm URL, used for the back-channel token and
    # JWKS endpoints (Envoy may not resolve the public FQDN).
    internalIssuer: http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/nebari
    # OIDC callback path; must match nebariapp.auth.redirectURI.
    redirectPath: /oauth2/callback
    logoutPath: /logout
    # Cookie holding the ID token (what the operator's policy uses, and what
    # the API reads).
    idTokenCookie: NebariIdToken
    # Override the generated client id (default "<namespace>-<fullname>",
    # the operator's naming).
    clientID: ""
    # Override the client secret Secret (default "<fullname>-oidc-client",
    # created by the operator when nebariapp.auth.provisionClient is true).
    clientSecretName: ""
    # Fields that need a newer Envoy Gateway than grace runs (strict decoding
    # rejects unknown fields). Enable on EG >= 1.5:
    #   endSessionEndpoint    - Keycloak logout on /logout
    #   passThroughAuthHeader - let `Authorization: Bearer` requests skip the
    #                           OIDC redirect and go straight to JWT checks
    endSessionEndpoint: false
    passThroughAuthHeader: false

# =============================================================================
# API authentication (layer 3)
# =============================================================================
auth:
  # oidc: verify JWT signature/exp/iss + admin group on every request.
  # disabled: no auth at all; local development ONLY.
  mode: oidc
  # JWKS endpoint used to verify token signatures (in-cluster URL).
  jwksUrl: http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/nebari/protocol/openid-connect/certs
  # Accepted `iss` values: list the EXTERNAL issuer your browser tokens carry
  # (https://<keycloak host>/auth/realms/nebari) and the internal one. The API
  # refuses to start with an empty list (fail closed). The default only accepts
  # tokens minted against the in-cluster URL, i.e. normally none: add yours.
  issuers:
    - http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/nebari
  # Accepted client ids: a token's `aud` must contain, or its `azp` equal, one
  # of these (OIDC_CLIENT_IDS). "" = the operator-provisioned client
  # "<namespace>-<fullname>" (or adminGate.securityPolicy.clientID) when
  # nebariapp.enabled; empty otherwise (check skipped with a warning).
  clientIds: []
  # Extra accepted audiences (OIDC_AUDIENCES).
  audiences: []

# =============================================================================
# Scanning
# =============================================================================
scanner:
  # Images scanned in parallel (each image runs its scanners concurrently).
  # Memory is governed by grype (up to ~3.2Gi per large image): size
  # worker.resources.limits.memory accordingly.
  parallelism: 3
  # Per-scanner, per-image timeout.
  timeoutSeconds: 600
  # Scheduled scan interval.
  intervalHours: 6
  # Skip re-scanning a digest scanned more recently than this (unless forced).
  rescanAfterHours: 24
  # Namespaces never inventoried (kube-system IS scanned by default).
  excludedNamespaces: []
  trivy:
    # Deploys the trivy server (Deployment + PVC + Service).
    enabled: true
  # Images larger than this (GB, from the manifest) are scanned last, one at a
  # time (SCAN_MAX_IMAGE_GB); 0 disables the admission rule.
  maxImageGB: 20
  grype:
    # Grype runs inside the worker; its DB lives on the worker PVC.
    enabled: true
    # Concurrent grype processes regardless of parallelism (GRYPE_MAX_CONCURRENT);
    # each can take ~3.2Gi on a large image.
    maxConcurrent: 2
  clair:
    # Deploys Clair in combo mode. OFF by default: on grace it found 58 unique
    # findings out of 28,467 (0.2 %, none critical/high) while costing ~8 GB of
    # Postgres (independent of cluster size), 7.5 GiB memory spikes during
    # updater ingest, Postgres CPU saturation, updater egress to ~12 distro
    # feeds (blocks air-gap), and scan start gated on its first updater run.
    # Turning it on raises confidence (scanner agreement), not coverage. It gets
    # its own Postgres (clair.postgres) unless clair.postgres.dedicated=false.
    enabled: false
  # Pod watcher (EVENT_SCANS_ENABLED): targeted scans of new digests shortly
  # after a pod starts, between scheduled scans (reader ClusterRole `watch`).
  events:
    enabled: true
    debounceSeconds: 60
  mirror:
    # skopeo-copy each digest into an in-cluster registry before scanning so
    # all three scanners see identical bytes and upstreams are pulled once.
    enabled: true
    # MIRROR_MODE: registry (copy into `registry`; required by Clair) | local
    # (per-digest OCI layout on the worker PVC, scanned in place; no registry
    # needed) | off. "" = registry when Clair is enabled, else local.
    mode: ""
    # IMAGE_CACHE_MAX_BYTES: cap of the local OCI layout cache on the worker
    # PVC (persistence.worker also holds the grype DB ~3 GB and trivy client
    # cache ~1.5 GB).
    imageCacheMaxBytes: 8Gi
    registry: registry.container-registry.svc.cluster.local:5000
    # Plain-HTTP registry.
    insecure: true
    # Registry host rewrites applied to image refs before pulling (e.g. the
    # node-local alias of the in-cluster registry). Rendered as
    # MIRROR_REWRITE="src=dst,...".
    rewrite:
      "localhost:32000": registry.container-registry.svc.cluster.local:5000

# Private registry credentials (optional). Name a kubernetes.io/dockerconfigjson
# Secret in the release namespace; it is mounted into the worker at
# /etc/posture/docker/config.json (DOCKER_CONFIG / REGISTRY_AUTH_FILE point at
# it). Pod imagePullSecrets are NOT discovered (v0.1 limitation).
registryAuth:
  existingSecret: ""

# Extra CA certificates (PEM) trusted by the worker (python/httpx, cosign,
# skopeo, trivy, grype, clairctl) and Clair, e.g. an internal registry signed
# by a private CA. Secret in the release namespace; every key whose name ends
# in .crt or .pem is added. The worker appends them to the image's system
# bundle (init container -> SSL_CERT_FILE); Clair gets them via SSL_CERT_DIR
# next to the default system directories.
extraCACerts:
  secretName: ""

logLevel: info

# Scan history retention (HISTORY_RETAIN_SCANS): newest done scans whose
# per-scan rows (containers, posture results, workloads, snapshots) are kept.
history:
  retainScans: 30

# Compliance reports (DESIGN §11).
reports:
  # Where report files are written (PVC persistence.reports when persistence is
  # enabled, else an emptyDir - files are then lost on restart and reports the
  # worker generates are not downloadable from the api).
  dir: /data/reports
  retention:
    # Newest N finished reports per type (REPORTS_KEEP_PER_TYPE).
    perType: 20
    # Total bytes kept on the reports volume, oldest pruned first
    # (REPORTS_RETENTION_MAX_TOTAL_BYTES; Kubernetes quantity). Keep it below
    # persistence.reports.
    maxTotalBytes: 2Gi
  # Default for settings `reports.autoGenerate` (editable in the UI): report
  # types generated after every completed scan, cluster scope, default format
  # (poam=xlsx, stig-checklist=cklb, sar=pdf, oscal-ar=json, inventory=xlsx,
  # vuln-export=csv).
  autoGenerate: []

# =============================================================================
# Supply-chain provenance (DESIGN §12)
# =============================================================================
# Superset of nebari-dev/provenance-collector-pack: per image digest the worker
# checks cosign signatures, SBOM and SLSA provenance attestations (OCI
# referrers, BuildKit attestation manifests, cosign .sig/.att/.sbom tags) and
# newer semver tags; Helm releases come from sh.helm.release.v1 Secrets.
# Key names mirror their chart's `config:` block. Every toggle except the
# cosign key material and helmReleases.chartRepos is also editable at runtime
# (Settings page / PUT /api/v1/settings `provenance`).
provenance:
  enabled: true
  # Check cosign signatures (theirs: config.verifySignatures). Without a key or
  # keyless identity below this is an existence check (signed, not verified).
  verifySignatures: true
  # cosign public key: PEM text, or a KMS / remote URI cosign understands
  # (awskms://, gcpkms://, hashivault://, k8s://, https://). Theirs:
  # config.cosignPublicKey.
  cosignPublicKey: ""
  cosign:
    # Secret (release namespace) with key `cosign.pub`; mounted into the
    # worker and wins over cosignPublicKey.
    existingSecret: ""
    # Keyless (Fulcio/Rekor) verification; both required. Example for
    # Kubernetes release images: identity "^krel-trust@k8s-releng-prod\.iam\.gserviceaccount\.com$",
    # issuer "^https://accounts\.google\.com$".
    certificateIdentityRegexp: ""
    certificateOidcIssuerRegexp: ""
    # PROVENANCE_TRUST_SETTINGS_LOCKED: the three trust anchors above come only
    # from these values; PUT /settings may not change them (security L5).
    lockTrustSettings: true
  checkSBOM: true
  checkProvenance: true
  checkUpdates: true
  # "patch" flags every newer version, "minor" ignores patch-only bumps,
  # "major" only flags major version changes.
  updateLevel: patch
  # Ignore alpha/beta/rc tags when looking for updates.
  skipPrerelease: true
  # Ignore update candidates whose major version is more than this far above
  # the running one (CI build numbers published as tags); 0 disables the guard.
  # Candidates must also be version-like (x.y[.z], no bare integers / dates)
  # and share the current tag's variant suffix (-alpine, -py3.12, ...).
  maxMajorJump: 50
  # Reuse a digest's signature / SBOM / provenance results for this long
  # (tags are re-listed every scan).
  recheckHours: 24
  # Concurrent registry requests from the worker.
  concurrency: 8
  registryTimeoutSeconds: 30
  helmReleases:
    # Read sh.helm.release.v1.* Secrets cluster-wide. Grants get/list on EVERY
    # Secret in the cluster (RBAC cannot filter by label: CA keys, Keycloak
    # admin, OIDC client secrets, ...) to the privileged worker's
    # ServiceAccount (<fullname>-controls) only - never to the api or the scan
    # worker that parses untrusted images. Off by default; theirs:
    # config.helmEnabled. Rendering fails unless iUnderstandClusterSecretsRead
    # is also true.
    enabled: false
    iUnderstandClusterSecretsRead: false
    # Optional chart sources for the chart update check (theirs never fills
    # helmReleases[].update): classic repos (index.yaml) and/or OCI prefixes,
    # e.g. [https://charts.jetstack.io, oci://quay.io/nebari/charts].
    chartRepos: []
  compat:
    # Their Grafana dashboards read /api/reports/latest over an in-cluster
    # Service. internalService.enabled starts a second listener in the api
    # (port 8081, ONLY /api/reports*, /api/export, /healthz) behind ClusterIP
    # Service <fullname>-web-internal (or `name`). It is never routed by the
    # gateway. Callers must send `Authorization: Bearer <token>` with the token
    # from Secret <fullname>-compat-token (key `token`, generated once by a
    # hook Job, mounted at PROVENANCE_COMPAT_TOKEN_FILE); put it in the Grafana
    # Infinity datasource as a header. The NetworkPolicy admits only pods
    # matching grafanaPodSelector in allowedNamespaces. Grafana Infinity URL:
    #   http://<service>.<namespace>.svc:<port>/api/reports/latest
    internalService:
      enabled: false
      # Service name override, e.g. "provenance-collector-web" to keep an
      # existing dashboard's host name (same namespace required).
      name: ""
      port: 8080
      containerPort: 8081
      # Namespaces allowed through the NetworkPolicy (e.g. Grafana's).
      allowedNamespaces:
        - monitoring
      # Pods (in allowedNamespaces) allowed through the NetworkPolicy.
      grafanaPodSelector:
        app.kubernetes.io/name: grafana
      # Existing Secret (release namespace, key `token`) instead of the
      # generated <fullname>-compat-token.
      tokenSecret: ""
      # Rendering fails when this listener is enabled without
      # networkPolicy.enabled (any pod could then reach it) unless this is true.
      allowAnonymousNetwork: false

# =============================================================================
# Control evidence engine (DESIGN §13, docs/CONTROLS.md)
# =============================================================================
# After every completed scan (and on POST /compliance/assertions/run) the worker
# runs live NIST SP 800-53 assertions against Keycloak, the gateway, cert-manager,
# Kubernetes RBAC/PodSecurity/NetworkPolicy, Loki, Prometheus/Alertmanager and
# the registry, and derives per-control implementation status (OSCAL SSP).
controlsEngine:
  enabled: true
  # Default for settings controlsEngine.baseline: low | moderate | high.
  baseline: moderate
  # Approved privileged subjects (default for settings controlsEngine.adminSubjects):
  # Keycloak usernames holding the realm admin role, and cluster-admin binding
  # subjects as User:<name>, Group:<name> or ServiceAccount:<ns>/<name>.
  adminSubjectsAllowlist: []
  # Namespaces exempt from the per-namespace checks (PodSecurity, default-deny,
  # default ServiceAccount automount, workload least privilege).
  systemNamespaces: [kube-system, kube-public, kube-node-lease]
  keycloak:
    url: http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth
    realm: nebari
    # Realm the admin credentials belong to: "" tries `realm` first, then
    # `master` (works with a master-realm super-admin or a realm admin).
    adminRealm: ""
    clientId: admin-cli
    # Group whose members must have OTP/WebAuthn (IA-2(1)); "" = first adminGroups entry.
    adminGroup: ""
    verifyTls: true
    # Preferred: a dedicated confidential client with only the realm-management
    # view-* roles (client_credentials grant; security review M4). Secret in
    # the RELEASE namespace; with viewClient.clientId set the admin Secret below
    # is neither granted nor read.
    viewClient:
      clientId: ""          # KEYCLOAK_CLIENT_ID
      existingSecret: ""    # mounted at KEYCLOAK_CLIENT_SECRET_FILE
      secretKey: client-secret
    # Fallback (password grant): Secret with `username`/`password` (or
    # `client-id`/`client-secret`, optional `realm`). The chart grants the
    # privileged worker's ServiceAccount `get` on this one Secret via a Role in
    # its namespace; nothing else in that namespace is readable.
    adminSecret:
      name: nebari-realm-admin-credentials
      namespace: keycloak
    # Retry the admin login against the `master` realm (KEYCLOAK_ALLOW_MASTER_FALLBACK).
    allowMasterFallback: false
  # Service URLs; "" = discover Services in the cluster (loki:3100,
  # *prometheus*:9090, *alertmanager*:9093).
  lokiUrl: ""
  prometheusUrl: ""
  alertmanagerUrl: ""
  # In-cluster registry probed for anonymous access; "" = scanner.mirror.registry.
  registryUrl: ""
  # Per-assertion timeout and the gateway TLS handshake probe (TLS 1.1 must be refused).
  timeoutSeconds: 30
  tlsProbe: true

# =============================================================================
# Database
# =============================================================================
database:
  # SQLAlchemy URL scheme used to build DATABASE_URL (the api is async and
  # uses asyncpg; plain "postgresql" is normalised to asyncpg by the app).
  driver: postgresql+asyncpg
  # How long wait-for-db init containers wait for Postgres.
  waitTimeoutSeconds: 300

# Bundled Postgres (StatefulSet, plain postgres image - no Bitnami).
postgresql:
  enabled: true
  # Existing Secret with keys `password` (app user) and `postgres-password`
  # (superuser). Empty: a pre-install/pre-upgrade hook Job (Argo CD: PreSync)
  # creates <fullname>-db with random values ONLY when it does not exist and
  # never rewrites it (no Helm `lookup`, so `helm template` / Argo CD renders
  # are stable). The Secret is annotated helm.sh/resource-policy=keep and
  # argocd.argoproj.io/sync-options=Prune=false because the data directory
  # outlives the release. Under Argo CD / GitOps the recommended setup is
  # still to create the Secret yourself (sealed-secrets, external-secrets,
  # SOPS) and name it here.
  existingSecret: ""
  auth:
    username: posture
    database: posture
    # Clair's database name (on clair.postgres when dedicated, else on this server).
    clairDatabase: clair
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1536Mi }
  # postgresql.conf settings, rendered into ConfigMap <fullname>-postgres-config
  # and passed as `-c key=value` (changes roll the pod). Sized for the 1.5Gi
  # limit: shared_buffers ~25 %.
  config:
    shared_buffers: 384MB
    effective_cache_size: 1GB
    work_mem: 8MB
    maintenance_work_mem: 128MB
    max_connections: "100"
    checkpoint_completion_target: "0.9"
    wal_compression: "on"
    random_page_cost: "1.1"
  # Nightly logical backup of the posture database: `pg_dump -Fc` to PVC
  # <fullname>-backup, newest `retention` dumps kept. Clair's database is not
  # backed up (it is rebuilt from the updaters). Restore:
  #   pg_restore --clean --if-exists -d posture /backup/posture-<ts>.dump
  backup:
    enabled: true
    schedule: "17 3 * * *"
    retention: 7
    size: 5Gi
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: "1", memory: 512Mi }

# External Postgres, used when postgresql.enabled is false. Both databases
# must exist and be owned by `user` (Clair needs CREATE on its database and
# the trusted `uuid-ossp` extension).
externalDatabase:
  host: ""
  port: 5432
  user: posture
  database: posture
  clairDatabase: clair
  sslmode: require
  # Secret holding the password (required when postgresql.enabled is false).
  existingSecret: ""
  passwordKey: password

# =============================================================================
# Persistence
# =============================================================================
persistence:
  # false: use emptyDir everywhere (scanner DBs re-download on every restart).
  enabled: true
  # "" = cluster default StorageClass.
  storageClass: ""
  accessMode: ReadWriteOnce
  # Scan worker cache: grype DB (~3 GB), trivy client layers (~1.5 GB),
  # skopeo scratch, clairctl state. PVCs cannot shrink: existing installs
  # must keep their current size (set it explicitly when upgrading).
  worker: 15Gi
  # Trivy server vulnerability DB cache (~1 GB used).
  trivy: 3Gi
  postgres: 10Gi
  # Generated compliance reports (bytes; metadata is in Postgres). Mounted at
  # reports.dir in the api AND the worker (reports.autoGenerate). With
  # ReadWriteOnce the worker gets a required podAffinity to the api pod so both
  # land on the node that has the volume (unless worker.affinity is set).
  reports: 2Gi

# =============================================================================
# Components
# =============================================================================
api:
  replicas: 1
  # Report generation still runs in the api process when requested from the
  # UI; raise the limit if large on-demand reports OOM it.
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: "1", memory: 1Gi }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile: { type: RuntimeDefault }
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  # Run provenance, controls and reports in a second Deployment
  # <fullname>-worker-privileged with ServiceAccount <fullname>-controls
  # (Keycloak credentials, optional cluster-wide Secrets read), while
  # <fullname>-worker runs only inventory + CVE scanning with the
  # least-privileged <fullname>-scanner ServiceAccount (no Secrets). false: one
  # worker runs every stage with the <fullname>-controls ServiceAccount.
  splitPrivileged: true
  # Scan worker. Memory is set by grype (measured peak 3.2Gi per large image,
  # two concurrent at parallelism 3); requests near the real peak so a scan
  # does not evict other tenants' pods.
  resources:
    requests: { cpu: 500m, memory: 4Gi }
    limits: { cpu: "3", memory: 7Gi }
  # Privileged worker (splitPrivileged): registry probes, cosign, Helm
  # releases, posture snapshot, controls engine. Reports go to the
  # report-worker (or are generated here when reportWorker.enabled=false: then
  # size it like reportWorker.resources).
  privileged:
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits: { cpu: "1", memory: 1536Mi }
    # Scratch for cosign/sigstore and the CACHE_DIR temp files (emptyDir).
    cacheSizeLimit: 2Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile: { type: RuntimeDefault }
  # Extra env (list of EnvVar) appended to the worker container.
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

ui:
  replicas: 1
  # Port nginx listens on inside the container (unprivileged; also passed as
  # NGINX_PORT). The Service always exposes port 80.
  containerPort: 8080
  service:
    port: 80
  # Window title passed in /config.json.
  title: Security Posture
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile: { type: RuntimeDefault }
  # nginx writes its config/pid/cache at startup, so the root filesystem is
  # writable by default; emptyDirs below cover the usual scratch paths.
  readOnlyRootFilesystem: false
  nodeSelector: {}
  tolerations: []
  affinity: {}

trivy:
  # Measured: 89Mi idle, 0.21Gi peak.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1536Mi }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile: { type: RuntimeDefault }
  nodeSelector: {}
  tolerations: []
  affinity: {}

clair:
  # Measured peak 7.5Gi during updater ingest (OOMKilled 5x at 4Gi).
  resources:
    requests: { cpu: 250m, memory: 1536Mi }
    limits: { cpu: "2", memory: 8Gi }
  # Clair's own Postgres (StatefulSet <fullname>-clair-postgres, same image,
  # same credentials Secret). Its database reaches ~8 GB regardless of cluster
  # size. dedicated=false keeps Clair's database on the main Postgres (the
  # pre-0.2 layout; avoids re-ingesting on existing installs). Ignored with
  # postgresql.enabled=false (externalDatabase.clairDatabase is used).
  postgres:
    dedicated: true
    size: 15Gi
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "2", memory: 2Gi }
    config:
      shared_buffers: 512MB
      effective_cache_size: 1GB
      work_mem: 16MB
      maintenance_work_mem: 256MB
      max_connections: "100"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile: { type: RuntimeDefault }
  # Clair log level (debug|info|warn|error).
  logLevel: info
  # Vulnerability updater sets (Clair `updaters.sets`). `osv` is left out:
  # Clair 4.9.0 (claircore 1.5.48) panics while ingesting OSV data with a
  # malformed CVSS vector ("programmer error: invalid vector constructed"),
  # which crash-loops the combo process. Language ecosystems are still covered
  # by Trivy and Grype. Set to [] to use Clair's defaults (all sets).
  updaterSets: [alpine, aws, debian, oracle, photon, rhel, rhcc, suse, ubuntu, clair.cvss]
  nodeSelector: {}
  tolerations: []
  affinity: {}

postgres:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70        # `postgres` in the alpine image
    runAsGroup: 70
    fsGroup: 70
    seccompProfile: { type: RuntimeDefault }
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Report worker (architecture M3): generates queued reports one at a time,
# each in a child process with a timeout, and applies reports.retention. The
# api and the workers only queue. false: the worker with the `reports` stage
# generates them in-process (REPORT_WORKER_EMBEDDED).
reportWorker:
  enabled: true
  # Per-report wall clock limit (REPORT_TIMEOUT_SECONDS).
  timeoutSeconds: 1200
  # process (child per report, killable, memory returned) | inline
  isolation: process
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 3Gi }
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Container-level security context applied to every container.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# One ServiceAccount per privilege level (security C1 / architecture B4):
#   api      <fullname>-api       no RBAC, token not mounted (api, ui pods)
#   scanner  <fullname>-scanner   read pods/namespaces/workloads/netpols/NebariApps; NO Secrets
#   controls <fullname>-controls  privileged worker: controls engine ClusterRole,
#                                 the Keycloak Secret Role, and cluster-wide
#                                 Secrets read only with provenance.helmReleases
serviceAccount:
  create: true
  # Name overrides ("" = <fullname>-<role>). With create=false they must exist.
  names:
    api: ""
    scanner: ""
    controls: ""
  annotations: {}

rbac:
  # ClusterRoles/Roles and their bindings for the ServiceAccounts above.
  create: true

# Helm hook Jobs (pre-install/pre-upgrade; Argo CD maps both to PreSync):
#   weight -5  ensure-secrets: create <fullname>-db / <fullname>-compat-token if missing
#   weight  0  migrate: alembic upgrade head under pg_advisory_lock, before
#              new pods start on an upgrade (skipped when the DB is unreachable,
#              e.g. the first Argo CD sync; the api init container migrates then)
# They run the api image. ServiceAccount <fullname>-hooks may create Secrets
# in the release namespace and get/patch only the two names above.
hooks:
  migrate:
    enabled: true
    # Seconds to wait for the database before skipping.
    dbWaitSeconds: 120
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# =============================================================================
# NetworkPolicy
# =============================================================================
# Ingress: api <- ui, workers | postgres <- api, workers, migrate, backup |
# trivy, clair <- worker | clair-postgres <- clair | ui <- gatewayNamespaces +
# uiAllowedNamespaces. Egress is restricted only for the workers (workerEgress).
networkPolicy:
  enabled: true
  # Namespace(s) running the Envoy Gateway data plane.
  gatewayNamespaces:
    - envoy-gateway-system
  # Extra namespaces allowed to reach the ui directly (e.g. the landing-page
  # health prober).
  uiAllowedNamespaces: []
  # Worker egress (both workers; they parse untrusted images and hold the
  # most credentials). Allowed: DNS; this release's pods; every pod in
  # allowedNamespaces (Keycloak, Loki, Prometheus, in-cluster registry); TCP
  # `ports` to any address outside exceptCidrs (registries, vulnerability DB
  # feeds, the Kubernetes API). Everything else is denied. Add your pod and
  # service CIDRs to exceptCidrs to also block in-cluster targets on those
  # ports (keep the API server reachable).
  workerEgress:
    enabled: true
    allowedNamespaces: [keycloak, monitoring, observability, container-registry]
    # 443/80: registries + feeds; 6443: Kubernetes API on most distributions.
    ports: [443, 80, 6443]
    exceptCidrs:
      - 169.254.0.0/16   # link-local / cloud metadata
    # Extra NetworkPolicyEgressRule entries appended verbatim (e.g. IPv6
    # ipBlocks, a registry on a non-standard port).
    extraRules: []

# =============================================================================
# Nebari Integration
# =============================================================================
# NebariApp CR rendered through the nebari-app library chart. String values
# containing "{{" are tpl-expanded and MUST render to valid JSON (hence the
# `| toJson`). Requires the namespace label nebari.dev/managed=true.
nebariapp:
  enabled: false
  hostname: '{{ fail "nebariapp.hostname is required when nebariapp.enabled is true" }}'
  # The operator validates that this Service exists; it is the ui Service.
  service:
    name: '{{ printf "%s-ui" (include "security-posture.fullname" .) | toJson }}'
    port: '{{ .Values.ui.service.port }}'
  routing:
    # Required: without routes the operator creates no HTTPRoute.
    routes:
      - pathPrefix: /
        pathType: PathPrefix
    publicRoutes:
      - pathPrefix: /healthz
        pathType: Exact
      # Landing-page tile icon must load for any signed-in user.
      - pathPrefix: /icon.svg
        pathType: Exact
    tls:
      enabled: true
  auth:
    enabled: true
    provider: keycloak
    provisionClient: true
    # Gateway OIDC enforcement; turned off automatically when the chart
    # renders its own SecurityPolicy (adminGate.securityPolicy.enabled).
    enforceAtGateway: '{{ not .Values.adminGate.securityPolicy.enabled | toJson }}'
    # Only valid together with enforceAtGateway (operator validation).
    forwardAccessToken: '{{ not .Values.adminGate.securityPolicy.enabled | toJson }}'
    # Must be a real callback path (Envoy rejects "/").
    redirectURI: /oauth2/callback
    scopes:
      - openid
      - profile
      - email
      - groups
    # Grace's operator enforces these at the gateway; upstream alpha.20 uses
    # them for landing-page visibility only.
    groups: '{{ .Values.adminGroups | toJson }}'
  gateway: public
  landingPage:
    enabled: true
    displayName: Security Posture
    description: Container vulnerability & configuration posture across the cluster
    icon: '{{ printf "https://%s/icon.svg" (tpl .Values.nebariapp.hostname . | trimAll "\"") | toJson }}'
    category: Platform
    priority: 20
    healthCheck:
      enabled: true
      path: /healthz
      intervalSeconds: 30
      timeoutSeconds: 5

# =============================================================================
# Overrides
# =============================================================================
nameOverride: ""
fullnameOverride: ""
