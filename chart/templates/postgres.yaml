{{/*
  postgres - bundled single-instance Postgres (plain postgres image, no
  Bitnami). Superuser `postgres` (key postgres-password) owns the cluster;
  the init script creates the app role (key password) and the databases it
  owns.

  Credentials: Secret <fullname>-db, created once by the ensure-secrets hook
  Job (hooks.yaml) or supplied as postgresql.existingSecret. The init script
  only runs on an empty data directory, so the Secret must never rotate.

  Tuning: postgresql.config -> ConfigMap <name>-config (one `key = value` per
  line) -> `postgres -c key=value` at start; a checksum rolls the pod.

  clair-postgres - the same template for Clair's own server
  (clair.postgres.dedicated), database clairDatabase only.
*/}}
{{- define "security-posture.postgres.server" -}}
{{- $ctx := .ctx }}
{{- $component := .component }}
{{- $name := include "security-posture.componentName" (dict "ctx" $ctx "component" $component) }}
{{- $secretName := include "security-posture.db.secretName" $ctx }}
{{- $conf := "" }}
{{- range $k, $v := .config }}
{{- $conf = printf "%s%s = %v\n" $conf $k $v }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-init
  namespace: {{ $ctx.Release.Namespace }}
  labels:
    {{- include "security-posture.componentLabels" (dict "ctx" $ctx "component" $component) | nindent 4 }}
data:
  10-posture.sh: |
    #!/bin/sh
    # Runs once, on an empty data directory, as the postgres superuser.
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
      -v app_user="$APP_DB_USER" -v app_password="$APP_DB_PASSWORD" <<'SQL'
    CREATE ROLE :"app_user" LOGIN PASSWORD :'app_password';
    SQL
    for db in $APP_DATABASES; do
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
        -c "CREATE DATABASE \"$db\" OWNER \"$APP_DB_USER\""
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$db" \
        -c "GRANT ALL ON SCHEMA public TO \"$APP_DB_USER\""
    done
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ $ctx.Release.Namespace }}
  labels:
    {{- include "security-posture.componentLabels" (dict "ctx" $ctx "component" $component) | nindent 4 }}
data:
  tuning.conf: |
    {{- $conf | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $ctx.Release.Namespace }}
  labels:
    {{- include "security-posture.componentLabels" (dict "ctx" $ctx "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "security-posture.componentSelectorLabels" (dict "ctx" $ctx "component" $component) | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-headless
  namespace: {{ $ctx.Release.Namespace }}
  labels:
    {{- include "security-posture.componentLabels" (dict "ctx" $ctx "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "security-posture.componentSelectorLabels" (dict "ctx" $ctx "component" $component) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ $ctx.Release.Namespace }}
  labels:
    {{- include "security-posture.componentLabels" (dict "ctx" $ctx "component" $component) | nindent 4 }}
spec:
  serviceName: {{ $name }}-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "security-posture.componentSelectorLabels" (dict "ctx" $ctx "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "security-posture.componentSelectorLabels" (dict "ctx" $ctx "component" $component) | nindent 8 }}
      annotations:
        checksum/config: {{ $conf | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- toYaml $ctx.Values.postgres.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: {{ include "security-posture.image" $ctx.Values.images.postgres | quote }}
          imagePullPolicy: {{ $ctx.Values.images.postgres.pullPolicy }}
          # tuning.conf lines -> `-c key=value` arguments
          command:
            - sh
            - -c
            - |
              set --
              while IFS= read -r line; do
                case "$line" in ''|'#'*) continue ;; esac
                key=$(printf '%s' "${line%%=*}" | tr -d ' ')
                val=$(printf '%s' "${line#*=}" | sed 's/^ *//')
                set -- "$@" -c "$key=$val"
              done < /etc/posture/postgres/tuning.conf
              exec docker-entrypoint.sh postgres "$@"
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: postgres-password
            - name: APP_DB_USER
              value: {{ $ctx.Values.postgresql.auth.username | quote }}
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: password
            - name: APP_DATABASES
              value: {{ join " " .databases | quote }}
            # Subdirectory: initdb needs an empty dir it owns, and a volume
            # root may contain lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            {{- toYaml $ctx.Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: config
              mountPath: /etc/posture/postgres
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            # parallel query workers use POSIX shared memory (64Mi default in containers)
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: init
          configMap:
            name: {{ $name }}-init
        - name: config
          configMap:
            name: {{ $name }}-config
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        {{- if not $ctx.Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with $ctx.Values.postgres.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ctx.Values.postgres.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ctx.Values.postgres.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $ctx.Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "security-posture.componentSelectorLabels" (dict "ctx" $ctx "component" $component) | nindent 10 }}
      spec:
        accessModes:
          - {{ $ctx.Values.persistence.accessMode }}
        {{- with $ctx.Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .size }}
  {{- end }}
{{- end }}
{{- if .Values.postgresql.enabled }}
{{- /* The main server also creates Clair's database (harmless when unused) so
       clair.postgres.dedicated=false works on a fresh install. */}}
{{ include "security-posture.postgres.server" (dict "ctx" . "component" "postgres"
     "databases" (list .Values.postgresql.auth.database .Values.postgresql.auth.clairDatabase | uniq)
     "config" .Values.postgresql.config "resources" .Values.postgresql.resources
     "size" .Values.persistence.postgres) }}
{{- if include "security-posture.db.clairDedicated" . }}
---
{{ include "security-posture.postgres.server" (dict "ctx" . "component" "clair-postgres"
     "databases" (list .Values.postgresql.auth.clairDatabase)
     "config" .Values.clair.postgres.config "resources" .Values.clair.postgres.resources
     "size" .Values.clair.postgres.size) }}
{{- end }}
{{- end }}
