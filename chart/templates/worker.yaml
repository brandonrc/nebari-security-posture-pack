{{/*
  Workers (DESIGN §4; same image, same DB queue, `python -m posture.worker`).

  worker.splitPrivileged=true (default):
    <fullname>-worker             --stages inventory,scan
                                  SA <fullname>-scanner (no Secrets). Inventory,
                                  mirror, trivy client, grype, clairctl; owns the
                                  /cache PVC and the scan scheduler. Marks scans
                                  `scanned`.
    <fullname>-worker-privileged  --stages provenance,controls,reports
                                  SA <fullname>-controls. Claims `scanned` scans:
                                  provenance (registry probes, cosign, Helm
                                  releases), posture snapshot -> `done`, then the
                                  controls engine; queues auto-generated reports
                                  for <fullname>-report-worker (report-worker.yaml).
                                  Without reportWorker.enabled it generates them
                                  itself (reports PVC, co-located with the api).
  worker.splitPrivileged=false: one <fullname>-worker runs every stage with
  SA <fullname>-controls.

  Exactly one replica each, Recreate (RWO volumes; Postgres-as-queue).
  Probes: the worker's health server on :9000/healthz (port `metrics`, which
  also serves /metrics for the PodMonitor in monitoring.yaml) (503 when the main loop
  has not beaten for max(600 s, 3 x scan timeout)).
*/}}
{{- /*
  VEX (posture.vex): the pack's statements ship in the image at /etc/posture/vex
  (VEX_BUILTIN_DIR); scanner.vex.existingConfigMap and scanner.vex.extraVex are
  mounted under /etc/posture/vex.d/ and listed in VEX_DIR. The worker re-reads
  changed files before each image, so a ConfigMap edit needs no restart.
*/}}
{{- define "security-posture.vex.env" -}}
- name: VEX_ENABLED
  value: {{ .Values.scanner.vex.enabled | quote }}
- name: VEX_SCANNER_FLAGS
  value: {{ .Values.scanner.vex.scannerFlags | quote }}
{{- $dirs := list }}
{{- if .Values.scanner.vex.existingConfigMap }}{{ $dirs = append $dirs "/etc/posture/vex.d/existing" }}{{ end }}
{{- if .Values.scanner.vex.extraVex }}{{ $dirs = append $dirs "/etc/posture/vex.d/extra" }}{{ end }}
- name: VEX_DIR
  value: {{ join "," $dirs | quote }}
{{- end }}
{{- define "security-posture.worker.deployment" -}}
{{- $ctx := .ctx }}
{{- $component := .component }}
{{- $scan := .scan }}
{{- $final := .final }}
{{- /* without a report-worker Deployment the reports stage generates in-process (embedded) */}}
{{- $reportsHere := and $final (not $ctx.Values.reportWorker.enabled) }}
{{- $name := include "security-posture.componentName" (dict "ctx" $ctx "component" $component) }}
{{- with $ctx }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "security-posture.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "security-posture.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "security-posture.componentSelectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "security-posture.saName" (dict "ctx" . "role" $.sa) }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "security-posture.waitForDb" . | nindent 8 }}
        {{- include "security-posture.caBundle.init" (dict "ctx" . "image" .Values.images.worker) | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "security-posture.image" .Values.images.worker | quote }}
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}
          command: ["python", "-m", "posture.worker", "--stages", {{ $.stages | quote }}]
          env:
            {{- include "security-posture.commonEnv" . | nindent 12 }}
            - name: CACHE_DIR
              value: /cache
            - name: WORKER_HEALTH_PORT
              value: "9000"
            - name: REPORT_WORKER_EMBEDDED
              value: {{ ternary "true" "false" $reportsHere | quote }}
            {{- if $reportsHere }}
            - name: REPORT_TIMEOUT_SECONDS
              value: {{ .Values.reportWorker.timeoutSeconds | quote }}
            {{- include "security-posture.reportLeaseEnv" . | nindent 12 }}
            {{- end }}
            {{- if $scan }}
            # grype runs in-process; DB on the PVC, refreshed by the worker's
            # schedule rather than on every invocation.
            - name: GRYPE_DB_CACHE_DIR
              value: /cache/grype
            - name: GRYPE_DB_AUTO_UPDATE
              value: "false"
            - name: GRYPE_REGISTRY_INSECURE_USE_HTTP
              value: {{ .Values.scanner.mirror.insecure | quote }}
            - name: TRIVY_CACHE_DIR
              value: /cache/trivy-client
            - name: TRIVY_INSECURE
              value: {{ .Values.scanner.mirror.insecure | quote }}
            - name: GRYPE_MAX_CONCURRENT
              value: {{ .Values.scanner.grype.maxConcurrent | quote }}
            - name: SCAN_MAX_IMAGE_GB
              value: {{ .Values.scanner.maxImageGB | quote }}
            - name: MIRROR_MODE
              value: {{ .Values.scanner.mirror.mode | default (ternary "registry" "local" .Values.scanner.clair.enabled) | quote }}
            - name: IMAGE_CACHE_MAX_BYTES
              value: {{ .Values.scanner.mirror.imageCacheMaxBytes | quote }}
            {{- with .Values.scanner.rawMaxGzBytes }}
            - name: RAW_MAX_GZ_BYTES
              value: {{ . | quote }}
            {{- end }}
            - name: EVENT_SCANS_ENABLED
              value: {{ .Values.scanner.events.enabled | quote }}
            - name: EVENT_SCANS_DEBOUNCE_SECONDS
              value: {{ .Values.scanner.events.debounceSeconds | quote }}
            - name: EVENT_SCANS_MIN_POD_AGE_SECONDS
              value: {{ .Values.scanner.events.minPodAgeSeconds | quote }}
            - name: EVENT_SCANS_INCLUDE_JOBS
              value: {{ .Values.scanner.events.includeJobs | quote }}
            {{- include "security-posture.vex.env" . | nindent 12 }}
            {{- end }}
            {{- if .Values.registryAuth.existingSecret }}
            - name: DOCKER_CONFIG
              value: /etc/posture/docker
            - name: REGISTRY_AUTH_FILE
              value: /etc/posture/docker/config.json
            {{- end }}
            {{- include "security-posture.caBundle.env" . | nindent 12 }}
            {{- include "security-posture.provenanceEnv" . | nindent 12 }}
            {{- include "security-posture.controlsEnv" . | nindent 12 }}
            {{- if $final }}
            {{- include "security-posture.keycloakClientEnv" . | nindent 12 }}
            {{- end }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            # /healthz (probes) and /metrics (monitoring.enabled PodMonitor)
            - name: metrics
              containerPort: 9000
              protocol: TCP
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml $.resources | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
            {{- if $reportsHere }}
            - name: reports
              mountPath: {{ .Values.reports.dir }}
            {{- end }}
            {{- if .Values.registryAuth.existingSecret }}
            - name: registry-auth
              mountPath: /etc/posture/docker
              readOnly: true
            {{- end }}
            {{- if and $scan .Values.scanner.vex.enabled .Values.scanner.vex.existingConfigMap }}
            - name: vex-existing
              mountPath: /etc/posture/vex.d/existing
              readOnly: true
            {{- end }}
            {{- if and $scan .Values.scanner.vex.enabled .Values.scanner.vex.extraVex }}
            - name: vex-extra
              mountPath: /etc/posture/vex.d/extra
              readOnly: true
            {{- end }}
            {{- if and $final .Values.provenance.cosign.existingSecret }}
            - name: cosign-key
              mountPath: /etc/posture/cosign
              readOnly: true
            {{- end }}
            {{- if and $final .Values.controlsEngine.enabled .Values.controlsEngine.keycloak.viewClient.existingSecret }}
            - name: keycloak-client
              mountPath: /etc/posture/keycloak
              readOnly: true
            {{- end }}
            {{- include "security-posture.caBundle.mount" . | nindent 12 }}
      volumes:
        - name: cache
          {{- if and $scan .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "security-posture.componentName" (dict "ctx" . "component" "worker") }}-cache
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.worker.privileged.cacheSizeLimit }}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if $reportsHere }}
        {{- include "security-posture.reportsVolume" . | nindent 8 }}
        {{- end }}
        {{- if .Values.registryAuth.existingSecret }}
        - name: registry-auth
          secret:
            secretName: {{ .Values.registryAuth.existingSecret }}
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
        {{- if and $scan .Values.scanner.vex.enabled .Values.scanner.vex.existingConfigMap }}
        - name: vex-existing
          configMap:
            name: {{ .Values.scanner.vex.existingConfigMap }}
        {{- end }}
        {{- if and $scan .Values.scanner.vex.enabled .Values.scanner.vex.extraVex }}
        - name: vex-extra
          configMap:
            name: {{ include "security-posture.componentName" (dict "ctx" . "component" "vex") }}
        {{- end }}
        {{- if and $final .Values.provenance.cosign.existingSecret }}
        - name: cosign-key
          secret:
            secretName: {{ .Values.provenance.cosign.existingSecret }}
            items:
              - key: cosign.pub
                path: cosign.pub
        {{- end }}
        {{- if and $final .Values.controlsEngine.enabled .Values.controlsEngine.keycloak.viewClient.existingSecret }}
        - name: keycloak-client
          secret:
            secretName: {{ .Values.controlsEngine.keycloak.viewClient.existingSecret }}
            items:
              - key: {{ .Values.controlsEngine.keycloak.viewClient.secretKey | default "client-secret" }}
                path: client-secret
        {{- end }}
        {{- include "security-posture.caBundle.volumes" . | nindent 8 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.worker.affinity }}
      affinity:
        {{- toYaml .Values.worker.affinity | nindent 8 }}
      {{- else if and $reportsHere .Values.persistence.enabled (eq .Values.persistence.accessMode "ReadWriteOnce") }}
      # Shares the ReadWriteOnce reports PVC with the api: same node.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "security-posture.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 18 }}
      {{- end }}
{{- end }}
{{- end }}
{{- if .Values.worker.splitPrivileged }}
{{ include "security-posture.worker.deployment" (dict "ctx" . "component" "worker" "sa" "scanner"
     "stages" "inventory,scan" "scan" true "final" false "resources" .Values.worker.resources) }}
---
{{ include "security-posture.worker.deployment" (dict "ctx" . "component" "worker-privileged" "sa" "controls"
     "stages" "provenance,controls,reports" "scan" false "final" true
     "resources" .Values.worker.privileged.resources) }}
{{- else }}
{{ include "security-posture.worker.deployment" (dict "ctx" . "component" "worker" "sa" "controls"
     "stages" "all" "scan" true "final" true "resources" .Values.worker.resources) }}
{{- end }}
{{- if and .Values.scanner.vex.enabled .Values.scanner.vex.extraVex }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "security-posture.componentName" (dict "ctx" . "component" "vex") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "security-posture.componentLabels" (dict "ctx" . "component" "vex") | nindent 4 }}
data:
  {{- range $name, $doc := .Values.scanner.vex.extraVex }}
  {{ ternary $name (printf "%s.json" $name) (hasSuffix ".json" $name) }}: {{ ternary $doc (toJson $doc) (kindIs "string" $doc) | quote }}
  {{- end }}
{{- end }}
