{{/*
  worker - inventory + mirror + scan (trivy client, grype, clairctl) +
  scheduler. Exactly one replica (APScheduler + Postgres-as-queue), Recreate
  because the /cache PVC is ReadWriteOnce.
*/}}
{{- $name := include "security-posture.componentName" (dict "ctx" . "component" "worker") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "security-posture.componentLabels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "security-posture.componentSelectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "security-posture.componentSelectorLabels" (dict "ctx" . "component" "worker") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "security-posture.serviceAccountName" . }}
      # Inventories the cluster through the read-only ClusterRole.
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "security-posture.waitForDb" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "security-posture.image" .Values.images.worker | quote }}
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}
          command: ["python", "-m", "posture.worker"]
          env:
            {{- include "security-posture.commonEnv" . | nindent 12 }}
            - name: CACHE_DIR
              value: /cache
            # grype runs in-process; DB on the PVC, refreshed by the worker's
            # schedule rather than on every invocation.
            - name: GRYPE_DB_CACHE_DIR
              value: /cache/grype
            - name: GRYPE_DB_AUTO_UPDATE
              value: "false"
            - name: GRYPE_REGISTRY_INSECURE_USE_HTTP
              value: {{ .Values.scanner.mirror.insecure | quote }}
            - name: TRIVY_CACHE_DIR
              value: /cache/trivy-client
            - name: TRIVY_INSECURE
              value: {{ .Values.scanner.mirror.insecure | quote }}
            {{- if .Values.registryAuth.existingSecret }}
            - name: DOCKER_CONFIG
              value: /etc/posture/docker
            - name: REGISTRY_AUTH_FILE
              value: /etc/posture/docker/config.json
            {{- end }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
            {{- if .Values.registryAuth.existingSecret }}
            - name: registry-auth
              mountPath: /etc/posture/docker
              readOnly: true
            {{- end }}
      volumes:
        - name: cache
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}-cache
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.registryAuth.existingSecret }}
        - name: registry-auth
          secret:
            secretName: {{ .Values.registryAuth.existingSecret }}
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
