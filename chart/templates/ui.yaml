{{/*
  ui - nginx serving the static SPA; the only ingress target (NebariApp ->
  Service :80). The image's nginx config proxies /api/ to $API_UPSTREAM and
  serves a static /healthz. /config.json is overlaid from the ConfigMap below.
*/}}
{{- $name := include "security-posture.componentName" (dict "ctx" . "component" "ui") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "security-posture.componentLabels" (dict "ctx" . "component" "ui") | nindent 4 }}
data:
  config.json: |
    {{- dict "apiBase" "/api/v1" "title" .Values.ui.title | toPrettyJson | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "security-posture.componentLabels" (dict "ctx" . "component" "ui") | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      {{- include "security-posture.componentSelectorLabels" (dict "ctx" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "security-posture.componentSelectorLabels" (dict "ctx" . "component" "ui") | nindent 8 }}
      annotations:
        # subPath mounts do not see ConfigMap updates; roll the pod instead.
        checksum/config: {{ dict "apiBase" "/api/v1" "title" .Values.ui.title | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.ui.podSecurityContext | nindent 8 }}
      containers:
        - name: ui
          image: {{ include "security-posture.image" .Values.images.ui | quote }}
          imagePullPolicy: {{ .Values.images.ui.pullPolicy }}
          env:
            - name: API_UPSTREAM
              value: {{ include "security-posture.apiUrl" . | quote }}
            - name: NGINX_PORT
              value: {{ .Values.ui.containerPort | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.containerPort }}
              protocol: TCP
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          securityContext:
            {{- toYaml (merge (dict "readOnlyRootFilesystem" .Values.ui.readOnlyRootFilesystem) (deepCopy .Values.containerSecurityContext)) | nindent 12 }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config
        - name: nginx-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "security-posture.componentLabels" (dict "ctx" . "component" "ui") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "security-posture.componentSelectorLabels" (dict "ctx" . "component" "ui") | nindent 4 }}
