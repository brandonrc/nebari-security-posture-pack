{{/*
  api - FastAPI (:8000). ServiceAccount <fullname>-api with no RBAC and no
  mounted token: the api never calls the Kubernetes API (B4).
  Migrations: the pre-upgrade hook Job (hooks.yaml) migrates before new pods
  start on an upgrade; the `migrate` init container covers the first install
  (and is a no-op afterwards). Both take pg_advisory_lock in alembic/env.py.
  Strategy stays Recreate while the RWO reports PVC is mounted here.
*/}}
{{- $name := include "security-posture.componentName" (dict "ctx" . "component" "api") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "security-posture.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  {{- if .Values.persistence.enabled }}
  # The reports PVC is ReadWriteOnce by default.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "security-posture.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "security-posture.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "security-posture.saName" (dict "ctx" . "role" "api") }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "security-posture.waitForDb" . | nindent 8 }}
        {{- include "security-posture.caBundle.init" (dict "ctx" . "image" .Values.images.api) | nindent 8 }}
        - name: migrate
          image: {{ include "security-posture.image" .Values.images.api | quote }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["python", "-m", "posture.migrate"]
          env:
            {{- include "security-posture.commonEnv" . | nindent 12 }}
            - name: CACHE_DIR
              value: /tmp
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: {{ include "security-posture.image" .Values.images.api | quote }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["uvicorn", "posture.main:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            {{- include "security-posture.commonEnv" . | nindent 12 }}
            - name: CACHE_DIR
              value: /tmp
            {{- include "security-posture.caBundle.env" . | nindent 12 }}
            {{- include "security-posture.provenanceEnv" . | nindent 12 }}
            {{- include "security-posture.controlsEnv" . | nindent 12 }}
            {{- if include "security-posture.compatEnabled" . }}
            - name: PROVENANCE_COMPAT_INTERNAL_PORT
              value: {{ .Values.provenance.compat.internalService.containerPort | quote }}
            - name: PROVENANCE_COMPAT_TOKEN_FILE
              value: /etc/posture/compat/token
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            {{- if include "security-posture.compatEnabled" . }}
            # bearer-token read-only provenance-collector-pack API (Grafana); see provenance-internal-service.yaml
            - name: compat
              containerPort: {{ .Values.provenance.compat.internalService.containerPort }}
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/v1/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: reports
              mountPath: {{ .Values.reports.dir }}
            {{- include "security-posture.caBundle.mount" . | nindent 12 }}
            {{- if include "security-posture.compatEnabled" . }}
            - name: compat-token
              mountPath: /etc/posture/compat
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "security-posture.reportsVolume" . | nindent 8 }}
        {{- include "security-posture.caBundle.volumes" . | nindent 8 }}
        {{- if include "security-posture.compatEnabled" . }}
        - name: compat-token
          secret:
            secretName: {{ include "security-posture.compatTokenSecret" . }}
            items:
              - key: token
                path: token
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "security-posture.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    {{- include "security-posture.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
