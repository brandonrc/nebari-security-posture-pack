{{/*
  provenance-collector-pack compatibility (DESIGN §12): their Grafana dashboards
  (Infinity datasource) read /api/reports/latest from an in-cluster Service.
  This Service targets the api's second listener (port `compat`,
  PROVENANCE_COMPAT_INTERNAL_PORT) which serves ONLY the read-only endpoints
  /api/reports, /api/reports/{filename}, /api/export and /healthz, behind a
  static bearer token (Secret <fullname>-compat-token, key `token`, created
  once by the ensure-secrets hook Job; PROVENANCE_COMPAT_TOKEN_FILE). It is a
  ClusterIP Service that the NebariApp / gateway never routes; the
  NetworkPolicy below admits only Grafana pods (grafanaPodSelector) in
  allowedNamespaces (security review H2). Rendering fails without
  networkPolicy.enabled unless allowAnonymousNetwork (rbac.yaml validate).
  Grafana URL: http://<this service>.<namespace>.svc:<port>/api/reports/latest
*/}}
{{- if include "security-posture.compatEnabled" . }}
{{- $svc := .Values.provenance.compat.internalService }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "security-posture.provenanceInternalServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "security-posture.componentLabels" (dict "ctx" . "component" "web-internal") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: compat
      protocol: TCP
  selector:
    {{- include "security-posture.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "security-posture.componentName" (dict "ctx" . "component" "api") }}-compat
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "security-posture.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "security-posture.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        # namespaceSelector AND podSelector in one peer: Grafana pods in those namespaces only
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  {{- toYaml (required "provenance.compat.internalService.allowedNamespaces must not be empty" (default nil $svc.allowedNamespaces)) | nindent 18 }}
          podSelector:
            matchLabels:
              {{- toYaml (required "provenance.compat.internalService.grafanaPodSelector must not be empty" (default nil $svc.grafanaPodSelector)) | nindent 14 }}
      ports:
        - port: {{ $svc.containerPort }}
          protocol: TCP
{{- end }}
{{- end }}
