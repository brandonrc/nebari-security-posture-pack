# Grace (single-node MicroK8s) overrides for nebari-security-posture-pack.
# Used by deploy/grace/deploy.sh, which also --set's the image tags to the
# tag produced by build-push.sh.

images:
  api:
    repository: localhost:32000/security-posture-api
    tag: dev
    pullPolicy: Always
  worker:
    repository: localhost:32000/security-posture-worker
    tag: dev
    pullPolicy: Always
  ui:
    repository: localhost:32000/security-posture-ui
    tag: dev
    pullPolicy: Always

# Exists in grace's `nebari` realm; grace's operator emits groups without
# the leading "/".
adminGroups:
  - admin

auth:
  mode: oidc
  jwksUrl: http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/nebari/protocol/openid-connect/certs
  issuers:
    - https://grace.possum-fujita.ts.net:8443/auth/realms/nebari
    - http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/nebari
    - http://keycloak.100-89-230-107.sslip.io/auth/realms/nebari

scanner:
  # grace has 40 cores and is mostly idle.
  parallelism: 6
  # Clair stays on here (chart default is off): grace's Clair database is
  # already ingested on the main Postgres (clair.postgres.dedicated=false).
  clair:
    enabled: true
  mirror:
    enabled: true
    registry: registry.container-registry.svc.cluster.local:5000
    insecure: true
    rewrite:
      "localhost:32000": registry.container-registry.svc.cluster.local:5000
  # SCAP scanner (DESIGN §14): <fullname>-scap-worker. Validated on this host
  # (2026-10-05) against posture images: Debian 12 (ssg-debian12 CIS L1),
  # distroless coredns (Debian 12 via status.d), UBI 9 keycloak (RHEL 9 STIG),
  # Alpine (notApplicable), postgres:16-alpine (PostgreSQL manual STIG).
  scap:
    enabled: true
    # SSG over DISA for the same OS: the DISA RHEL 9 SCAP benchmark has no
    # container applicability, so host-only rules (services, kernel, boot,
    # audit) fail inside images (UBI 9 keycloak: 253 fail / 68 pass), while
    # SSG's STIG profile marks them not applicable (14 fail / 67 pass). DISA
    # content stays the source for products SSG does not cover (PostgreSQL).
    preferDisa: false
    content:
      # The pinned SSG 0.1.82 release, limited to the OS families on grace
      # (Debian/Ubuntu/RHEL; SSG has no Alpine content - Alpine images are
      # reported notApplicable).
      sources:
        - name: ssg
          kind: ssg
          url: https://github.com/ComplianceAsCode/content/releases/download/v0.1.82/scap-security-guide-0.1.82.zip
          sha256: 765e84bdce7f9055f9b9c2dd0ee2b713d4255f8eec94eac6d35ea4973c28919c
          include: [ssg-debian11-ds.xml, ssg-debian12-ds.xml, ssg-debian13-ds.xml, ssg-ubuntu2204-ds.xml,
                    ssg-ubuntu2404-ds.xml, ssg-rhel8-ds.xml, ssg-rhel9-ds.xml, ssg-rhel10-ds.xml]
    disa:
      # Reachable from grace (dl.dod.cyber.mil, no CAC); sha256 of the zips
      # as downloaded 2026-10-05.
      urls:
        - name: disa-rhel9
          url: https://dl.dod.cyber.mil/wp-content/uploads/stigs/zip/U_RHEL_9_V2R9_STIG_SCAP_1-3_Benchmark.zip
          sha256: 95290f60a213136b728013351b1e41c97caea474443878175332ba5874d12bf8
        # Manual STIG (XCCDF without OVAL checks): every rule notchecked; it
        # yields complete PostgreSQL checklists for review, no score.
        - name: disa-postgresql
          url: https://dl.dod.cyber.mil/wp-content/uploads/stigs/zip/U_PGS_SQL_9-x_V2R5_STIG.zip
          sha256: 4088023d34ba6aedee1ad7eb77b9625c5a89ce2eb5bfd8c0b13cb78a6434401d
          include: ["U_PGS_SQL_9-x_STIG_*Manual-xccdf.xml"]

# grype/trivy/skopeo on multi-GB images (ray, jupyter); 6Gi OOMKilled the
# worker at parallelism 6 (peak 7.3Gi). grace's memory requests are ~99%
# allocated: requests stay below the chart defaults here.
worker:
  splitPrivileged: true
  resources:
    requests: { cpu: "1", memory: 1Gi }
    limits: { cpu: "8", memory: 16Gi }
  privileged:
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "2", memory: 2Gi }

# Reports (all six auto-generated after each scan; OSCAL AR ~87 MB built in
# memory) run in the report-worker, one at a time.
reportWorker:
  enabled: true
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "2", memory: 4Gi }

# The api only queues reports now (it serves the downloads).
api:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "2", memory: 2Gi }

# Clair OOMKilled at 4Gi while its updaters ingested RHEL/Debian data and the
# indexer unpacked large images concurrently (peak 7.5Gi).
clair:
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "4", memory: 8Gi }
  postgres:
    # Keep Clair's ~8 GB database on the main Postgres (no re-ingest).
    dedicated: false

trivy:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1536Mi }

# Shared with Clair here: 2 cores were saturated during Clair's updater ingest.
postgresql:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "2", memory: 2Gi }
  config:
    shared_buffers: 512MB
    effective_cache_size: 1536MB
    work_mem: 8MB
    maintenance_work_mem: 256MB
    max_connections: "100"
    checkpoint_completion_target: "0.9"
    wal_compression: "on"
    random_page_cost: "1.1"

persistence:
  storageClass: microk8s-hostpath
  # PVCs cannot shrink: keep the sizes grace was installed with.
  worker: 20Gi
  trivy: 10Gi

# kube-prometheus-stack (release kube-prom-stack) in `observability` selects
# monitors and rules by `release: kube-prom-stack`, in every namespace.
monitoring:
  enabled: true
  namespace: observability
  podSelector:
    app.kubernetes.io/name: prometheus
  labels:
    release: kube-prom-stack
  rules:
    enabled: true

networkPolicy:
  enabled: true
  gatewayNamespaces:
    - envoy-gateway-system
  # Landing-page health prober / operator, which call the ui directly.
  uiAllowedNamespaces:
    - nebari-landing
    - nebari-operator-system
  workerEgress:
    enabled: true
    # + envoy-gateway-system: the controls engine's TLS probe of the gateway
    allowedNamespaces: [keycloak, monitoring, observability, container-registry, envoy-gateway-system]
    # 16443: MicroK8s API server (the `kubernetes` Service DNATs to it);
    # 8443: the tailscale-served Keycloak/gateway.
    ports: [443, 80, 6443, 16443, 8443]

# Grace's operator enforces auth.groups at the gateway, so the chart's own
# SecurityPolicy stays off here (layer 1 + layer 3).
adminGate:
  securityPolicy:
    enabled: false
    externalIssuer: https://grace.possum-fujita.ts.net:8443/auth/realms/nebari

nebariapp:
  enabled: true
  hostname: security.100-89-230-107.sslip.io

# Generate every compliance report after each completed scan (grace demo).
reports:
  autoGenerate: [poam, stig-checklist, sar, oscal-ar, inventory, vuln-export]

# The nebari CA (cert-manager ClusterIssuer nebari-ca-issuer -> nebari-ca-secret,
# CN=nebari-dev-ca) signs artifacts.100-89-230-107.sslip.io. Created by
# deploy.sh from cert-manager/nebari-ca-secret (key ca.crt only).
extraCACerts:
  secretName: nebari-ca

# Supply-chain provenance (DESIGN §12, docs/PROVENANCE.md).
provenance:
  enabled: true
  verifySignatures: true
  checkSBOM: true
  checkProvenance: true
  checkUpdates: true
  cosign:
    # Keyless (Fulcio/Rekor): Kubernetes release images. Other keyless or
    # key-signed images show as signed-but-unverified.
    certificateIdentityRegexp: '^krel-trust@k8s-releng-prod\.iam\.gserviceaccount\.com$'
    certificateOidcIssuerRegexp: '^https://accounts\.google\.com$'
  helmReleases:
    enabled: true
    # Bound only to security-posture-controls (the privileged worker), not to
    # the api or the scan worker.
    iUnderstandClusterSecretsRead: true
    # Chart update check (PROVENANCE.md): first source that knows the chart wins,
    # so the index.yaml repos go first and the OCI prefixes (one tag list per
    # chart, `<prefix>/<chart>`) last, quay before Docker Hub. Covers grace's
    # releases (helm list -A, 2026-10-03):
    chartRepos:
      - https://charts.jetstack.io                           # cert-manager
      - https://prometheus-community.github.io/helm-charts   # kube-prometheus-stack
      - https://grafana.github.io/helm-charts                # loki-stack, tempo
      - https://ray-project.github.io/kuberay-helm           # kuberay-operator
      - https://helm.dask.org                                # dask-kubernetes-operator
      - https://codecentric.github.io/helm-charts            # keycloakx
      - oci://quay.io/nebari/charts                          # nebari-*-pack, nebari-landing
      - oci://docker.io/envoyproxy/gateway-helm   # gateway-helm (eg)
    # Not listed: no grace release uses a bitnami or metallb chart (MetalLB is
    # the MicroK8s addon). The artifact-keeper, bifrost, checkmaite,
    # dask-gateway-pack and security-posture charts are not published in any of
    # these repos, so those releases stay "not checked".
  compat:
    internalService:
      enabled: true
      allowedNamespaces:
        - monitoring
        - observability

# Control evidence engine (DESIGN §13, docs/CONTROLS.md).
controlsEngine:
  enabled: true
  baseline: moderate
  # `admin` is the one approved holder of the nebari realm-admin role.
  adminSubjectsAllowlist: [admin]
  keycloak:
    url: http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth
    realm: nebari
    # Master-realm super-admin credentials: adminRealm "" tries nebari, then
    # master, and the master retry needs allowMasterFallback since the security
    # review M4 fix (without it every kc-* assertion was `unknown`, "admin login
    # failed (nebari: HTTP 400)"). Least privilege would be viewClient (a nebari
    # realm client with view-realm/view-users/view-events only); not set up on
    # grace yet.
    adminSecret:
      name: nebari-realm-admin-credentials
      namespace: keycloak
    allowMasterFallback: true
  # observability holds the kube-prometheus-stack Alertmanager and the Loki
  # promtail ships to; monitoring's lgtm-pack has no Alertmanager.
  lokiUrl: http://loki.observability.svc.cluster.local:3100
  prometheusUrl: http://kube-prom-stack-kube-prome-prometheus.observability.svc.cluster.local:9090
  alertmanagerUrl: http://kube-prom-stack-kube-prome-alertmanager.observability.svc.cluster.local:9093
