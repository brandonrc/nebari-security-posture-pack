# Main nginx config for the security-posture UI image (nginx-unprivileged base).
# Everything nginx writes at runtime lives under /tmp so the container can run
# with readOnlyRootFilesystem (chart mounts emptyDirs at /tmp and /var/cache/nginx).
worker_processes  auto;

error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_user_agent" rt=$request_time';
    access_log  /dev/stdout  main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;
    # Security headers live in /etc/nginx/snippets/security-headers.conf (docker/security-headers.conf),
    # included by the server block and by every location that sets its own add_header.

    gzip               on;
    gzip_comp_level    5;
    gzip_min_length    512;
    gzip_proxied       any;
    gzip_vary          on;
    gzip_types         text/plain text/css text/csv application/json application/javascript
                       text/javascript application/xml image/svg+xml;

    # Rendered from /etc/nginx/templates/default.conf.template at container start.
    include /tmp/nginx/conf.d/*.conf;
}
