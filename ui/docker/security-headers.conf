# Security headers (security review M6). Included at server level AND in every location that
# sets its own add_header (nginx drops inherited add_header directives in such locations).
# CSP is restricted to directives that cannot break the SPA's scripts/styles (no script-src /
# style-src yet: React/Recharts use inline style attributes; tighten after a browser check).
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
